name: M38 Run Water Behavior
on:
  push:
    branches: [orbit]
    paths:
      - 'tools/m38_water_behavior_patch.py'
      - '.github/workflows/m38-run-water-behavior.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: orbit
      - name: Apply patch
        run: python3 tools/m38_water_behavior_patch.py
      - name: Verify
        run: |
          grep -q 'particleWaterDensityRatio' engine/world_model/include/orbit/world_model/VolumeSchemas.hpp
          grep -q 'kWaterEntryPending' engine/volume_render/src/VolumeParticleGpuState.cpp
          grep -q 'VolumeParticleGpuSpawn) == 160U' engine/volume_render/include/orbit/volume_render/VolumeParticleGpuBinding.hpp
          grep -q 'Standing Water Response' engine/studio_ui/src/VolumeAuthoringM36.cpp
      - name: Commit
        run: |
          rm tools/m38_water_behavior_patch.py
          rm .github/workflows/m38-run-water-behavior.yml
          git config user.name orbit-ci
          git config user.email orbit-ci@users.noreply.github.com
          git add -A
          git commit -m 'Integrate M38 authored particle water behavior'
          git push origin HEAD:orbit
