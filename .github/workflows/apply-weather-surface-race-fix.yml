name: Apply weather surface race fix

on:
  push:
    branches: ["weather/0.0.5"]
    paths: [".github/workflows/apply-weather-surface-race-fix.yml"]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: weather/0.0.5
          fetch-depth: 0
      - name: Serialize completed surface uploads
        shell: python
        run: |
          from pathlib import Path

          p = Path("scripts/weather/surface_energy_bridge.gd")
          s = p.read_text(encoding="utf-8")

          old = '''var _local_uploaded_center := Vector3.ZERO
          var _local_requested_center := Vector3.ZERO
          var _terrain_ref: WeakRef
          '''.replace("          ", "")
          new = '''var _local_uploaded_center := Vector3.ZERO
          var _local_requested_center := Vector3.ZERO
          # Worker completion callbacks never touch WeatherNative directly. They only
          # park their result here; _process() applies it after both the build worker
          # and the serialized native weather worker are known to be idle.
          var _pending_global_surface_request: int = -1
          var _pending_global_surface_fields := PackedFloat32Array()
          var _pending_local_surface_request: int = -1
          var _pending_local_surface_center := Vector3.ZERO
          var _pending_local_surface_fields := PackedFloat32Array()
          var _terrain_ref: WeakRef
          '''.replace("          ", "")
          if old not in s:
              raise SystemExit("surface vars anchor not found")
          s = s.replace(old, new, 1)

          old = '''\t_maybe_queue_local_surface()
          \tif WeatherSystem.global_state_revision != _last_global_weather_revision:
          '''.replace("          ", "")
          new = '''\t_service_pending_surface_uploads()
          \t_maybe_queue_local_surface()
          \tif WeatherSystem.global_state_revision != _last_global_weather_revision:
          '''.replace("          ", "")
          if old not in s:
              raise SystemExit("surface process anchor not found")
          s = s.replace(old, new, 1)

          old = '''func _finish_global_surface_fields(request: int, packed: PackedFloat32Array) -> void:
          \tif WeatherSystem.native_worker_busy():
          \t\tcall_deferred("_finish_global_surface_fields", request, packed)
          \t\treturn
          \tif _global_task_id >= 0:
          \t\tWorkerThreadPool.wait_for_task_completion(_global_task_id)
          \t\t_global_task_id = -1
          \t_global_building = false
          \tif request != _global_request or _native == null or not is_instance_valid(_native):
          \t\treturn
          \t_native.call(&"set_global_surface_fields", packed)
          \t_surface_fields_uploaded = true
          \t_local_uploaded_center = Vector3.ZERO
          \t_local_requested_center = Vector3.ZERO
          \t_local_request += 1
          \t_push_solar_forcing()
          \t_global_surface_dirty = true
          \t_local_surface_dirty = true
          \t_service_surface_publication()
          
          
          '''.replace("          ", "")
          new = '''func _finish_global_surface_fields(request: int, packed: PackedFloat32Array) -> void:
          \t# This callback may run while WeatherSystem's native worker is still inside
          \t# step_global(). Never retry via call_deferred from here: Godot can drain
          \t# deferred calls repeatedly in one idle cycle, which turned the 8 MiB field
          \t# into an unbounded retry loop and eventually crashed the process.
          \t_pending_global_surface_request = request
          \t_pending_global_surface_fields = packed
          
          
          func _service_pending_surface_uploads() -> void:
          \tif _native == null or not is_instance_valid(_native):
          \t\treturn
          
          \t# Apply at most one completed surface job per frame. WeatherSystem launches
          \t# its next native solver job deferred, so a native call made here on the main
          \t# thread cannot overlap a newly scheduled solver invocation.
          \tif _pending_global_surface_request >= 0:
          \t\tif _global_task_id >= 0 and not WorkerThreadPool.is_task_completed(_global_task_id):
          \t\t\treturn
          \t\tif WeatherSystem.native_worker_busy():
          \t\t\treturn
          \t\tif _global_task_id >= 0:
          \t\t\tWorkerThreadPool.wait_for_task_completion(_global_task_id)
          \t\t\t_global_task_id = -1
          \t\t_global_building = false
          \t\tvar request := _pending_global_surface_request
          \t\tvar packed := _pending_global_surface_fields
          \t\t_pending_global_surface_request = -1
          \t\t_pending_global_surface_fields = PackedFloat32Array()
          \t\tif request != _global_request:
          \t\t\tif Planet.ready_state and not _surface_fields_uploaded:
          \t\t\t\t_upload_global_surface_fields()
          \t\t\treturn
          \t\t_native.call(&"set_global_surface_fields", packed)
          \t\t_surface_fields_uploaded = true
          \t\t_local_uploaded_center = Vector3.ZERO
          \t\t_local_requested_center = Vector3.ZERO
          \t\t_local_request += 1
          \t\t_push_solar_forcing()
          \t\t_global_surface_dirty = true
          \t\t_local_surface_dirty = true
          \t\treturn
          
          \tif _pending_local_surface_request >= 0:
          \t\tif _local_task_id >= 0 and not WorkerThreadPool.is_task_completed(_local_task_id):
          \t\t\treturn
          \t\tif WeatherSystem.native_worker_busy():
          \t\t\treturn
          \t\tif _local_task_id >= 0:
          \t\t\tWorkerThreadPool.wait_for_task_completion(_local_task_id)
          \t\t\t_local_task_id = -1
          \t\t_local_building = false
          \t\tvar request := _pending_local_surface_request
          \t\tvar center := _pending_local_surface_center
          \t\tvar fields := _pending_local_surface_fields
          \t\t_pending_local_surface_request = -1
          \t\t_pending_local_surface_center = Vector3.ZERO
          \t\t_pending_local_surface_fields = PackedFloat32Array()
          \t\tif request == _local_request and Planet.cfg != null:
          \t\t\tvar current_center := WeatherSystem.local_center.normalized()
          \t\t\tvar mismatch_m := acos(clampf(current_center.dot(center), -1.0, 1.0)) * Planet.cfg.planet_radius
          \t\t\tif mismatch_m <= LOCAL_CELL_M * 0.5:
          \t\t\t\t_native.call(&"set_local_surface_fields", fields)
          \t\t\t\t_local_uploaded_center = center
          \t\t\t\t_local_surface_dirty = true
          \t\tif request != _local_request:
          \t\t\t_start_local_surface_build()
          
          
          '''.replace("          ", "")
          if old not in s:
              raise SystemExit("global surface finish block not found")
          s = s.replace(old, new, 1)

          old = '''func _finish_local_surface_build(request: int, center: Vector3,
          \t\tfields: PackedFloat32Array) -> void:
          \tif WeatherSystem.native_worker_busy():
          \t\tcall_deferred("_finish_local_surface_build", request, center, fields)
          \t\treturn
          \tif _local_task_id >= 0:
          \t\tWorkerThreadPool.wait_for_task_completion(_local_task_id)
          \t\t_local_task_id = -1
          \t_local_building = false
          \tif request == _local_request and _native != null and is_instance_valid(_native):
          \t\tvar current_center := WeatherSystem.local_center.normalized()
          \t\tvar mismatch_m := acos(clampf(current_center.dot(center), -1.0, 1.0)) * Planet.cfg.planet_radius
          \t\tif mismatch_m <= LOCAL_CELL_M * 0.5:
          \t\t\t_native.call(&"set_local_surface_fields", fields)
          \t\t\t_local_uploaded_center = center
          \t\t\t_local_surface_dirty = true
          \t\t\t_service_surface_publication()
          \tif request != _local_request:
          \t\t_start_local_surface_build()
          
          
          '''.replace("          ", "")
          new = '''func _finish_local_surface_build(request: int, center: Vector3,
          \t\tfields: PackedFloat32Array) -> void:
          \t# Same rule as the global result: completion callback stores data only.
          \t# _service_pending_surface_uploads() owns all WeatherNative mutation.
          \t_pending_local_surface_request = request
          \t_pending_local_surface_center = center
          \t_pending_local_surface_fields = fields
          
          
          '''.replace("          ", "")
          if old not in s:
              raise SystemExit("local surface finish block not found")
          s = s.replace(old, new, 1)

          p.write_text(s, encoding="utf-8")
      - name: Sanity check no deferred surface retry remains
        shell: bash
        run: |
          ! grep -n 'call_deferred("_finish_global_surface_fields"' scripts/weather/surface_energy_bridge.gd
          ! grep -n 'call_deferred("_finish_local_surface_build"' scripts/weather/surface_energy_bridge.gd
          grep -n 'func _service_pending_surface_uploads' scripts/weather/surface_energy_bridge.gd
      - name: Commit fix
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/weather/surface_energy_bridge.gd
          git commit -m "Serialize weather surface uploads with solver worker"
          git push origin HEAD:weather/0.0.5
