name: Orbit UI searchable choices asset picker validation
on:
  push:
    branches: [orbit-ui-searchable-choices-assets]
permissions:
  contents: write
jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: orbit-ui-searchable-choices-assets
      - run: python3 tools/validation/searchable_choices_assets_patch.py
      - run: git diff --check
      - run: |
          grep -q 'std::vector<std::string> assetKinds;' engine/commands/include/orbit/commands/CommandRegistry.hpp
          grep -q 'cannot combine enumerated choices and project-asset filters' engine/commands/src/CommandRegistry.cpp
          grep -q 'kSearchableChoiceThreshold = 8U' engine/studio_ui/src/StudioExpansionShell.cpp
          grep -q 'quick-create-choice-search' engine/studio_ui/src/StudioExpansionShell.cpp
          grep -q 'owner_->content_->Search(query)' engine/studio_ui/src/StudioExpansionShell.cpp
          grep -q 'Advanced asset path' engine/studio_ui/src/StudioExpansionShell.cpp
          grep -q '"Material Instance"' engine/editor_model/src/AuthoringCommands.cpp
          grep -q '.assetKinds = {"Decal"}' engine/editor_model/src/MaterialAuthoringCommands.cpp
          grep -q 'SetContentService(&content)' apps/editor/src/Main.cpp
          git config user.name orbit-ui-validation
          git config user.email orbit-ui-validation@users.noreply.github.com
          git add engine/commands/include/orbit/commands/CommandRegistry.hpp engine/commands/src/CommandRegistry.cpp engine/editor_model/src/AuthoringCommands.cpp engine/editor_model/src/MaterialAuthoringCommands.cpp engine/studio_ui/include/orbit/studio_ui/StudioViewportPanels.hpp engine/studio_ui/src/StudioExpansionShell.cpp apps/editor/src/Main.cpp
          git commit -m "Add searchable choices and asset pickers"
          git push origin HEAD:orbit-ui-searchable-choices-assets
