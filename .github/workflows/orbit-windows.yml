name: Orbit Windows

on:
  push:
    branches: [orbit]
  pull_request:
    branches: [orbit]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Vulkan SDK
        shell: pwsh
        run: |
          choco install vulkan-sdk --version=1.4.350 -y --no-progress
          if ($LASTEXITCODE -ne 0) {
            throw "Vulkan SDK installation failed with exit code $LASTEXITCODE"
          }

          $sdk = "C:\VulkanSDK\1.4.350.0"
          if (-not (Test-Path "$sdk\Include\vulkan\vulkan.h") -or
              -not (Test-Path "$sdk\Lib\vulkan-1.lib")) {
            throw "Vulkan SDK was not installed at the expected path: $sdk"
          }

          "VULKAN_SDK=$sdk" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "$sdk\Bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Validate MCP adapters
        run: python -m py_compile tools/mcp_server/orbit_mcp_server.py tools/mcp_server/orbit_editor_mcp_server.py

      - name: Configure
        run: cmake -S . -B build -DORBIT_WARNINGS_AS_ERRORS=ON

      - name: Build V0.0.3 regression targets
        run: cmake --build build --config Release --target OrbitTerrainViewTests OrbitTerrainMorphRefreshTests OrbitTerrainRender OrbitPathGeometryTests OrbitPathSourceTests OrbitBuildServiceTests OrbitRuntimeProjectTests OrbitBuildCliTests OrbitPlatformServicesTests OrbitPlatformServicesSteamTests OrbitDocumentsTests OrbitUniverseCompositionTests OrbitSurfaceCompositionTests OrbitTerrainAuthoringCommandTests OrbitEditorRpcTests OrbitBuildPackageRpcTests OrbitProjectWorldRpcTests OrbitEditorWorldSessionTests OrbitWorldDocumentsModelTests OrbitActiveBodyModelTests OrbitWorldScopedFacadesTests OrbitEditorSessionRpcHostTests OrbitStudioSessionTests OrbitStudioWorkspaceTests OrbitViewportTargetRegistryTests OrbitViewportTargetRpcTests OrbitStudioWorkspaceRpcHostTests OrbitExplorerInspectorTests OrbitV003ScaffoldIntegrationTests

      - name: Test - Terrain view
        shell: pwsh
        run: |
          & "build/tests/Release/OrbitTerrainViewTests.exe"
          if ($LASTEXITCODE -ne 0) {
            throw "OrbitTerrainViewTests failed with exit code $LASTEXITCODE"
          }

      - name: Test - Terrain morph refresh
        shell: pwsh
        run: |
          & "build/tests/Release/OrbitTerrainMorphRefreshTests.exe"
          if ($LASTEXITCODE -ne 0) {
            throw "OrbitTerrainMorphRefreshTests failed with exit code $LASTEXITCODE"
          }

      - name: Test - Path geometry
        shell: pwsh
        run: |
          & "build/engine/path_geometry/Release/OrbitPathGeometryTests.exe"
          if ($LASTEXITCODE -ne 0) {
            throw "OrbitPathGeometryTests failed with exit code $LASTEXITCODE"
          }

      - name: Test - Path source
        shell: pwsh
        run: |
          & "build/engine/path_geometry/Release/OrbitPathSourceTests.exe"
          if ($LASTEXITCODE -ne 0) {
            throw "OrbitPathSourceTests failed with exit code $LASTEXITCODE"
          }

      - name: Test - Documents and multi-world catalog
        shell: pwsh
        run: |
          & "build/tests/Release/OrbitDocumentsTests.exe"
          if ($LASTEXITCODE -ne 0) {
            throw "OrbitDocumentsTests failed with exit code $LASTEXITCODE"
          }

      - name: Test - Universe composition
        shell: pwsh
        run: |
          & "build/engine/world_model/Release/OrbitUniverseCompositionTests.exe"
          if ($LASTEXITCODE -ne 0) {
            throw "OrbitUniverseCompositionTests failed with exit code $LASTEXITCODE"
          }

      - name: Test - Surface composition
        shell: pwsh
        run: |
          & "build/engine/surface_model/Release/OrbitSurfaceCompositionTests.exe"
          if ($LASTEXITCODE -ne 0) {
            throw "OrbitSurfaceCompositionTests failed with exit code $LASTEXITCODE"
          }

      - name: Test - Terrain capability authoring
        shell: pwsh
        run: |
          & "build/engine/editor_model/Release/OrbitTerrainAuthoringCommandTests.exe"
          if ($LASTEXITCODE -ne 0) {
            throw "OrbitTerrainAuthoringCommandTests failed with exit code $LASTEXITCODE"
          }

      - name: Test - Core editor RPC
        shell: pwsh
        run: |
          & "build/engine/editor_rpc/Release/OrbitEditorRpcTests.exe"
          if ($LASTEXITCODE -ne 0) {
            throw "OrbitEditorRpcTests failed with exit code $LASTEXITCODE"
          }

      - name: Test - Build package RPC
        shell: pwsh
        run: |
          & "build/engine/editor_rpc/Release/OrbitBuildPackageRpcTests.exe"
          if ($LASTEXITCODE -ne 0) {
            throw "OrbitBuildPackageRpcTests failed with exit code $LASTEXITCODE"
          }

      - name: Test - Project/world/body RPC
        shell: pwsh
        run: |
          & "build/engine/editor_rpc/Release/OrbitProjectWorldRpcTests.exe"
          if ($LASTEXITCODE -ne 0) {
            throw "OrbitProjectWorldRpcTests failed with exit code $LASTEXITCODE"
          }

      - name: Test - Editor world session
        shell: pwsh
        run: |
          & "build/engine/editor_session/Release/OrbitEditorWorldSessionTests.exe"
          if ($LASTEXITCODE -ne 0) {
            throw "OrbitEditorWorldSessionTests failed with exit code $LASTEXITCODE"
          }

      - name: Test - World-scoped authoring models
        shell: pwsh
        run: |
          & "build/engine/editor_session/Release/OrbitWorldDocumentsModelTests.exe"
          if ($LASTEXITCODE -ne 0) {
            throw "OrbitWorldDocumentsModelTests failed with exit code $LASTEXITCODE"
          }
          & "build/engine/editor_session/Release/OrbitActiveBodyModelTests.exe"
          if ($LASTEXITCODE -ne 0) {
            throw "OrbitActiveBodyModelTests failed with exit code $LASTEXITCODE"
          }
          & "build/engine/editor_session/Release/OrbitWorldScopedFacadesTests.exe"
          if ($LASTEXITCODE -ne 0) {
            throw "OrbitWorldScopedFacadesTests failed with exit code $LASTEXITCODE"
          }

      - name: Test - Session-aware RPC host
        shell: pwsh
        run: |
          & "build/engine/editor_rpc/Release/OrbitEditorSessionRpcHostTests.exe"
          if ($LASTEXITCODE -ne 0) {
            throw "OrbitEditorSessionRpcHostTests failed with exit code $LASTEXITCODE"
          }

      - name: Test - Studio session and workspace
        shell: pwsh
        run: |
          & "build/engine/studio_session/Release/OrbitStudioSessionTests.exe"
          if ($LASTEXITCODE -ne 0) {
            throw "OrbitStudioSessionTests failed with exit code $LASTEXITCODE"
          }
          & "build/engine/studio_session/Release/OrbitStudioWorkspaceTests.exe"
          if ($LASTEXITCODE -ne 0) {
            throw "OrbitStudioWorkspaceTests failed with exit code $LASTEXITCODE"
          }
          & "build/engine/studio_session/Release/OrbitStudioWorkspaceRpcHostTests.exe"
          if ($LASTEXITCODE -ne 0) {
            throw "OrbitStudioWorkspaceRpcHostTests failed with exit code $LASTEXITCODE"
          }

      - name: Test - Multi-viewport targeting
        shell: pwsh
        run: |
          & "build/engine/studio_session/Release/OrbitViewportTargetRegistryTests.exe"
          if ($LASTEXITCODE -ne 0) {
            throw "OrbitViewportTargetRegistryTests failed with exit code $LASTEXITCODE"
          }
          & "build/engine/studio_session/Release/OrbitViewportTargetRpcTests.exe"
          if ($LASTEXITCODE -ne 0) {
            throw "OrbitViewportTargetRpcTests failed with exit code $LASTEXITCODE"
          }

      - name: Test - Explorer and inspector
        shell: pwsh
        run: |
          & "build/tests/Release/OrbitExplorerInspectorTests.exe"
          if ($LASTEXITCODE -ne 0) {
            throw "OrbitExplorerInspectorTests failed with exit code $LASTEXITCODE"
          }

      - name: Test - Build service
        shell: pwsh
        run: |
          & "build/engine/build/Release/OrbitBuildServiceTests.exe"
          if ($LASTEXITCODE -ne 0) {
            throw "OrbitBuildServiceTests failed with exit code $LASTEXITCODE"
          }

      - name: Test - Runtime project
        shell: pwsh
        run: |
          & "build/engine/runtime_project/Release/OrbitRuntimeProjectTests.exe"
          if ($LASTEXITCODE -ne 0) {
            throw "OrbitRuntimeProjectTests failed with exit code $LASTEXITCODE"
          }

      - name: Test - Build CLI
        shell: pwsh
        run: |
          & "build/apps/build/Release/OrbitBuildCliTests.exe" "build/apps/build/Release/OrbitBuild.exe"
          if ($LASTEXITCODE -ne 0) {
            throw "OrbitBuildCliTests failed with exit code $LASTEXITCODE"
          }

      - name: Test - Platform services
        shell: pwsh
        run: |
          & "build/engine/platform_services/Release/OrbitPlatformServicesTests.exe"
          if ($LASTEXITCODE -ne 0) {
            throw "OrbitPlatformServicesTests failed with exit code $LASTEXITCODE"
          }

      - name: Test - Steam provider
        shell: pwsh
        run: |
          & "build/engine/platform_services/steam/Release/OrbitPlatformServicesSteamTests.exe"
          if ($LASTEXITCODE -ne 0) {
            throw "OrbitPlatformServicesSteamTests failed with exit code $LASTEXITCODE"
          }

      - name: Test - V0.0.3 scaffold integration
        shell: pwsh
        run: |
          & "build/tests/Release/OrbitV003ScaffoldIntegrationTests.exe" "build/apps/player/Release/OrbitPlayer.exe"
          if ($LASTEXITCODE -ne 0) {
            throw "OrbitV003ScaffoldIntegrationTests failed with exit code $LASTEXITCODE"
          }

      - name: Build
        run: cmake --build build --config Release

      - name: Test
        # Hosted GitHub Windows runners expose no Vulkan physical device.
        # GPU tests are still compiled above; execute them on Vulkan-capable
        # developer/self-hosted machines via plain ctest.
        run: ctest --test-dir build -C Release -LE gpu --output-on-failure

      - name: Package Windows build
        shell: pwsh
        run: |
          $package = "dist/Orbit-Windows-Release"
          $symbols = "$package/symbols"
          $mcp = "$package/tools/mcp_server"

          New-Item -ItemType Directory -Force -Path $package | Out-Null
          New-Item -ItemType Directory -Force -Path $symbols | Out-Null
          New-Item -ItemType Directory -Force -Path $mcp | Out-Null

          Copy-Item "build/apps/launcher/Release/OrbitLauncher.exe" "$package/OrbitLauncher.exe"
          Copy-Item "build/apps/sandbox/Release/OrbitSandbox.exe" "$package/OrbitSandbox.exe"
          Copy-Item "build/apps/editor/Release/OrbitStudio.exe" "$package/OrbitStudio.exe"
          Copy-Item "build/apps/build/Release/OrbitBuild.exe" "$package/OrbitBuild.exe"
          Copy-Item "build/apps/player/Release/OrbitPlayer.exe" "$package/OrbitPlayer.exe"
          Copy-Item "build/apps/build/Release/dxcompiler.dll" "$package/dxcompiler.dll"
          Copy-Item "tools/mcp_server/orbit_mcp_server.py" "$mcp/orbit_mcp_server.py"
          Copy-Item "tools/mcp_server/orbit_editor_mcp_server.py" "$mcp/orbit_editor_mcp_server.py"
          Copy-Item "tools/mcp_server/requirements.txt" "$mcp/requirements.txt"

          if (Test-Path "build/apps/launcher/Release/OrbitLauncher.pdb") {
            Copy-Item "build/apps/launcher/Release/OrbitLauncher.pdb" "$symbols/OrbitLauncher.pdb"
          }

          if (Test-Path "build/apps/sandbox/Release/OrbitSandbox.pdb") {
            Copy-Item "build/apps/sandbox/Release/OrbitSandbox.pdb" "$symbols/OrbitSandbox.pdb"
          }

          if (Test-Path "build/apps/editor/Release/OrbitStudio.pdb") {
            Copy-Item "build/apps/editor/Release/OrbitStudio.pdb" "$symbols/OrbitStudio.pdb"
          }

          if (Test-Path "build/apps/build/Release/OrbitBuild.pdb") {
            Copy-Item "build/apps/build/Release/OrbitBuild.pdb" "$symbols/OrbitBuild.pdb"
          }

          if (Test-Path "build/apps/player/Release/OrbitPlayer.pdb") {
            Copy-Item "build/apps/player/Release/OrbitPlayer.pdb" "$symbols/OrbitPlayer.pdb"
          }

          @"
          Orbit Windows Release
          =====================

          Start the terrain/runtime sandbox with:
              OrbitLauncher.exe

          Start the authoring environment with:
              OrbitStudio.exe [project-directory-or-Project.orbit.toml]

          Validate/cook an Orbit project headlessly with:
              OrbitBuild.exe <project-directory-or-Project.orbit.toml> --validate
              OrbitBuild.exe <project-directory-or-Project.orbit.toml> --cook

          Assemble a project package with:
              OrbitBuild.exe <project-directory-or-Project.orbit.toml> --package

          OrbitPlayer.exe is the project-driven runtime copied into project packages.
          It accepts a cooked package directory or OrbitBuildManifest.toml as its first argument.

          Orbit Studio structured automation:
              JSON-RPC 2.0: 127.0.0.1:4320
              MCP adapter: tools/mcp_server/orbit_editor_mcp_server.py

          The launcher starts OrbitSandbox.exe and writes runtime logs to:
              logs/

          On an unhandled crash, Orbit writes:
              *-crash-*.log
              *-crash-*.dmp

          Keep the symbols/ directory when investigating crash dumps.
          "@ | Set-Content -Encoding UTF8 "$package/README.txt"

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: Orbit-Windows-Release
          path: dist/Orbit-Windows-Release
          if-no-files-found: error
          retention-days: 14
