name: Orbit Windows

on:
  push:
    branches: [orbit, pre0.0.9-experimental]
  pull_request:
    branches: [orbit, pre0.0.9-experimental]
  workflow_dispatch:

concurrency:
  group: orbit-windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        validation_tools: ['OFF', 'ON']

    steps:
      - uses: actions/checkout@v4

      # Clean-source acceptance (formerly the V0.0.3 clean workflow): the hosted
      # runner starts from a fresh checkout, so the build below is a from-scratch
      # rebuild. The checkout must carry authoritative project data only.
      - name: Verify checkout has no derived project cache
        shell: pwsh
        run: |
          $derived = Get-ChildItem -Path . -Directory -Recurse -Filter DerivedData -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match '[\\/]\.orbit[\\/]DerivedData$' }
          if ($derived) {
            $derived | ForEach-Object { Write-Host $_.FullName }
            throw "Source checkout unexpectedly contains an Orbit DerivedData cache."
          }

      - name: Install Vulkan SDK
        shell: pwsh
        run: |
          choco install vulkan-sdk --version=1.4.350 -y --no-progress
          if ($LASTEXITCODE -ne 0) {
            throw "Vulkan SDK installation failed with exit code $LASTEXITCODE"
          }

          $sdk = "C:\VulkanSDK\1.4.350.0"
          if (-not (Test-Path "$sdk\Include\vulkan\vulkan.h") -or
              -not (Test-Path "$sdk\Lib\vulkan-1.lib")) {
            throw "Vulkan SDK was not installed at the expected path: $sdk"
          }

          "VULKAN_SDK=$sdk" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "$sdk\Bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Validate MCP adapters
        run: python -m py_compile tools/mcp_server/orbit_editor_mcp_server.py tools/mcp_server/orbit_docs_mcp_server.py

      - name: Configure
        run: cmake -S . -B build -DORBIT_WARNINGS_AS_ERRORS=ON -DORBIT_ENABLE_VALIDATION_TOOLS=${{ matrix.validation_tools }}

      # Every library, test and application. This includes the production
      # executables (OrbitStudio, OrbitPlayer, OrbitBuild) and every GPU test.
      - name: Build
        run: cmake --build build --config Release

      # The V0.0.3 acceptance suite (documents, composition, RPC, studio session,
      # build/package CLI, platform services, scaffold integration, ...) is part
      # of CTest like every other test, so one invocation covers it.
      - name: Test
        # Hosted GitHub Windows runners expose no Vulkan physical device.
        # GPU tests are still compiled above; execute them on Vulkan-capable
        # developer/self-hosted machines via plain ctest.
        run: ctest --test-dir build -C Release -LE gpu --output-on-failure

      - name: Verify production executables
        shell: pwsh
        run: |
          foreach ($exe in @(
              "build/apps/editor/Release/OrbitStudio.exe",
              "build/apps/player/Release/OrbitPlayer.exe",
              "build/apps/build/Release/OrbitBuild.exe")) {
            if (-not (Test-Path $exe)) {
              throw "$exe was not produced by the build."
            }
          }

      - name: Verify source checkout remains authoritative-only
        shell: pwsh
        run: |
          $derived = Get-ChildItem -Path . -Directory -Recurse -Filter DerivedData -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match '[\\/]\.orbit[\\/]DerivedData$' }
          if ($derived) {
            $derived | ForEach-Object { Write-Host $_.FullName }
            throw "The test suite leaked derived project authority into the source checkout."
          }

      - name: Package Windows build
        shell: pwsh
        run: |
          $package = "dist/Orbit-Windows-Release"
          $symbols = "$package/symbols"
          $mcp = "$package/tools/mcp_server"

          New-Item -ItemType Directory -Force -Path $package | Out-Null
          New-Item -ItemType Directory -Force -Path $symbols | Out-Null
          New-Item -ItemType Directory -Force -Path $mcp | Out-Null

          Copy-Item "build/apps/editor/Release/OrbitStudio.exe" "$package/OrbitStudio.exe"
          Copy-Item "build/apps/build/Release/OrbitBuild.exe" "$package/OrbitBuild.exe"
          Copy-Item "build/apps/player/Release/OrbitPlayer.exe" "$package/OrbitPlayer.exe"
          Copy-Item "build/apps/build/Release/dxcompiler.dll" "$package/dxcompiler.dll"
          Copy-Item "tools/mcp_server/orbit_editor_mcp_server.py" "$mcp/orbit_editor_mcp_server.py"
          Copy-Item "tools/mcp_server/requirements.txt" "$mcp/requirements.txt"

          foreach ($pdb in @(
              "build/apps/editor/Release/OrbitStudio.pdb",
              "build/apps/build/Release/OrbitBuild.pdb",
              "build/apps/player/Release/OrbitPlayer.pdb")) {
            if (Test-Path $pdb) {
              Copy-Item $pdb "$symbols/$(Split-Path $pdb -Leaf)"
            }
          }

          @"
          Orbit Windows Release
          =====================

          Start the authoring environment with:
              OrbitStudio.exe [project-directory-or-Project.orbit.toml]

          Validate/cook an Orbit project headlessly with:
              OrbitBuild.exe <project-directory-or-Project.orbit.toml> --validate
              OrbitBuild.exe <project-directory-or-Project.orbit.toml> --cook

          Assemble a project package with:
              OrbitBuild.exe <project-directory-or-Project.orbit.toml> --package

          OrbitPlayer.exe is the project-driven runtime copied into project packages.
          It accepts a cooked package directory or OrbitBuildManifest.toml as its first argument.

          Orbit Studio structured automation:
              JSON-RPC 2.0: 127.0.0.1:4320
              MCP adapter: tools/mcp_server/orbit_editor_mcp_server.py

          On an unhandled crash, Orbit writes:
              *-crash-*.log
              *-crash-*.dmp

          Keep the symbols/ directory when investigating crash dumps.
          "@ | Set-Content -Encoding UTF8 "$package/README.txt"

      - name: Upload Windows build
        if: matrix.validation_tools == 'OFF'
        uses: actions/upload-artifact@v4
        with:
          name: Orbit-Windows-Release
          path: dist/Orbit-Windows-Release
          if-no-files-found: error
          retention-days: 14
