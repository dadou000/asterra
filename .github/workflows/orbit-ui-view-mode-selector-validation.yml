name: Orbit UI view-mode selector validation

on:
  push:
    branches:
      - orbit-ui-view-mode-selector

permissions:
  contents: write

jobs:
  view-mode-selector:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: orbit-ui-view-mode-selector

      - name: Apply view-mode selector patch
        run: python3 tools/validation/view_mode_selector_patch.py

      - name: Verify focused diff
        shell: bash
        run: |
          git diff --check
          test "$(git diff --name-only | wc -l)" -eq 3
          grep -q '##viewport-mode-compact' engine/studio_ui/src/StudioExpansionShell.cpp
          grep -q 'InvokeViewportMode' engine/studio_ui/src/StudioViewportPanelsBase.cpp
          grep -q 'automationVisible = true' engine/studio_ui/src/StudioViewportPanelsBase.cpp
          grep -q 'kViewportPerspectiveCommand' engine/studio_ui/src/StudioViewportPanelsBase.cpp
          grep -q 'kViewportBodyMapCommand' engine/studio_ui/src/StudioViewportPanelsBase.cpp
          grep -q 'kViewportDebugCommand' engine/studio_ui/src/StudioViewportPanelsBase.cpp
          ! grep -q 'orbit.viewport.mode.perspective' engine/studio_ui/src/StudioViewportPanelsBase.cpp
          ! grep -q 'orbit.viewport.mode.body-map' engine/studio_ui/src/StudioViewportPanelsBase.cpp
          ! grep -q 'orbit.viewport.mode.debug' engine/studio_ui/src/StudioViewportPanelsBase.cpp

      - name: Commit validation change
        shell: bash
        run: |
          git config user.name "orbit-ui-validation"
          git config user.email "orbit-ui-validation@users.noreply.github.com"
          git add engine/studio_ui/include/orbit/studio_ui/StudioViewportPanels.hpp
          git add engine/studio_ui/src/StudioExpansionShell.cpp
          git add engine/studio_ui/src/StudioViewportPanelsBase.cpp
          git commit -m "Collapse viewport modes into compact selector"
          git push origin HEAD:orbit-ui-view-mode-selector
