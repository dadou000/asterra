name: Orbit UI view-mode selector validation

on:
  push:
    branches:
      - orbit-ui-view-mode-selector

permissions:
  contents: write

jobs:
  view-mode-selector:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: orbit-ui-view-mode-selector

      - name: Collapse viewport mode buttons into selector
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          header = Path('engine/studio_ui/include/orbit/studio_ui/StudioViewportPanels.hpp')
          base = Path('engine/studio_ui/src/StudioViewportPanelsBase.cpp')
          shell = Path('engine/studio_ui/src/StudioExpansionShell.cpp')

          header_text = header.read_text(encoding='utf-8')
          old_header = '''    // View-mode commands are world-registry commands surfaced through row 2's
    // existing ContextToolbar extension seam. They are reinstalled after a
    // world switch because EditorWorldSession intentionally replaces its
    // complete command graph with the new world state.
    void EnsureViewportModeCommands();
    void UnregisterViewportModeCommands() noexcept;
'''
          new_header = '''    // View-mode commands remain world-registry commands for command search,
    // MCP and automation. Row 2 invokes the same commands through one compact
    // selector instead of registering three permanent toolbar contributions.
    // They are reinstalled after a world switch because EditorWorldSession
    // intentionally replaces its complete command graph with the new world.
    void EnsureViewportModeCommands();
    void UnregisterViewportModeCommands() noexcept;
    void InvokeViewportMode(studio_session::ViewportMode mode);
'''
          if old_header not in header_text:
              raise SystemExit('viewport-mode header anchor not found')
          header.write_text(header_text.replace(old_header, new_header, 1), encoding='utf-8')

          base_text = base.read_text(encoding='utf-8')
          old_state = '''struct StudioViewportPanels::ViewportModeCommandState
{
    StudioViewportPanels* owner{nullptr};
    bool contributionsRegistered{false};
};
'''
          new_state = '''struct StudioViewportPanels::ViewportModeCommandState
{
    StudioViewportPanels* owner{nullptr};
};
'''
          if old_state not in base_text:
              raise SystemExit('viewport command state anchor not found')
          base_text = base_text.replace(old_state, new_state, 1)

          contrib_start = base_text.find('    if (!viewportModeCommandState_->contributionsRegistered)\n')
          ctor_marker = '\nStudioViewportPanels::StudioViewportPanels(\n'
          contrib_end = base_text.find(ctor_marker, contrib_start)
          if contrib_start < 0 or contrib_end < 0:
              raise SystemExit('viewport contribution block not found')

          method = '''    // Row 2 owns the compact presentation; command objects stay registered
    // independently for automation and command search.
}

void StudioViewportPanels::InvokeViewportMode(
    const studio_session::ViewportMode mode)
{
    if (session_ == nullptr ||
        !session_->World().HasWorld())
    {
        throw std::logic_error(
            "Viewport mode selection requires an active Studio world.");
    }

    EnsureViewportModeCommands();

    switch (mode)
    {
    case studio_session::ViewportMode::Perspective:
        session_->World().CommandRegistry().Invoke(
            kViewportPerspectiveCommand);
        return;

    case studio_session::ViewportMode::BodyMap:
        session_->World().CommandRegistry().Invoke(
            kViewportBodyMapCommand);
        return;

    case studio_session::ViewportMode::Debug:
        session_->World().CommandRegistry().Invoke(
            kViewportDebugCommand);
        return;

    case studio_session::ViewportMode::System:
    {
        const std::string_view id =
            expansion_.ControlledViewportId();
        if (session_->Viewports().Find(id) == nullptr)
        {
            throw std::logic_error(
                "Controlled viewport is unavailable.");
        }
        session_->Viewports().SetMode(
            id,
            studio_session::ViewportMode::System);
        return;
    }
    }

    throw std::logic_error("Unsupported viewport mode.");
}
'''
          # The contribution block starts immediately after the closing brace of
          # EnsureViewportModeCommands(). Replace it with that closing brace plus
          # the compact selector bridge.
          before = base_text[:contrib_start]
          if not before.endswith('    registerMode(\n        kViewportDebugCommand,\n        "Debug",\n        studio_session::ViewportMode::Debug);\n\n'):
              raise SystemExit('unexpected viewport command block ending')
          base_text = before + method + base_text[contrib_end:]
          base.write_text(base_text, encoding='utf-8')

          shell_text = shell.read_text(encoding='utf-8')
          old_shell = '''        if (target != nullptr)
        {
            switch (target->mode)
            {
'''
          new_shell = '''        if (target != nullptr)
        {
            static constexpr std::array<std::string_view, 4>
                kViewportModes{
                    "Perspective",
                    "Body Map",
                    "Debug",
                    "System"
                };
            static constexpr std::array<studio_session::ViewportMode, 4>
                kViewportModeValues{
                    studio_session::ViewportMode::Perspective,
                    studio_session::ViewportMode::BodyMap,
                    studio_session::ViewportMode::Debug,
                    studio_session::ViewportMode::System
                };

            i32 viewportMode = 0;
            switch (target->mode)
            {
            case studio_session::ViewportMode::Perspective:
                viewportMode = 0;
                break;
            case studio_session::ViewportMode::BodyMap:
                viewportMode = 1;
                break;
            case studio_session::ViewportMode::Debug:
                viewportMode = 2;
                break;
            case studio_session::ViewportMode::System:
                viewportMode = 3;
                break;
            }

            context.SameLine();
            if (context.Combo(
                    "##viewport-mode-compact",
                    kViewportModes,
                    viewportMode))
            {
                viewportMode = std::clamp(viewportMode, 0, 3);
                try
                {
                    owner_->InvokeViewportMode(
                        kViewportModeValues[
                            static_cast<std::size_t>(viewportMode)]);
                    owner_->status_.clear();
                    target = owner_->session_->Viewports().Find(id);
                }
                catch (const std::exception& exception)
                {
                    owner_->status_ = exception.what();
                }
            }

            switch (target->mode)
            {
'''
          if old_shell not in shell_text:
              raise SystemExit('viewport presentation selector anchor not found')
          shell.write_text(shell_text.replace(old_shell, new_shell, 1), encoding='utf-8')
          PY

      - name: Verify focused diff
        shell: bash
        run: |
          git diff --check
          test "$(git diff --name-only | sort)" = "$(printf '%s\n' \
            engine/studio_ui/include/orbit/studio_ui/StudioViewportPanels.hpp \
            engine/studio_ui/src/StudioExpansionShell.cpp \
            engine/studio_ui/src/StudioViewportPanelsBase.cpp | sort)"
          grep -q '##viewport-mode-compact' engine/studio_ui/src/StudioExpansionShell.cpp
          grep -q 'InvokeViewportMode' engine/studio_ui/src/StudioViewportPanelsBase.cpp
          grep -q 'automationVisible = true' engine/studio_ui/src/StudioViewportPanelsBase.cpp
          grep -q 'kViewportPerspectiveCommand' engine/studio_ui/src/StudioViewportPanelsBase.cpp
          grep -q 'kViewportBodyMapCommand' engine/studio_ui/src/StudioViewportPanelsBase.cpp
          grep -q 'kViewportDebugCommand' engine/studio_ui/src/StudioViewportPanelsBase.cpp
          ! grep -q 'orbit.viewport.mode.perspective' engine/studio_ui/src/StudioViewportPanelsBase.cpp
          ! grep -q 'orbit.viewport.mode.body-map' engine/studio_ui/src/StudioViewportPanelsBase.cpp
          ! grep -q 'orbit.viewport.mode.debug' engine/studio_ui/src/StudioViewportPanelsBase.cpp

      - name: Commit validation change
        shell: bash
        run: |
          git config user.name "orbit-ui-validation"
          git config user.email "orbit-ui-validation@users.noreply.github.com"
          git add \
            engine/studio_ui/include/orbit/studio_ui/StudioViewportPanels.hpp \
            engine/studio_ui/src/StudioExpansionShell.cpp \
            engine/studio_ui/src/StudioViewportPanelsBase.cpp
          git commit -m "Collapse viewport modes into compact selector"
          git push origin HEAD:orbit-ui-view-mode-selector
