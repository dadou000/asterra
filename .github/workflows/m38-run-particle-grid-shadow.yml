name: M38 Run Particle Grid Shadow
on:
  push:
    branches: [orbit]
    paths:
      - 'tools/m38_particle_grid_shadow_patch.py'
      - '.github/workflows/m38-run-particle-grid-shadow.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: orbit
      - name: Apply patch
        run: python3 tools/m38_particle_grid_shadow_patch.py
      - name: Verify
        run: |
          grep -q 'g_particleLightGrid' engine/volume_render/src/VolumeParticleRenderer.cpp
          grep -q 'GridTransmittance' engine/volume_render/src/VolumeParticleRenderer.cpp
          grep -q '32769U' engine/studio_ui/tests/VolumeParticleRenderBridgeTests.cpp
      - name: Commit
        run: |
          rm tools/m38_particle_grid_shadow_patch.py
          rm .github/workflows/m38-run-particle-grid-shadow.yml
          git config user.name orbit-ci
          git config user.email orbit-ci@users.noreply.github.com
          git add -A
          git commit -m 'Add M38 particle grid transmittance'
          git push origin HEAD:orbit
