name: Apply Weather L0 20km Upgrade

on:
  push:
    branches:
      - weather/0.0.5
    paths:
      - tools/apply_weather_l0_20km_upgrade.py
      - .github/workflows/apply-weather-l0-20km-upgrade.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: weather/0.0.5
      - name: Repair one-shot migration driver
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tools/apply_weather_l0_20km_upgrade.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace("\\tfor (int c = 0; c < surface.cells; ++c) {\\n", "\\tfor (int c = 0; c < a.cells; ++c) {\\n")
          text = text.replace("\\tfor (int c = 0; c < surface.cells; ++c) {\\n', 'surface omp", "\\tfor (int c = 0; c < a.cells; ++c) {\\n', 'surface omp")
          path.write_text(text, encoding='utf-8')
          PY
      - name: Apply L0 atmosphere migration
        run: python3 tools/apply_weather_l0_20km_upgrade.py
      - name: Correct 30-layer surface optical integration
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('native/weather/src/weather_native.cpp')
          text = path.read_text(encoding='utf-8')
          start = text.index('void WeatherNative::surface_pass(Atmosphere &a, SurfaceState &surface, bool is_global, float dt) {')
          end = text.index('\n\nvoid WeatherNative::vertical_pass', start)
          block = text[start:end]
          needle = '\t\tfloat cloud = std::clamp(1.0f - std::exp(-condensate * 1800.0f), 0.0f, 1.0f);'
          if needle not in block:
              raise SystemExit('surface cloud integration target missing')
          block = block.replace(needle, '\t\tcondensate *= old_six_level_column_scale();\n' + needle, 1)
          text = text[:start] + block + text[end:]
          path.write_text(text, encoding='utf-8')
          PY
      - name: Commit migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add native/weather scripts/weather scripts/ui tests
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Upgrade L0 weather to 1024x512x30"
            git push origin HEAD:weather/0.0.5
          fi
