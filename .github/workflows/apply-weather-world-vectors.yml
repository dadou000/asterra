name: Apply weather world vector debug patch

on:
  push:
    branches: ["weather/0.0.5"]
    paths:
      - ".github/workflows/apply-weather-world-vectors.yml"
      - "tools/apply_weather_world_vectors_patch.py"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: weather/0.0.5
          fetch-depth: 0

      - name: Apply patch
        run: python tools/apply_weather_world_vectors_patch.py

      - name: Sanity checks
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'get_local_wind_rgba' native/weather/src/weather_wind_sampler.cpp
          grep -q 'World cell wind vectors' scripts/ui/weather_map.gd
          grep -q '_set_speed_slider_from_pointer' scripts/ui/weather_map.gd
          grep -q 'WeatherWindVectorDebug' scripts/ui/weather_map.gd
          test -f shaders/weather_world_wind_vectors.gdshader

      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add native/weather/src/weather_native.h \
                  native/weather/src/weather_wind_sampler.h \
                  native/weather/src/weather_wind_sampler.cpp \
                  scripts/ui/weather_map.gd
          if git diff --cached --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git commit -m 'Fix weather warp slider and add world wind vectors'
          git push origin HEAD:weather/0.0.5
