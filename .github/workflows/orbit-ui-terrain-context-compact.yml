name: Orbit UI terrain context compact validation

on:
  push:
    branches:
      - orbit-ui-terrain-context-compact

permissions:
  contents: write

jobs:
  patch-terrain-context:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: orbit-ui-terrain-context-compact

      - name: Compact terrain context row
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('engine/studio_ui/src/StudioExpansionShell.cpp')
          text = path.read_text(encoding='utf-8')

          start_marker = '''    context.SameLine();\n\n    switch (owner_->terrainTool_)\n    {\n'''
          end_marker = '''    }\n}\n\nvoid StudioExpansionShell::DrawTerrainToolProperties'''

          start = text.find(start_marker)
          if start < 0:
              raise SystemExit('terrain helper block start marker not found')
          end = text.find(end_marker, start)
          if end < 0:
              raise SystemExit('terrain helper block end marker not found')

          replacement = '''    if (IsTerrainSplineTool(owner_->terrainTool_))\n    {\n        context.SameLine();\n        context.MutedText(\n            std::format(\n                "{} pts",\n                owner_->terrainSplinePoints_.size()));\n    }\n}\n\nvoid StudioExpansionShell::DrawTerrainToolProperties'''

          updated = text[:start] + replacement + text[end + len(end_marker):]

          if updated == text:
              raise SystemExit('terrain context replacement produced no change')

          function_start = updated.find('void StudioExpansionShell::DrawTerrainContext')
          function_end = updated.find('void StudioExpansionShell::DrawTerrainToolProperties', function_start)
          context_body = updated[function_start:function_end]
          if 'parameters in Properties' in context_body or 'Pick / inspect' in context_body:
              raise SystemExit('verbose terrain row helper text remains')

          path.write_text(updated, encoding='utf-8')
          PY

      - name: Verify focused diff
        shell: bash
        run: |
          git diff --check
          git diff -- engine/studio_ui/src/StudioExpansionShell.cpp
          changed="$(git diff --name-only)"
          test "$changed" = "engine/studio_ui/src/StudioExpansionShell.cpp"

      - name: Commit validation change
        shell: bash
        run: |
          git config user.name "orbit-ui-validation"
          git config user.email "orbit-ui-validation@users.noreply.github.com"
          git add engine/studio_ui/src/StudioExpansionShell.cpp
          git commit -m "Compact terrain context row"
          git push origin HEAD:orbit-ui-terrain-context-compact
