name: M38 Run Splash GPU
on:
  push:
    branches: [orbit]
    paths:
      - 'tools/m38_splash_gpu_patch.py'
      - '.github/workflows/m38-run-splash-gpu.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: orbit
      - name: Apply patch
        run: python3 tools/m38_splash_gpu_patch.py
      - name: Verify
        run: |
          grep -q 'MaximumSplashEventCount = 4096U' engine/volume_render/include/orbit/volume_render/VolumeParticleGpuState.hpp
          grep -q 'RWStructuredBuffer<SplashEvent> g_splashes' engine/volume_render/src/VolumeParticleGpuState.cpp
          grep -q 'kSplashVertexShader' engine/volume_render/src/VolumeParticleRenderer.cpp
          grep -q 'MaximumSplashEventCount \* 6U' engine/volume_render/src/VolumeParticleRenderer.cpp
      - name: Commit
        run: |
          rm tools/m38_splash_gpu_patch.py
          rm .github/workflows/m38-run-splash-gpu.yml
          git config user.name orbit-ci
          git config user.email orbit-ci@users.noreply.github.com
          git add -A
          git commit -m 'Integrate M38 GPU water splash stream'
          git push origin HEAD:orbit
