name: M38 Run Shared Particle Light Grid
on:
  push:
    branches: [orbit]
    paths:
      - 'tools/m38_shared_particle_light_grid_patch.py'
      - '.github/workflows/m38-run-shared-particle-light-grid.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: orbit
      - name: Apply patch
        run: python3 tools/m38_shared_particle_light_grid_patch.py
      - name: Verify
        run: |
          python3 - <<'PY'
          from pathlib import Path
          particle_h = Path('engine/volume_render/include/orbit/volume_render/VolumeParticleRenderer.hpp').read_text()
          volume = Path('engine/volume_render/src/UniversalVolumeRendererBase.inc').read_text()
          direct = Path('engine/lighting/src/DirectLighting.cpp').read_text()
          test = Path('engine/studio_ui/tests/VolumeParticleRenderBridgeTests.cpp').read_text()
          assert 'ParticleLightGrid() noexcept' in particle_h
          assert 'ParticleLightGridReady() const noexcept' in particle_h
          assert 'StructuredBuffer<uint4> g_particleLightGrid : register(t7)' in volume
          assert 'Texture2D g_depth;\n[[vk::binding(8, 0)]]\n[[vk::combinedImageSampler]]\nSamplerState g_depthSampler;' in volume
          assert 'Texture2D g_baseRoughness;\n[[vk::binding(4, 0)]]\n[[vk::combinedImageSampler]]\nSamplerState g_baseSampler;' in direct
          assert 'ParticleGridTransmittance' in volume
          assert 'ParticleLightGridReady' in test
          PY
      - name: Commit
        run: |
          rm tools/m38_shared_particle_light_grid_patch.py
          rm .github/workflows/m38-run-shared-particle-light-grid.yml
          git config user.name orbit-ci
          git config user.email orbit-ci@users.noreply.github.com
          git add -A
          git commit -m 'Repair M38 shared light-grid bindings'
          git push origin HEAD:orbit
