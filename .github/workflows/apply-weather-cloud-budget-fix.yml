name: Apply Weather Cloud Budget Fix

on:
  push:
    branches:
      - weather/0.0.5
    paths:
      - tools/apply_weather_cloud_budget_fix.py
      - .github/workflows/apply-weather-cloud-budget-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: weather/0.0.5
      - name: Apply cloud budget patch
        run: python3 tools/apply_weather_cloud_budget_fix.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add native/weather/src/weather_native_oklahoma.cpp
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Fix runaway atmospheric cloud water budget"
            git push origin HEAD:weather/0.0.5
          fi
