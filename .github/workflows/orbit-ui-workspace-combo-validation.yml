name: Orbit UI workspace combo validation

on:
  push:
    branches:
      - orbit-ui-workspace-combo

permissions:
  contents: write

jobs:
  workspace-combo:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: orbit-ui-workspace-combo
      - name: Apply patch
        run: python3 tools/validation/workspace_mode_combo_patch.py
      - name: Verify and commit
        shell: bash
        run: |
          git diff --check
          test "$(git diff --name-only)" = "engine/studio_ui/src/StudioViewportPanels.cpp"
          grep -q '##workspace-mode-compact' engine/studio_ui/src/StudioViewportPanels.cpp
          grep -q 'ActivateWorkspace(' engine/studio_ui/src/StudioViewportPanels.cpp
          grep -q 'Workspace: Scene' engine/studio_ui/src/StudioViewportPanels.cpp
          grep -q 'Workspace: Shading' engine/studio_ui/src/StudioViewportPanels.cpp
          ! grep -q 'workspace-strip-Scene' engine/studio_ui/src/StudioViewportPanels.cpp
          git config user.name "orbit-ui-validation"
          git config user.email "orbit-ui-validation@users.noreply.github.com"
          git add engine/studio_ui/src/StudioViewportPanels.cpp
          git commit -m "Collapse workspace strip into compact mode selector"
          git push origin HEAD:orbit-ui-workspace-combo
