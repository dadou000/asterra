name: Apply Weather L0 Pressure Floor

on:
  push:
    branches:
      - weather/0.0.5
    paths:
      - .github/workflows/apply-weather-l0-pressure-floor.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: weather/0.0.5
      - name: Adapt saturation pressure floor to 20 km top
        run: |
          python3 - <<'PY'
          from pathlib import Path
          paths = [
              Path('native/weather/src/weather_native.cpp'),
              Path('native/weather/src/weather_native_oklahoma.cpp'),
          ]
          changed = 0
          for path in paths:
              text = path.read_text(encoding='utf-8')
              count = text.count(', 12000.0f, 115000.0f)')
              text = text.replace(', 12000.0f, 115000.0f)', ', 6000.0f, 115000.0f)')
              path.write_text(text, encoding='utf-8')
              changed += count
              print(path, count)
          if changed < 2:
              raise SystemExit(f'expected at least two old pressure clamps, found {changed}')
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add native/weather/src/weather_native.cpp native/weather/src/weather_native_oklahoma.cpp
          git commit -m "Adapt cloud thermodynamics to 20 km model top"
          git push origin HEAD:weather/0.0.5
