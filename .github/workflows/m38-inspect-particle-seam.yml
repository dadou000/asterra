name: M38 Inspect Particle Seam
on:
  push:
    branches: [orbit]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: orbit
      - name: Inspect particle seam
        shell: bash
        run: |
          grep -n -C 35 -E 'particleOutputGeneration_|volumeParticleRenderer_\.Advance|volumeParticleRenderer_\.Draw|BuildVolumeParticleRenderBatch' engine/studio_ui/src/StudioViewportRenderer.cpp || true
