name: Terrain rebase shading fix

on:
  push:
    branches:
      - pre/0.1.0
    paths:
      - .github/workflows/terrain-rebase-shading-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pre/0.1.0
          fetch-depth: 0

      - name: Patch terrain shading
        shell: python
        run: |
          from pathlib import Path

          shader_path = Path('shaders/spherical_geometry_clipmap_cached_surface.gdshader')
          shader = shader_path.read_text(encoding='utf-8')

          old = '''\t\tfloat edit_flat_w = abs(edit_h) > 0.001 ? 0.90 : 0.0;\n\t\tfloat biome_flat_w = smoothstep(0.3, 6.0, abs(biome_h)) * 0.35;\n\t\tv_geom_normal_weight = max(normal_level <= 1 ? 0.28 : 0.10,\n\t\t\tmax(edit_flat_w, biome_flat_w));'''
          new = '''\t\t// Ordinary terrain must not inherit a triangle-diagonal normal. The clipmap\n\t\t// lattice is deliberately re-centred during handoff, so a persistent blend\n\t\t// with dFdx/dFdy geometry normals makes one side of the surface change\n\t\t// shading whenever that tessellation phase changes. Smooth cached normals\n\t\t// are the production normal; retain only a small geometric contribution for\n\t\t// genuinely sharp live edits and the dense micro-relief patch.\n\t\tfloat edit_geom_w = abs(edit_h) > 0.001 ? 0.20 : 0.0;\n\t\tfloat biome_geom_w = smoothstep(1.5, 10.0, abs(biome_h)) * 0.06;\n\t\tfloat micro_geom_w = micro_layer > 0.5 ? 0.10 : 0.0;\n\t\tv_geom_normal_weight = max(micro_geom_w, max(edit_geom_w, biome_geom_w));'''
          if shader.count(old) != 1:
              raise SystemExit('expected terrain normal-weight block exactly once')
          shader = shader.replace(old, new)

          old = '''\tfloat geom_shading_w = max(\n\t\t(1.0 - smoothstep(2.0, 5.0, v_level)) * mix(0.04, 0.18, v_micro_layer),\n\t\tv_geom_normal_weight);\n\tvec3 wn = normalize(mix(smooth_n, geom_n, geom_shading_w));'''
          new = '''\t// Triangle derivatives are a fallback/detail signal only. They must not be a\n\t// level-dependent baseline because the triangle diagonal is clipmap-relative.\n\tfloat geom_shading_w = clamp(v_geom_normal_weight, 0.0, 1.0);\n\tvec3 wn = normalize(mix(smooth_n, geom_n, geom_shading_w));'''
          if shader.count(old) != 1:
              raise SystemExit('expected fragment geometry-normal blend exactly once')
          shader = shader.replace(old, new)

          old = 'float slope_deg = acos(clamp(dot(geom_n, up), 0.0, 1.0)) * 57.2957795131;'
          new = 'float slope_deg = acos(clamp(dot(wn, up), 0.0, 1.0)) * 57.2957795131;'
          if shader.count(old) != 1:
              raise SystemExit('expected slope classification normal exactly once')
          shader = shader.replace(old, new)

          old = '''author_cached_material_post(\n\t\t\t\tbiome, camera_dist, geom_n,'''
          new = '''author_cached_material_post(\n\t\t\t\tbiome, camera_dist, wn,'''
          if shader.count(old) != 1:
              raise SystemExit('expected authored material geometry normal exactly once')
          shader = shader.replace(old, new)
          shader_path.write_text(shader, encoding='utf-8')

          normal_path = Path('shaders/terrain_clipmap_cache_sampling.gdshaderinc')
          normal_src = normal_path.read_text(encoding='utf-8')
          old = '''\tfloat hxp = terrain_cached_or_macro_with_morph(dxp, level, morph, offset_xp).y;\n\tfloat hxn = terrain_cached_or_macro_with_morph(dxn, level, morph, offset_xn).y;\n\tfloat hyp = terrain_cached_or_macro_with_morph(dyp, level, morph, offset_yp).y;\n\tfloat hyn = terrain_cached_or_macro_with_morph(dyn, level, morph, offset_yn).y;'''
          new = '''\tfloat hxp = terrain_cached_or_macro_with_morph(dxp, level, morph, offset_xp).y;\n\tfloat hxn = terrain_cached_or_macro_with_morph(dxn, level, morph, offset_xn).y;\n\tfloat hyp = terrain_cached_or_macro_with_morph(dyp, level, morph, offset_yp).y;\n\tfloat hyn = terrain_cached_or_macro_with_morph(dyn, level, morph, offset_yn).y;\n\n\t// The visible surface composes deformation and per-biome terrain after the\n\t// cache sample. Include those same terms in the smooth normal so shading and\n\t// slope classification no longer need the triangle-face normal to reveal them.\n\t// Both branches are controlled by uniforms and collapse to zero work when the\n\t// corresponding feature is inactive.\n\tif (u_edit_ready > 0.5 || u_active_deform_ready > 0.5) {\n\t\thxp += terrain_edit_delta(dxp, u_planet_radius);\n\t\thxn += terrain_edit_delta(dxn, u_planet_radius);\n\t\thyp += terrain_edit_delta(dyp, u_planet_radius);\n\t\thyn += terrain_edit_delta(dyn, u_planet_radius);\n\t}\n\tif (u_biome_layer_count > 0) {\n\t\tfloat biome_spacing_m = ring_spacing(level);\n\t\thxp += asterra_biome_profile_height(dxp, biome_spacing_m);\n\t\thxn += asterra_biome_profile_height(dxn, biome_spacing_m);\n\t\thyp += asterra_biome_profile_height(dyp, biome_spacing_m);\n\t\thyn += asterra_biome_profile_height(dyn, biome_spacing_m);\n\t}'''
          if normal_src.count(old) != 1:
              raise SystemExit('expected central normal height block exactly once')
          normal_src = normal_src.replace(old, new)
          normal_path.write_text(normal_src, encoding='utf-8')

      - name: Commit patch and remove one-shot workflow
        shell: bash
        run: |
          rm -f .github/workflows/terrain-rebase-shading-fix.yml
          git config user.name "asterra-ci"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add shaders/spherical_geometry_clipmap_cached_surface.gdshader \
                  shaders/terrain_clipmap_cache_sampling.gdshaderinc \
                  .github/workflows/terrain-rebase-shading-fix.yml
          git diff --cached --check
          git commit -m "Make terrain shading independent of clipmap tessellation"
          git push origin HEAD:pre/0.1.0
