name: Orbit M20A

on:
  push:
    branches: [orbit]
    paths:
      - '.github/workflows/orbit-m20a.yml'
      - 'engine/documents/**'
      - 'engine/commands/**'
      - 'engine/scene/**'
      - 'engine/schema/**'
      - 'engine/selection/**'
      - 'engine/world_model/**'
      - 'engine/surface/**'
      - 'engine/surface_model/**'
      - 'engine/editor_model/**'
      - 'engine/editor_session/**'
      - 'engine/editor_rpc/**'
      - 'engine/studio_session/**'
      - 'engine/studio_ui/**'
      - 'apps/editor/**'
      - 'tests/V003ScaffoldIntegrationTests.cpp'
      - 'docs/V0.0.3_WORLD_AUTHORING.md'
  pull_request:
    branches: [orbit]
    paths:
      - 'engine/documents/**'
      - 'engine/commands/**'
      - 'engine/scene/**'
      - 'engine/schema/**'
      - 'engine/selection/**'
      - 'engine/world_model/**'
      - 'engine/surface/**'
      - 'engine/surface_model/**'
      - 'engine/editor_model/**'
      - 'engine/editor_session/**'
      - 'engine/editor_rpc/**'
      - 'engine/studio_session/**'
      - 'engine/studio_ui/**'
      - 'apps/editor/**'
      - 'tests/V003ScaffoldIntegrationTests.cpp'
      - 'docs/V0.0.3_WORLD_AUTHORING.md'

concurrency:
  group: orbit-m20a-${{ github.ref }}
  cancel-in-progress: false

jobs:
  m20a:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Vulkan SDK
        shell: pwsh
        run: |
          choco install vulkan-sdk --version=1.4.350 -y --no-progress
          if ($LASTEXITCODE -ne 0) {
            throw "Vulkan SDK installation failed with exit code $LASTEXITCODE"
          }
          $sdk = "C:\VulkanSDK\1.4.350.0"
          "VULKAN_SDK=$sdk" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "$sdk\Bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Validate MCP adapter
        run: python -m py_compile tools/mcp_server/orbit_editor_mcp_server.py

      - name: Configure
        run: cmake -S . -B build -DORBIT_WARNINGS_AS_ERRORS=ON

      - name: Build M20A targets
        run: cmake --build build --config Release --target OrbitDocumentsTests OrbitUniverseCompositionTests OrbitSurfaceCompositionTests OrbitTerrainAuthoringCommandTests OrbitRockyPlanetAuthoringTests OrbitEditorWorldSessionTests OrbitTransactionalCompositionTests OrbitWorldDocumentsModelTests OrbitActiveBodyModelTests OrbitWorldScopedFacadesTests OrbitProjectWorldRpcTests OrbitEditorSessionRpcHostTests OrbitStudioSessionTests OrbitStudioRuntimeBindingTests OrbitStudioTerrainRuntimeBridgeTests OrbitStudioTerrainRebuildSchedulerTests OrbitStudioAuthoringBindingTests OrbitBezierHandleEditorTests OrbitStudioWorkspaceTests OrbitProjectBrowserModelTests OrbitProjectSettingsModelTests OrbitStudioWorkspaceRpcHostTests OrbitUniverseBoundRoutePlannerTests OrbitUniverseBoundPathCacheTests OrbitViewportTargetRegistryTests OrbitViewportTargetRpcTests OrbitStudioViewportCameraTests OrbitStudioViewportNavigationTests OrbitStudioViewportPresentationTests OrbitStudioUi OrbitStudio

      - name: Test M20A
        shell: pwsh
        run: |
          $tests = @(
            "build/tests/Release/OrbitDocumentsTests.exe",
            "build/engine/world_model/Release/OrbitUniverseCompositionTests.exe",
            "build/engine/surface_model/Release/OrbitSurfaceCompositionTests.exe",
            "build/engine/editor_model/Release/OrbitTerrainAuthoringCommandTests.exe",
            "build/engine/editor_model/Release/OrbitRockyPlanetAuthoringTests.exe",
            "build/engine/editor_session/Release/OrbitEditorWorldSessionTests.exe",
            "build/engine/editor_session/Release/OrbitTransactionalCompositionTests.exe",
            "build/engine/editor_session/Release/OrbitWorldDocumentsModelTests.exe",
            "build/engine/editor_session/Release/OrbitActiveBodyModelTests.exe",
            "build/engine/editor_session/Release/OrbitWorldScopedFacadesTests.exe",
            "build/engine/editor_rpc/Release/OrbitProjectWorldRpcTests.exe",
            "build/engine/editor_rpc/Release/OrbitEditorSessionRpcHostTests.exe",
            "build/engine/studio_session/Release/OrbitStudioSessionTests.exe",
            "build/engine/studio_session/Release/OrbitStudioRuntimeBindingTests.exe",
            "build/engine/studio_session/Release/OrbitStudioTerrainRuntimeBridgeTests.exe",
            "build/engine/studio_session/Release/OrbitStudioTerrainRebuildSchedulerTests.exe",
            "build/engine/studio_session/Release/OrbitStudioAuthoringBindingTests.exe",
            "build/engine/studio_session/Release/OrbitBezierHandleEditorTests.exe",
            "build/engine/studio_session/Release/OrbitStudioWorkspaceTests.exe",
            "build/engine/studio_session/Release/OrbitProjectBrowserModelTests.exe",
            "build/engine/studio_session/Release/OrbitProjectSettingsModelTests.exe",
            "build/engine/studio_session/Release/OrbitStudioWorkspaceRpcHostTests.exe",
            "build/engine/studio_session/Release/OrbitUniverseBoundRoutePlannerTests.exe",
            "build/engine/studio_session/Release/OrbitUniverseBoundPathCacheTests.exe",
            "build/engine/studio_session/Release/OrbitViewportTargetRegistryTests.exe",
            "build/engine/studio_session/Release/OrbitViewportTargetRpcTests.exe",
            "build/engine/studio_ui/Release/OrbitStudioViewportCameraTests.exe",
            "build/engine/studio_ui/Release/OrbitStudioViewportNavigationTests.exe",
            "build/engine/studio_ui/Release/OrbitStudioViewportPresentationTests.exe"
          )

          foreach ($test in $tests) {
            & $test
            if ($LASTEXITCODE -ne 0) {
              throw "$test failed with exit code $LASTEXITCODE"
            }
          }
