name: Orbit UI Quick Create Browse All validation

on:
  push:
    branches:
      - orbit-ui-quick-create-browse-all

permissions:
  contents: write

jobs:
  quick-create-browse-all:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: orbit-ui-quick-create-browse-all
      - name: Apply Browse All patch
        run: python3 tools/validation/quick_create_browse_all_patch.py
      - name: Verify and commit
        shell: bash
        run: |
          git diff --check
          test "$(git diff --name-only | wc -l)" -eq 3
          grep -q 'Browse All…##quick-create-browse-all' engine/studio_ui/src/StudioExpansionShell.cpp
          grep -q 'studio-quick-create-browser-popup' engine/studio_ui/src/StudioExpansionShell.cpp
          grep -q 'quickCreateBrowseQuery_' engine/studio_ui/include/orbit/studio_ui/StudioExpansionShell.hpp
          grep -q 'quickCreateBrowseSelection_' engine/studio_ui/include/orbit/studio_ui/StudioExpansionShell.hpp
          grep -q 'IsQuickCreateCatalogEntry' engine/studio_ui/src/StudioExpansionShell.cpp
          grep -q 'kStudioQuickCreateCommandSurface' engine/studio_ui/src/StudioExpansionShell.cpp
          grep -q 'More Extensions' engine/studio_ui/src/StudioExpansionShell.cpp
          grep -q 'parameter.required' engine/studio_ui/include/orbit/studio_ui/CommandPaletteModel.hpp
          grep -q 'visibleMatches.size() >= 12U' engine/studio_ui/src/StudioExpansionShell.cpp
          grep -q 'UiKey::Escape' engine/studio_ui/src/StudioExpansionShell.cpp
          grep -q 'UiKey::Enter' engine/studio_ui/src/StudioExpansionShell.cpp
          git config user.name "orbit-ui-validation"
          git config user.email "orbit-ui-validation@users.noreply.github.com"
          git add engine/studio_ui/include/orbit/studio_ui/CommandPaletteModel.hpp engine/studio_ui/include/orbit/studio_ui/StudioExpansionShell.hpp engine/studio_ui/src/StudioExpansionShell.cpp
          git commit -m "Add searchable Quick Create browser"
          git push origin HEAD:orbit-ui-quick-create-browse-all
