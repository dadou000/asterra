name: M38 Run Temporal OIT Retry 2
on:
  push:
    branches: [orbit]
    paths:
      - '.github/workflows/m38-run-temporal-oit-retry2.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: orbit
      - name: Correct Studio seams and apply
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tools/m38_temporal_oit_patch.py')
          t=p.read_text()
          old_frame="""'''            const u32 particleFrameIndex =\\n                frameIndex % framesInFlight_;'''"""
          new_frame="""'''                const u32 particleFrameIndex =\\n                    frameIndex % framesInFlight_;'''"""
          if old_frame in t:
              t=t.replace(old_frame,new_frame,1)
          old_call="""'''                            camera,\\n                            cameraRelativeToParticleOrigin);'''"""
          new_call="""'''                            camera,\\n                            cameraRelativeToParticleOrigin,\\n                            particleFrameIndex);'''"""
          if old_call not in t:
              raise SystemExit('old temporal draw-call patch seam not found')
          t=t.replace(old_call,new_call,1)
          replace_target="""'''                            camera,\\n                            cameraRelativeToParticleOrigin,\\n                            particleFrameIndex);''',\n'''                            camera,\\n                            cameraRelativeToParticleOrigin,\\n                            particleFrameIndex,\\n                            particleTemporalHistoryKey);'''"""
          # the existing replacement's old side is now the current soft-depth signature
          t=t.replace(new_call, "'''                            camera,\\n                            cameraRelativeToParticleOrigin,\\n                            particleFrameIndex);'''", 1)
          p.write_text(t)
          PY
          python3 tools/m38_temporal_oit_patch.py
      - name: Verify
        run: |
          grep -q 'motionReject' engine/volume_render/src/VolumeParticleRenderer.cpp
          grep -q 'oitTemporalPipeline_' engine/volume_render/include/orbit/volume_render/VolumeParticleRenderer.hpp
          grep -q 'particleTemporalHistoryKey' engine/studio_ui/src/StudioViewportRenderer.cpp
          grep -q 'particleFrameIndex,' engine/studio_ui/src/StudioViewportRenderer.cpp
      - name: Commit
        run: |
          rm tools/m38_temporal_oit_patch.py
          rm .github/workflows/m38-run-temporal-oit.yml
          rm .github/workflows/m38-run-temporal-oit-retry.yml
          rm .github/workflows/m38-run-temporal-oit-retry2.yml
          git config user.name orbit-ci
          git config user.email orbit-ci@users.noreply.github.com
          git add -A
          git commit -m 'Add temporal stabilization for M38 transparency'
          git push origin HEAD:orbit
