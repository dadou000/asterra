name: M38 Run Soft Depth
on:
  push:
    branches: [orbit]
    paths:
      - 'tools/m38_soft_depth_patch.py'
      - '.github/workflows/m38-run-soft-depth.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: orbit
      - name: Apply patch
        run: python3 tools/m38_soft_depth_patch.py
      - name: Verify
        run: |
          grep -q 'SetRenderTargetsReadOnlyDepth' engine/rhi/include/orbit/rhi/Command.hpp
          grep -q 'VK_IMAGE_LAYOUT_DEPTH_READ_ONLY_OPTIMAL' engine/rhi/vulkan/src/VulkanCommands.cpp
          grep -q 'SoftDepth' engine/volume_render/src/VolumeParticleRenderer.cpp
          grep -q 'sampledTextures = 1U' engine/volume_render/src/VolumeParticleRenderer.cpp
      - name: Commit
        run: |
          rm tools/m38_soft_depth_patch.py
          rm .github/workflows/m38-run-soft-depth.yml
          git config user.name orbit-ci
          git config user.email orbit-ci@users.noreply.github.com
          git add -A
          git commit -m 'Add soft depth intersections for M38 effects'
          git push origin HEAD:orbit
