name: M38 Run Terrain Normals Water

on:
  push:
    paths:
      - 'tools/patch_m38_terrain_normals_water.py'
      - '.github/workflows/m38-run-terrain-normals-water.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: orbit
      - name: Apply patch
        run: python3 tools/patch_m38_terrain_normals_water.py
      - name: Verify
        run: |
          grep -q 'TerrainSurfaceNormal' engine/volume_render/src/VolumeParticleGpuState.cpp
          grep -q 'standingWaterDepthMeters' engine/volume_render/src/VolumeParticleGpuState.cpp
          grep -q 'particleTerrainCollisionPages,' engine/studio_ui/src/StudioViewportRenderer.cpp
          grep -q 'particleDeltaSeconds);' engine/studio_ui/src/StudioViewportRenderer.cpp
      - name: Commit
        run: |
          rm tools/patch_m38_terrain_normals_water.py
          rm .github/workflows/m38-run-terrain-normals-water.yml
          git config user.name orbit-ci
          git config user.email orbit-ci@users.noreply.github.com
          git add -A
          git commit -m 'Integrate M38 terrain normals and water interaction'
          git push origin HEAD:orbit
