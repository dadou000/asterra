name: Apply weather runtime performance follow-up

on:
  push:
    branches: ["weather/0.0.5"]
    paths: [".github/workflows/apply-weather-runtime-performance.yml"]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: weather/0.0.5
          fetch-depth: 0
      - name: Fix weather worker publication scheduling
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              s = p.read_text(encoding="utf-8")
              if old not in s:
                  raise SystemExit(f"pattern not found in {path}: {old[:100]!r}")
              p.write_text(s.replace(old, new, 1), encoding="utf-8")

          p = Path("scripts/weather/weather_system.gd")
          s = p.read_text(encoding="utf-8")
          s = s.replace(
              "var _map_was_open: bool = false\n",
              "var _map_was_open: bool = false\n"
              "var _worker_schedule_deferred: bool = false\n"
              "var _heavy_publication_frame: int = -1\n",
              1,
          )

          old = '''\t_poll_weather_worker()
          \tif not native_worker_busy():
          \t\t_apply_pending_native_controls()
          \t\t_schedule_weather_worker()
          
          \t_service_weather_publication(delta)
          \t_sync_weather_map_material()
          '''.replace("          ", "")
          new = '''\t_poll_weather_worker()
          \tif not native_worker_busy():
          \t\t_apply_pending_native_controls()
          
          \t# Completed native state gets an idle main-thread publication window before
          \t# another solver job is launched. This prevents high warp from starving
          \t# cloud/map/surface uploads indefinitely.
          \t_service_weather_publication(delta)
          \tif not _has_pending_weather_publication():
          \t\t_request_weather_worker_schedule()
          \t_sync_weather_map_material()
          '''.replace("          ", "")
          if old not in s:
              raise SystemExit("weather process scheduling block not found")
          s = s.replace(old, new, 1)

          anchor = '''func _schedule_weather_worker() -> void:
          '''.replace("          ", "")
          helpers = '''func _request_weather_worker_schedule() -> void:
          \tif _worker_schedule_deferred or _weather_task_id >= 0 or _native == null:
          \t\treturn
          \t_worker_schedule_deferred = true
          \tcall_deferred("_schedule_weather_worker_deferred")
          
          
          func _schedule_weather_worker_deferred() -> void:
          \t_worker_schedule_deferred = false
          \tif _native == null or native_worker_busy() or _has_pending_weather_publication():
          \t\treturn
          \t_apply_pending_native_controls()
          \t_schedule_weather_worker()
          
          
          func heavy_publication_this_frame() -> bool:
          \treturn _heavy_publication_frame == Engine.get_process_frames()
          
          
          func claim_heavy_publication() -> bool:
          \tvar frame := Engine.get_process_frames()
          \tif _heavy_publication_frame == frame:
          \t\treturn false
          \t_heavy_publication_frame = frame
          \treturn true
          
          
          func _has_pending_weather_publication() -> bool:
          \treturn _global_weather_dirty or _local_weather_dirty or _global_analysis_dirty \\
          \t\tor (_weather_map_open() and _local_analysis_dirty)
          
          
          func _schedule_weather_worker() -> void:
          '''.replace("          ", "")
          if anchor not in s:
              raise SystemExit("schedule function anchor not found")
          s = s.replace(anchor, helpers, 1)

          old = '''func _service_weather_publication(delta: float) -> void:
          \tif _native == null or native_worker_busy():
          \t\treturn
          \t_weather_publish_accum += delta
          \t_analysis_publish_accum += delta
          '''.replace("          ", "")
          new = '''func _service_weather_publication(delta: float) -> void:
          \t_weather_publish_accum += delta
          \t_analysis_publish_accum += delta
          \tif _native == null or native_worker_busy():
          \t\treturn
          '''.replace("          ", "")
          if old not in s:
              raise SystemExit("publication accumulator block not found")
          s = s.replace(old, new, 1)

          # Every full global reduction/upload must claim the frame. Local 192x192
          # outputs are intentionally exempt because they are comparatively small.
          for fn in [
              "func _publish_global_weather() -> void:\n",
              "func _publish_global_diagnostics(update_gpu: bool) -> void:\n",
              "func _publish_global_products(update_gpu: bool) -> void:\n",
              "func _publish_global_convective() -> void:\n",
          ]:
              if fn not in s:
                  raise SystemExit(f"missing publisher {fn.strip()}")
              s = s.replace(fn, fn + "\tif not claim_heavy_publication():\n\t\treturn\n", 1)

          p.write_text(s, encoding="utf-8")

          # Surface output shares the same per-frame heavy-work token so it cannot
          # coincide with the cloud/analysis 8 MiB global transfers.
          p = Path("scripts/weather/surface_energy_bridge.gd")
          s = p.read_text(encoding="utf-8")
          old = '''\tif _global_surface_dirty:
          \t\tvar global_result: Variant = _native.call(&"get_global_surface_rgba")
          '''.replace("          ", "")
          new = '''\tif _global_surface_dirty:
          \t\tif not WeatherSystem.claim_heavy_publication():
          \t\t\treturn
          \t\tvar global_result: Variant = _native.call(&"get_global_surface_rgba")
          '''.replace("          ", "")
          if old not in s:
              raise SystemExit("surface global publisher block not found")
          s = s.replace(old, new, 1)
          p.write_text(s, encoding="utf-8")

          # Wind is another full 1024x512 RGBAF pack/upload. Defer it to a free frame.
          p = Path("scripts/ui/weather_map.gd")
          s = p.read_text(encoding="utf-8")
          s = s.replace(
              "## WeatherSystem; wind streaks use the selected native six-layer vector field.\n",
              "## WeatherSystem; wind streaks use the selected native 30-layer vector field.\n",
              1,
          )
          old = '''func _refresh_live_wind() -> void:
          \tif WeatherSystem.native_worker_busy():
          \t\treturn
          '''.replace("          ", "")
          new = '''func _refresh_live_wind() -> void:
          \tif WeatherSystem.native_worker_busy() or WeatherSystem.heavy_publication_this_frame():
          \t\treturn
          \tif not WeatherSystem.claim_heavy_publication():
          \t\treturn
          '''.replace("          ", "")
          if old not in s:
              raise SystemExit("wind refresh guard not found")
          s = s.replace(old, new, 1)
          p.write_text(s, encoding="utf-8")

          # The GDScript refinement scan is substantial too. Run it on the next free
          # frame after the three native analysis reductions have completed.
          p = Path("scripts/weather/weather_refinement_manager_v2.gd")
          s = p.read_text(encoding="utf-8")
          old = '''\tif WeatherSystem.analysis_revision >= 0 and WeatherSystem.analysis_revision != _last_analysis_revision:
          \t\t_last_analysis_revision = WeatherSystem.analysis_revision
          \t\t_scan_weather()
          '''.replace("          ", "")
          new = '''\tif not WeatherSystem.heavy_publication_this_frame() \\
          \t\t\tand WeatherSystem.analysis_revision >= 0 \\
          \t\t\tand WeatherSystem.analysis_revision != _last_analysis_revision:
          \t\t_last_analysis_revision = WeatherSystem.analysis_revision
          \t\t_scan_weather()
          '''.replace("          ", "")
          if old not in s:
              raise SystemExit("refinement revision guard not found")
          s = s.replace(old, new, 1)
          p.write_text(s, encoding="utf-8")

          # Static integrity checks.
          ws = Path("scripts/weather/weather_system.gd").read_text(encoding="utf-8")
          assert "call_deferred(\"_schedule_weather_worker_deferred\")" in ws
          assert "func claim_heavy_publication()" in ws
          assert "_has_pending_weather_publication()" in ws
          assert ws.count("if not claim_heavy_publication():") == 4
          se = Path("scripts/weather/surface_energy_bridge.gd").read_text(encoding="utf-8")
          assert "WeatherSystem.claim_heavy_publication()" in se
          wm = Path("scripts/ui/weather_map.gd").read_text(encoding="utf-8")
          assert "WeatherSystem.heavy_publication_this_frame()" in wm
          assert "native 30-layer vector field" in wm
          wr = Path("scripts/weather/weather_refinement_manager_v2.gd").read_text(encoding="utf-8")
          assert "not WeatherSystem.heavy_publication_this_frame()" in wr

      - name: Commit follow-up
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/weather/weather_system.gd scripts/weather/surface_energy_bridge.gd scripts/weather/weather_refinement_manager_v2.gd scripts/ui/weather_map.gd
          git commit -m "Stagger weather publication between worker jobs"
          git push origin HEAD:weather/0.0.5
