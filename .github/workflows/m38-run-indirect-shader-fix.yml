name: M38 Run Indirect Shader Fix
on:
  push:
    branches: [orbit]
    paths:
      - 'tools/m38_indirect_shader_fix.py'
      - '.github/workflows/m38-run-indirect-shader-fix.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: orbit
      - name: Apply patch
        run: python3 tools/m38_indirect_shader_fix.py
      - name: Verify
        run: |
          grep -q 'AppendParticleIndex' engine/volume_render/src/VolumeParticleGpuState.cpp
          grep -q 'AppendSplashIndex' engine/volume_render/src/VolumeParticleGpuState.cpp
          grep -q 'AppendDropletIndex' engine/volume_render/src/VolumeParticleGpuState.cpp
          ! grep -q 'RWStructuredBuffer<uint> indices' engine/volume_render/src/VolumeParticleGpuState.cpp
      - name: Commit
        run: |
          rm tools/m38_indirect_shader_fix.py
          rm .github/workflows/m38-run-indirect-shader-fix.yml
          git config user.name orbit-ci
          git config user.email orbit-ci@users.noreply.github.com
          git add -A
          git commit -m 'Fix M38 indirect draw-list shader helpers'
          git push origin HEAD:orbit
