name: M38 Run Temporal OIT
on:
  push:
    branches: [orbit]
    paths:
      - 'tools/m38_temporal_oit_patch.py'
      - '.github/workflows/m38-run-temporal-oit.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: orbit
      - name: Apply patch
        run: python3 tools/m38_temporal_oit_patch.py
      - name: Verify
        run: |
          grep -q 'MaximumPersistentSplashCount' engine/volume_render/include/orbit/volume_render/VolumeParticleGpuState.hpp
          grep -q 'motionReject' engine/volume_render/src/VolumeParticleRenderer.cpp
          grep -q 'oitTemporalPipeline_' engine/volume_render/include/orbit/volume_render/VolumeParticleRenderer.hpp
          grep -q 'particleTemporalHistoryKey' engine/studio_ui/src/StudioViewportRenderer.cpp
      - name: Commit
        run: |
          rm tools/m38_temporal_oit_patch.py
          rm .github/workflows/m38-run-temporal-oit.yml
          git config user.name orbit-ci
          git config user.email orbit-ci@users.noreply.github.com
          git add -A
          git commit -m 'Add temporal stabilization for M38 transparency'
          git push origin HEAD:orbit
