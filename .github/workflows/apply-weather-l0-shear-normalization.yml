name: Apply Weather L0 Shear Normalization

on:
  push:
    branches:
      - weather/0.0.5
    paths:
      - .github/workflows/apply-weather-l0-shear-normalization.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: weather/0.0.5
      - name: Normalize vertical diagnostics for 30 levels
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('native/weather/src/weather_native.cpp')
          text = path.read_text(encoding='utf-8')

          old = 'float low_level = 1.0f - float(layer) / float(LAYERS - 1);'
          new = 'float low_level = std::clamp(1.0f - APPROX_HEIGHT_M[layer] / 12800.0f, 0.0f, 1.0f);'
          if old not in text:
              raise SystemExit('local perturbation height target missing')
          text = text.replace(old, new, 1)

          old = '''\t\t\t\tint shear_other = layer < LAYERS - 1 ? above_off : below_off;
\t\t\t\t__m256 u_here = _mm256_loadu_ps(&a.u[off + base]);
\t\t\t\t__m256 v_here = _mm256_loadu_ps(&a.v[off + base]);
\t\t\t\t__m256 du = _mm256_sub_ps(_mm256_loadu_ps(&a.u[shear_other + base]), u_here);
\t\t\t\t__m256 dv = _mm256_sub_ps(_mm256_loadu_ps(&a.v[shear_other + base]), v_here);
\t\t\t\t__m256 shear = _mm256_sqrt_ps(_mm256_fmadd_ps(dv, dv, _mm256_mul_ps(du, du)));
\t\t\t\t_mm256_storeu_ps(&a.shear[off + base], shear);
'''
          new = '''\t\t\t\tint shear_other_layer = layer < LAYERS - 1 ? above_layer : below_layer;
\t\t\t\tint shear_other = a.layer_offset(shear_other_layer);
\t\t\t\t__m256 u_here = _mm256_loadu_ps(&a.u[off + base]);
\t\t\t\t__m256 v_here = _mm256_loadu_ps(&a.v[off + base]);
\t\t\t\t__m256 du = _mm256_sub_ps(_mm256_loadu_ps(&a.u[shear_other + base]), u_here);
\t\t\t\t__m256 dv = _mm256_sub_ps(_mm256_loadu_ps(&a.v[shear_other + base]), v_here);
\t\t\t\t__m256 shear = _mm256_sqrt_ps(_mm256_fmadd_ps(dv, dv, _mm256_mul_ps(du, du)));
\t\t\t\tfloat dz_m = std::max(std::abs(APPROX_HEIGHT_M[shear_other_layer] - APPROX_HEIGHT_M[layer]), 100.0f);
\t\t\t\t// Store a one-kilometre-equivalent vector shear so this diagnostic has
\t\t\t\t// the same physical meaning when vertical level spacing changes.
\t\t\t\tshear = _mm256_mul_ps(shear, _mm256_set1_ps(1000.0f / dz_m));
\t\t\t\t_mm256_storeu_ps(&a.shear[off + base], shear);
'''
          if old not in text:
              raise SystemExit('diagnostic shear block missing')
          text = text.replace(old, new, 1)

          # Organised-storm export: use resolution-independent 0-6 km bulk shear.
          text = text.replace('\t\tfloat max_shear = 0.0f;\n', '', 1)
          text = text.replace('\t\t\tmax_shear = std::max(max_shear, a.shear[i]);\n', '', 1)
          old = '''\t\tint l0 = a.layer_offset(0) + c;
\t\tint l2 = a.layer_offset(nearest_layer_for_height(3300.0f)) + c;
'''
          new = '''\t\tint l0 = a.layer_offset(0) + c;
\t\tint l2 = a.layer_offset(nearest_layer_for_height(3300.0f)) + c;
\t\tint l6 = a.layer_offset(nearest_layer_for_height(5950.0f)) + c;
'''
          if old not in text:
              raise SystemExit('weather bulk shear anchor missing')
          text = text.replace(old, new, 1)
          old = '\t\tfloat shear = std::clamp(max_shear / 30.0f, 0.0f, 1.0f);'
          new = '''\t\tfloat bulk_du = a.u[l6] - a.u[l0];
\t\tfloat bulk_dv = a.v[l6] - a.v[l0];
\t\tfloat bulk_shear = std::sqrt(bulk_du * bulk_du + bulk_dv * bulk_dv);
\t\tfloat shear = std::clamp(bulk_shear / 30.0f, 0.0f, 1.0f);'''
          if old not in text:
              raise SystemExit('weather max shear normalization missing')
          text = text.replace(old, new, 1)

          # Diagnostic A channel is also true 0-6 km bulk vector shear.
          dstart = text.index('static PackedFloat32Array diagnostics_rgba_from')
          dend = text.index('\n\nPackedFloat32Array WeatherNative::get_global_weather_rgba', dstart)
          block = text[dstart:dend]
          old = '''\t\tfloat shear = 0.0f;
\t\tfor (int layer = 0; layer < WeatherNative::LAYERS; ++layer) {
\t\t\tshear = std::max(shear, a.shear[a.layer_offset(layer) + c]);
\t\t}
'''
          new = '''\t\tint low_i = a.layer_offset(0) + c;
\t\tint six_i = a.layer_offset(nearest_layer_for_height(5950.0f)) + c;
\t\tfloat shear_du = a.u[six_i] - a.u[low_i];
\t\tfloat shear_dv = a.v[six_i] - a.v[low_i];
\t\tfloat shear = std::sqrt(shear_du * shear_du + shear_dv * shear_dv);
'''
          if old not in block:
              raise SystemExit('diagnostic max shear block missing')
          block = block.replace(old, new, 1)
          text = text[:dstart] + block + text[dend:]
          path.write_text(text, encoding='utf-8')

          ui_path = Path('scripts/ui/weather_map.gd')
          ui = ui_path.read_text(encoding='utf-8')
          ui = ui.replace('"Maximum adjacent-layer vector wind shear",',
                          '"0–6 km bulk vector wind shear",')
          ui = ui.replace('"Positive", "55+ m/s",', '"Positive", "35+ m/s",')
          ui_path.write_text(ui, encoding='utf-8')
          PY
      - name: Commit normalization
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add native/weather/src/weather_native.cpp scripts/ui/weather_map.gd
          git commit -m "Normalize shear diagnostics for 30 vertical levels"
          git push origin HEAD:weather/0.0.5
