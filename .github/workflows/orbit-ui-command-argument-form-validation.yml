name: Orbit UI command argument form validation

on:
  push:
    branches:
      - orbit-ui-command-argument-form

permissions:
  contents: write

jobs:
  command-argument-form:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: orbit-ui-command-argument-form
      - name: Apply argument form patch
        run: python3 tools/validation/command_argument_form_patch.py
      - name: Verify and commit
        shell: bash
        run: |
          git diff --check
          test "$(git diff --name-only | wc -l)" -eq 2
          grep -q 'quickCreateArgumentCommand_' engine/studio_ui/include/orbit/studio_ui/StudioExpansionShell.hpp
          grep -q 'quickCreateArgumentEnabled_' engine/studio_ui/include/orbit/studio_ui/StudioExpansionShell.hpp
          grep -q 'CommandValueKind::Boolean' engine/studio_ui/src/StudioExpansionShell.cpp
          grep -q 'CommandValueKind::Integer' engine/studio_ui/src/StudioExpansionShell.cpp
          grep -q 'CommandValueKind::Float' engine/studio_ui/src/StudioExpansionShell.cpp
          grep -q 'CommandValueKind::String' engine/studio_ui/src/StudioExpansionShell.cpp
          grep -q 'CommandValueKind::Vector3' engine/studio_ui/src/StudioExpansionShell.cpp
          grep -q 'CommandValueKind::ObjectId' engine/studio_ui/src/StudioExpansionShell.cpp
          grep -q 'CommandValueKind::PropertyId' engine/studio_ui/src/StudioExpansionShell.cpp
          grep -q 'ObjectId::Parse' engine/studio_ui/src/StudioExpansionShell.cpp
          grep -q 'PropertyId::Parse' engine/studio_ui/src/StudioExpansionShell.cpp
          grep -q 'PrimaryButton("Create##quick-create-argument-submit")' engine/studio_ui/src/StudioExpansionShell.cpp
          grep -q 'beginArgumentForm(entry.command)' engine/studio_ui/src/StudioExpansionShell.cpp
          git config user.name "orbit-ui-validation"
          git config user.email "orbit-ui-validation@users.noreply.github.com"
          git add engine/studio_ui/include/orbit/studio_ui/StudioExpansionShell.hpp engine/studio_ui/src/StudioExpansionShell.cpp
          git commit -m "Generate Quick Create command argument forms"
          git push origin HEAD:orbit-ui-command-argument-form
