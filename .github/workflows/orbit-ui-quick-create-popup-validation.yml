name: Orbit UI quick create popup validation

on:
  push:
    branches:
      - orbit-ui-quick-create-popup

permissions:
  contents: write

jobs:
  quick-create-popup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: orbit-ui-quick-create-popup
      - name: Apply patch
        run: python3 tools/validation/quick_create_popup_patch.py
      - name: Verify and commit
        shell: bash
        run: |
          git diff --check
          test "$(git diff --name-only | wc -l)" -eq 4
          grep -q 'ActionList(' engine/editor_ui/include/orbit/editor_ui/EditorUi.hpp
          grep -q 'bool PanelContext::ActionList' engine/editor_ui/src/EditorUi.cpp
          grep -q 'studio-quick-create-popup' engine/studio_ui/src/StudioExpansionShell.cpp
          grep -q 'StudioContributionSurface::QuickCreate' engine/studio_ui/src/StudioExpansionShell.cpp
          grep -q 'verticalList' engine/studio_ui/src/StudioExpansionShell.cpp
          ! grep -q 'quickCreateOpen_' engine/studio_ui/include/orbit/studio_ui/StudioExpansionShell.hpp
          ! grep -q 'Close Add##quick-create-toggle' engine/studio_ui/src/StudioExpansionShell.cpp
          git config user.name "orbit-ui-validation"
          git config user.email "orbit-ui-validation@users.noreply.github.com"
          git add engine/editor_ui/include/orbit/editor_ui/EditorUi.hpp
          git add engine/editor_ui/src/EditorUi.cpp
          git add engine/studio_ui/include/orbit/studio_ui/StudioExpansionShell.hpp
          git add engine/studio_ui/src/StudioExpansionShell.cpp
          git commit -m "Move quick create into popup"
          git push origin HEAD:orbit-ui-quick-create-popup
