name: M38 Run Authored Particle Patch

on:
  push:
    branches: [orbit]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'orbit-ci'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: orbit
          fetch-depth: 0
      - name: Apply patch
        run: python tools/m38_authored_particle_patch.py
      - name: Verify
        run: |
          grep -q 'kVolumeParticleLifetime' engine/world_model/src/VolumeSchemas.cpp
          grep -q 'static_assert(sizeof(VolumeParticleGpuSpawn) == 96U)' engine/volume_render/include/orbit/volume_render/VolumeParticleGpuBinding.hpp
          grep -q 'static_assert(sizeof(VolumeParticleGpuStateRecord) == 96U)' engine/volume_render/include/orbit/volume_render/VolumeParticleGpuState.hpp
          grep -q 'projectedRadiusPixels' engine/volume_render/src/VolumeParticleRenderer.cpp
          grep -q 'kVolumeParticleCollisionMode' engine/studio_ui/src/VolumeAuthoringM36.cpp
      - name: Commit
        run: |
          rm tools/m38_authored_particle_patch.py
          rm .github/workflows/m38-run-authored-particle-patch.yml
          git config user.name orbit-ci
          git config user.email orbit-ci@users.noreply.github.com
          git add -A
          git commit -m 'Author M38 particle behavior per volume'
          git push origin HEAD:orbit
