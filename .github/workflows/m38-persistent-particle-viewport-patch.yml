name: M38 Persistent Particle Viewport Patch

on:
  push:
    paths:
      - '.github/workflows/m38-persistent-particle-viewport-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: orbit
          fetch-depth: 0

      - name: Patch Studio persistent particle integration
        shell: python
        run: |
          from pathlib import Path

          header = Path('engine/studio_ui/include/orbit/studio_ui/StudioViewportRenderer.hpp')
          text = header.read_text()
          old = '''    volume_render::UniversalVolumeRenderer universalVolumeRenderer_;\n    volume_render::VolumeParticleRenderer volumeParticleRenderer_;\n    render_view::CompositeRenderer debugComposite_;'''
          new = '''    volume_render::UniversalVolumeRenderer universalVolumeRenderer_;\n    volume_render::VolumeParticleRenderer volumeParticleRenderer_;\n    u64 particleOutputGeneration_{0U};\n    time::SimulationTime particleSimulationTime_{};\n    bool particleSimulationTimeValid_{false};\n    math::Double3 particlePresentationOriginMeters_{};\n    render_view::CompositeRenderer debugComposite_;'''
          assert text.count(old) == 1, 'StudioViewportRenderer.hpp member seam changed'
          header.write_text(text.replace(old, new))

          cpp = Path('engine/studio_ui/src/StudioViewportRenderer.cpp')
          text = cpp.read_text()
          old = '''        {\n            // M38 particle output is an exactly-once simulation packet. Build\n            // this viewport's GPU packet relative to the camera itself so the\n            // float representation retains local precision at planetary scale.\n            const auto particleSpawns =\n                BuildVolumeParticleRenderBatch(\n                    studio_session::VolumeParticleOutputs().Events(),\n                    view->Camera().localPositionMeters);\n\n            if (!particleSpawns.empty())\n            {\n                volumeParticleRenderer_.SetSpawns(\n                    particleSpawns);\n\n                const auto camera =\n                    view->Camera();\n                auto* particleColor =\n                    color;\n                auto* particleDepth =\n                    &view->Depth();\n                const u32 particleFrameIndex =\n                    frameIndex % framesInFlight_;\n\n                graph.AddPass(\n                    prefix + ".VolumeParticles",\n                    {\n                        {\n                            .texture = targets.color,\n                            .state =\n                                rhi::ResourceState::RenderTarget,\n                            .access =\n                                render_graph::Access::Write\n                        },\n                        {\n                            .texture = targets.depth,\n                            .state =\n                                rhi::ResourceState::DepthRead,\n                            .access =\n                                render_graph::Access::Read\n                        }\n                    },\n                    [this,\n                     particleColor,\n                     particleDepth,\n                     width,\n                     height,\n                     camera,\n                     particleFrameIndex](\n                        rhi::CommandList& commands,\n                        const render_graph::Resources&)\n                    {\n                        volumeParticleRenderer_.Draw(\n                            commands,\n                            *particleColor,\n                            *particleDepth,\n                            width,\n                            height,\n                            camera,\n                            {},\n                            particleFrameIndex);\n                    });\n            }\n            else\n            {\n                volumeParticleRenderer_.SetSpawns({});\n            }\n        }'''
          new = '''        {\n            // M38 particle simulation is shared by all Studio viewports. The\n            // authoritative output generation advances GPU state exactly once;\n            // later viewports only render that already-advanced state.\n            const auto& particleOutput =\n                studio_session::VolumeParticleOutputs();\n            const u64 outputGeneration =\n                particleOutput.Diagnostics().generation;\n\n            if (outputGeneration < particleOutputGeneration_)\n            {\n                volumeParticleRenderer_.Reset();\n                particleOutputGeneration_ = 0U;\n                particleSimulationTimeValid_ = false;\n                particlePresentationOriginMeters_ = {};\n            }\n\n            bool advanceParticleState = false;\n            f64 particleDeltaSeconds = 0.0;\n            math::Double3 previousParticleOrigin =\n                particlePresentationOriginMeters_;\n            math::Double3 nextParticleOrigin =\n                particlePresentationOriginMeters_;\n\n            if (outputGeneration > 0U &&\n                outputGeneration != particleOutputGeneration_)\n            {\n                nextParticleOrigin =\n                    view->Camera().localPositionMeters;\n                previousParticleOrigin =\n                    particleOutputGeneration_ == 0U\n                        ? nextParticleOrigin\n                        : particlePresentationOriginMeters_;\n\n                const auto particleSpawns =\n                    BuildVolumeParticleRenderBatch(\n                        particleOutput.Events(),\n                        nextParticleOrigin);\n                volumeParticleRenderer_.SetSpawns(\n                    particleSpawns);\n\n                if (particleSimulationTimeValid_)\n                {\n                    particleDeltaSeconds =\n                        static_cast<f64>(\n                            (atTime - particleSimulationTime_).count()) /\n                        1000000.0;\n                    if (!std::isfinite(particleDeltaSeconds) ||\n                        particleDeltaSeconds < 0.0)\n                    {\n                        particleDeltaSeconds = 0.0;\n                    }\n                }\n\n                particleOutputGeneration_ =\n                    outputGeneration;\n                particleSimulationTime_ = atTime;\n                particleSimulationTimeValid_ = true;\n                particlePresentationOriginMeters_ =\n                    nextParticleOrigin;\n                advanceParticleState = true;\n            }\n\n            if (particleOutputGeneration_ > 0U)\n            {\n                const auto camera =\n                    view->Camera();\n                const math::Double3 cameraRelativeToParticleOrigin{\n                    camera.localPositionMeters.x -\n                        particlePresentationOriginMeters_.x,\n                    camera.localPositionMeters.y -\n                        particlePresentationOriginMeters_.y,\n                    camera.localPositionMeters.z -\n                        particlePresentationOriginMeters_.z\n                };\n                auto* particleColor = color;\n                auto* particleDepth = &view->Depth();\n                const u32 particleFrameIndex =\n                    frameIndex % framesInFlight_;\n\n                graph.AddPass(\n                    prefix + ".VolumeParticles",\n                    {\n                        {\n                            .texture = targets.color,\n                            .state =\n                                rhi::ResourceState::RenderTarget,\n                            .access =\n                                render_graph::Access::Write\n                        },\n                        {\n                            .texture = targets.depth,\n                            .state =\n                                rhi::ResourceState::DepthRead,\n                            .access =\n                                render_graph::Access::Read\n                        }\n                    },\n                    [this,\n                     particleColor,\n                     particleDepth,\n                     width,\n                     height,\n                     camera,\n                     cameraRelativeToParticleOrigin,\n                     particleFrameIndex,\n                     advanceParticleState,\n                     particleDeltaSeconds,\n                     previousParticleOrigin,\n                     nextParticleOrigin](\n                        rhi::CommandList& commands,\n                        const render_graph::Resources&)\n                    {\n                        if (advanceParticleState)\n                        {\n                            volumeParticleRenderer_.Advance(\n                                commands,\n                                particleFrameIndex,\n                                particleDeltaSeconds,\n                                previousParticleOrigin,\n                                nextParticleOrigin);\n                        }\n\n                        volumeParticleRenderer_.Draw(\n                            commands,\n                            *particleColor,\n                            *particleDepth,\n                            width,\n                            height,\n                            camera,\n                            cameraRelativeToParticleOrigin);\n                    });\n            }\n        }'''
          assert text.count(old) == 1, 'StudioViewportRenderer.cpp particle seam changed'
          cpp.write_text(text.replace(old, new))

      - name: Verify integration
        shell: bash
        run: |
          grep -q 'particleOutputGeneration_' engine/studio_ui/include/orbit/studio_ui/StudioViewportRenderer.hpp
          grep -q 'volumeParticleRenderer_.Advance' engine/studio_ui/src/StudioViewportRenderer.cpp
          grep -q 'cameraRelativeToParticleOrigin' engine/studio_ui/src/StudioViewportRenderer.cpp

      - name: Commit integration and remove one-shot workflow
        shell: bash
        run: |
          rm .github/workflows/m38-persistent-particle-viewport-patch.yml
          git config user.name orbit-ci
          git config user.email orbit-ci@users.noreply.github.com
          git add engine/studio_ui/include/orbit/studio_ui/StudioViewportRenderer.hpp engine/studio_ui/src/StudioViewportRenderer.cpp .github/workflows/m38-persistent-particle-viewport-patch.yml
          git commit -m "Integrate persistent M38 particles across Studio viewports"
          git push origin HEAD:orbit
