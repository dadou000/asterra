name: M38 Apply Surface Render

on:
  push:
    branches: [orbit]
    paths:
      - '.github/m38_apply_surface_render.py'
      - '.github/workflows/m38-apply-surface-render.yml'

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[m38-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: orbit
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply exact M38 source patch
        run: python .github/m38_apply_surface_render.py
      - name: Verify expected renderer seams
        run: |
          grep -q 'SurfaceEffectGpuBinding surfaceEffects_' engine/terrain_render/src/TerrainPreviewRenderer.cpp
          grep -q 'BuildSurfaceEffectPixelShader' engine/terrain_render/src/TerrainPreviewRenderer.cpp
          grep -q 'BuildVolumeSurfaceEffectRenderBatch' engine/studio_ui/src/StudioViewportRenderer.cpp
          grep -q 'SetSurfaceEffects' engine/studio_ui/src/StudioViewportRenderer.cpp
      - name: Remove one-shot patch machinery
        run: |
          rm .github/m38_apply_surface_render.py
          rm .github/workflows/m38-apply-surface-render.yml
      - name: Commit M38 renderer integration
        run: |
          git config user.name 'Orbit CI'
          git config user.email 'orbit-ci@users.noreply.github.com'
          git add -A
          git commit -m 'Wire M38 surface effects into active terrain [m38-applied]'
          git push origin HEAD:orbit
