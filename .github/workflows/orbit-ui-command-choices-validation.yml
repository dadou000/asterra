name: Orbit UI command choices validation
on:
  push:
    branches: [orbit-ui-command-choices]
permissions:
  contents: write
jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: orbit-ui-command-choices
      - run: python3 tools/validation/command_choices_patch_fix.py
      - run: python3 tools/validation/command_choices_patch.py
      - run: git diff --check
      - run: |
          grep -q 'struct CommandChoice' engine/commands/include/orbit/commands/CommandRegistry.hpp
          grep -q 'std::vector<CommandChoice> choices;' engine/commands/include/orbit/commands/CommandRegistry.hpp
          grep -q 'default value is not an enumerated choice' engine/commands/src/CommandRegistry.cpp
          grep -q 'parameter.choices.front().value' engine/studio_ui/src/StudioExpansionShell.cpp
          grep -q 'context.Combo(label, choiceLabels, choiceIndex)' engine/studio_ui/src/StudioExpansionShell.cpp
          grep -q '.label = "Surface Flow"' engine/editor_model/src/VolumeAuthoringCommands.cpp
          grep -q '.label = "World Motion"' engine/editor_model/src/VolumeAuthoringCommands.cpp
          grep -q '.label = "Dissipation"' engine/editor_model/src/VolumeAuthoringCommands.cpp
          git config user.name orbit-ui-validation
          git config user.email orbit-ui-validation@users.noreply.github.com
          git add engine/commands/include/orbit/commands/CommandRegistry.hpp engine/commands/src/CommandRegistry.cpp engine/editor_model/src/VolumeAuthoringCommands.cpp engine/studio_ui/src/StudioExpansionShell.cpp
          git commit -m "Add generated command choices"
          git push origin HEAD:orbit-ui-command-choices
