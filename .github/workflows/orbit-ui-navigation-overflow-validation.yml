name: Orbit UI navigation overflow validation

on:
  push:
    branches:
      - orbit-ui-navigation-overflow

permissions:
  contents: write

jobs:
  navigation-overflow:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: orbit-ui-navigation-overflow
      - name: Apply patch
        run: python3 tools/validation/navigation_overflow_patch.py
      - name: Verify and commit
        shell: bash
        run: |
          git diff --check
          test "$(git diff --name-only)" = "engine/studio_ui/src/StudioExpansionShell.cpp"
          grep -q 'breadcrumb-overflow-menu' engine/studio_ui/src/StudioExpansionShell.cpp
          grep -q 'context.ContentAvailable().width - 300.0F' engine/studio_ui/src/StudioExpansionShell.cpp
          git config user.name "orbit-ui-validation"
          git config user.email "orbit-ui-validation@users.noreply.github.com"
          git add engine/studio_ui/src/StudioExpansionShell.cpp
          git commit -m "Make navigation breadcrumbs responsive"
          git push origin HEAD:orbit-ui-navigation-overflow
