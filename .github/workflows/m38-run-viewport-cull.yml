name: M38 Run Viewport Cull
on:
  push:
    branches: [orbit]
    paths:
      - 'tools/m38_viewport_cull_patch.py'
      - '.github/workflows/m38-run-viewport-cull.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: orbit
      - name: Apply patch
        run: python3 tools/m38_viewport_cull_patch.py
      - name: Verify
        run: |
          grep -q 'BuildVisibleDrawLists' engine/volume_render/include/orbit/volume_render/VolumeParticleGpuState.hpp
          grep -q 'VisibleSphere' engine/volume_render/src/VolumeParticleGpuState.cpp
          grep -q 'pushConstantDwords=24U' engine/volume_render/src/VolumeParticleGpuState.cpp
          grep -q 'state_.BuildVisibleDrawLists' engine/volume_render/src/VolumeParticleRenderer.cpp
          ! grep -q 'Build compact GPU draw lists after all in-place collision kills' engine/volume_render/src/VolumeParticleGpuState.cpp
      - name: Commit
        run: |
          rm tools/m38_viewport_cull_patch.py
          rm .github/workflows/m38-run-viewport-cull.yml
          git config user.name orbit-ci
          git config user.email orbit-ci@users.noreply.github.com
          git add -A
          git commit -m 'Add per-viewport GPU visibility culling for M38 effects'
          git push origin HEAD:orbit
