name: Godot terrain validation

on:
  push:
    branches:
      - "terrain/**"
  pull_request:
    paths:
      - "shaders/**"
      - "scripts/terrain/**"
      - "scripts/gen/**"
      - "scripts/world_authoring/**"
      - "scenes/world_authoring/**"
      - "scripts/ui/planet_map.gd"
      - "scripts/ui/start_menu.gd"
      - "scripts/ui/start_menu_planet_studio.gd"
      - "scenes/StartMenu.tscn"
      - "assets/scatter/**"
      - "tools/fetch_scatter_assets.py"
      - "tools/validate_scatter_manifest.py"
      - "tools/optimize_scatter_assets.py"
      - "tools/scatter_optimize_blender.py"
      - "project.godot"
      - "tests/validate_terrain_shader.gd"
      - "tests/validate_terrain_scripts.gd"
      - "tests/validate_terrain_scripts_scene.gd"
      - "tests/validate_terrain_scripts.tscn"
      - "tests/validate_generation_model.gd"
      - "tests/validate_world_authoring_phase0.gd"
      - "tests/ci_autoload_planet.gd"
      - "tests/ci_autoload_frames.gd"
      - "tests/ci_autoload_terrain_runtime_stub.gd"
      - ".github/workflows/godot-terrain-validate.yml"
  workflow_dispatch:

jobs:
  terrain-shader:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate scatter asset manifest
        shell: bash
        run: |
          set -euo pipefail
          python tools/validate_scatter_manifest.py

      - name: Install Godot 4.7.1
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 \
            -o /tmp/godot.zip \
            https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          echo "c7ff14fd28472c8d4f193043de30278dcf7e5241a1dcf7566b02e27addaa33ba  /tmp/godot.zip" | sha256sum -c -
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --version

      - name: Build isolated shader test project
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/asterra-terrain-ci
          mkdir -p /tmp/asterra-terrain-ci/shaders /tmp/asterra-terrain-ci/tests
          cp -R shaders/. /tmp/asterra-terrain-ci/shaders/
          cp tests/validate_terrain_shader.gd /tmp/asterra-terrain-ci/tests/
          cat > /tmp/asterra-terrain-ci/project.godot <<'EOF'
          ; Minimal project used only to compile the Asterra terrain shader stack.
          config_version=5

          [application]
          config/name="Asterra Terrain Shader CI"

          [rendering]
          renderer/rendering_method="gl_compatibility"
          renderer/rendering_method.mobile="gl_compatibility"
          EOF

      - name: Import isolated shader resources
        shell: bash
        run: |
          set -euo pipefail
          GODOT=/tmp/godot/Godot_v4.7.1-stable_linux.x86_64
          TEST_PROJECT=/tmp/asterra-terrain-ci
          set +e
          timeout 90 "$GODOT" --headless --path "$TEST_PROJECT" --import > /tmp/terrain-import.log 2>&1
          status=$?
          set -e
          tail -n 180 /tmp/terrain-import.log || true
          if [ "$status" -ne 0 ]; then
            echo "Godot isolated shader import failed with status $status"
            exit "$status"
          fi

      - name: Validate active terrain shader
        shell: bash
        run: |
          set -euo pipefail
          GODOT=/tmp/godot/Godot_v4.7.1-stable_linux.x86_64
          TEST_PROJECT=/tmp/asterra-terrain-ci
          set +e
          "$GODOT" --headless --path "$TEST_PROJECT" --script res://tests/validate_terrain_shader.gd > /tmp/terrain-shader.log 2>&1
          status=$?
          set -e
          cat /tmp/terrain-shader.log
          if [ "$status" -ne 0 ]; then
            echo "Godot exited with status $status"
            exit "$status"
          fi
          if ! grep -q "TERRAIN_SHADER_LOAD_OK" /tmp/terrain-shader.log; then
            echo "Terrain shader smoke-test completion marker was not emitted."
            exit 1
          fi
          if grep -Eiq "shader compilation failed|shader.*parse error|parse error.*shader|error:.*gdshader|TERRAIN_COMPUTE_COMPILE_FAILED" /tmp/terrain-shader.log; then
            echo "Godot reported a shader parser/compiler error."
            exit 1
          fi

      - name: Build isolated script test project
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/asterra-script-ci
          mkdir -p /tmp/asterra-script-ci/scripts /tmp/asterra-script-ci/shaders /tmp/asterra-script-ci/tests /tmp/asterra-script-ci/scenes/world_authoring
          cp -R scripts/. /tmp/asterra-script-ci/scripts/
          cp -R shaders/. /tmp/asterra-script-ci/shaders/
          cp tests/validate_terrain_scripts.gd /tmp/asterra-script-ci/tests/
          cp tests/validate_terrain_scripts_scene.gd /tmp/asterra-script-ci/tests/
          cp tests/validate_terrain_scripts.tscn /tmp/asterra-script-ci/tests/
          cp tests/validate_generation_model.gd /tmp/asterra-script-ci/tests/
          cp tests/validate_world_authoring_phase0.gd /tmp/asterra-script-ci/tests/
          cp tests/ci_autoload_planet.gd /tmp/asterra-script-ci/tests/
          cp tests/ci_autoload_frames.gd /tmp/asterra-script-ci/tests/
          cp tests/ci_autoload_terrain_runtime_stub.gd /tmp/asterra-script-ci/tests/
          cp -R scenes/world_authoring/. /tmp/asterra-script-ci/scenes/world_authoring/
          cp world.tres /tmp/asterra-script-ci/world.tres
          cat > /tmp/asterra-script-ci/project.godot <<'EOF'
          ; Script-only project. Deliberately excludes game art, generated maps and
          ; GDExtensions so parser/class-registry tests remain deterministic and fast.
          config_version=5

          [application]
          config/name="Asterra Script CI"

          [autoload]
          Frames="*res://tests/ci_autoload_frames.gd"
          Planet="*res://tests/ci_autoload_planet.gd"
          Deltas="*res://scripts/terrain/terrain_deltas.gd"
          TerrainHeightQuery="*res://tests/ci_autoload_terrain_runtime_stub.gd"
          RenderedTerrainContactQuery="*res://tests/ci_autoload_terrain_runtime_stub.gd"
          TerrainDeformationGPU="*res://tests/ci_autoload_terrain_runtime_stub.gd"
          TerrainDeformationQueryGPU="*res://tests/ci_autoload_terrain_runtime_stub.gd"
          GroundHeightStore="*res://scripts/terrain/global_height_store.gd"
          GroundHeightPageAtlas="*res://scripts/terrain/ground_height_page_atlas_disabled.gd"

          [rendering]
          renderer/rendering_method="gl_compatibility"
          renderer/rendering_method.mobile="gl_compatibility"
          EOF

      - name: Import isolated script classes
        shell: bash
        run: |
          set -euo pipefail
          GODOT=/tmp/godot/Godot_v4.7.1-stable_linux.x86_64
          TEST_PROJECT=/tmp/asterra-script-ci
          set +e
          timeout 90 "$GODOT" --headless --path "$TEST_PROJECT" --import > /tmp/asterra-script-import.log 2>&1
          status=$?
          set -e
          tail -n 220 /tmp/asterra-script-import.log || true
          if [ "$status" -ne 0 ]; then
            echo "Asterra isolated script import failed with status $status"
            exit "$status"
          fi
          if grep -Eiq "SCRIPT ERROR: Parse Error|Could not resolve script|Failed to load script" /tmp/asterra-script-import.log; then
            echo "Godot reported a script parse/load error while building the isolated class registry."
            exit 1
          fi

      - name: Validate Planet Studio phase 0
        shell: bash
        run: |
          set -euo pipefail
          GODOT=/tmp/godot/Godot_v4.7.1-stable_linux.x86_64
          TEST_PROJECT=/tmp/asterra-script-ci
          set +e
          timeout 90 "$GODOT" --headless --path "$TEST_PROJECT" --script res://tests/validate_world_authoring_phase0.gd > /tmp/world-authoring-phase0.log 2>&1
          status=$?
          set -e
          cat /tmp/world-authoring-phase0.log
          if [ "$status" -ne 0 ]; then
            echo "Planet Studio phase-0 validation exited with status $status"
            exit "$status"
          fi
          if ! grep -q "WORLD_AUTHORING_PHASE0_OK" /tmp/world-authoring-phase0.log; then
            echo "Planet Studio phase-0 completion marker was not emitted."
            exit 1
          fi
          if grep -q "WORLD_AUTHORING_PHASE0_FAILED" /tmp/world-authoring-phase0.log; then
            echo "Planet Studio phase-0 invariant failed."
            exit 1
          fi
          if grep -q "possible cyclic resource inclusion" /tmp/world-authoring-phase0.log; then
            echo "Planet Studio copied a built-in Resource path during config import."
            exit 1
          fi

      - name: Validate active terrain script chain
        shell: bash
        run: |
          set -euo pipefail
          GODOT=/tmp/godot/Godot_v4.7.1-stable_linux.x86_64
          TEST_PROJECT=/tmp/asterra-script-ci
          set +e
          timeout 90 "$GODOT" --headless --path "$TEST_PROJECT" res://tests/validate_terrain_scripts.tscn > /tmp/terrain-gdscript.log 2>&1
          status=$?
          set -e
          cat /tmp/terrain-gdscript.log
          if [ "$status" -ne 0 ]; then
            echo "Terrain script-chain validation exited with status $status"
            exit "$status"
          fi
          if ! grep -q "TERRAIN_SCRIPT_STACK_OK" /tmp/terrain-gdscript.log; then
            echo "Terrain script-chain completion marker was not emitted."
            exit 1
          fi
          if ! grep -q "PHASE7_SCULPT_OK" /tmp/terrain-gdscript.log; then
            echo "Phase 7 numerical sculpt completion marker was not emitted."
            exit 1
          fi
          if grep -Eiq "SCRIPT ERROR: Parse Error|Could not resolve script|Failed to load script.*spherical_geometry_clipmap|Failed to load script.*gpu_terrain_scatter" /tmp/terrain-gdscript.log; then
            echo "Godot reported a GDScript parser/inheritance error in the active terrain scripts."
            exit 1
          fi

      - name: Validate generation data model
        shell: bash
        run: |
          set -euo pipefail
          GODOT=/tmp/godot/Godot_v4.7.1-stable_linux.x86_64
          TEST_PROJECT=/tmp/asterra-script-ci
          set +e
          timeout 90 "$GODOT" --headless --path "$TEST_PROJECT" --script res://tests/validate_generation_model.gd > /tmp/generation-model.log 2>&1
          status=$?
          set -e
          cat /tmp/generation-model.log
          if [ "$status" -ne 0 ]; then
            echo "Generation model validation exited with status $status"
            exit "$status"
          fi
          if ! grep -q "GENERATION_MODEL_OK" /tmp/generation-model.log; then
            echo "Generation model completion marker was not emitted."
            exit 1
          fi
          if grep -q "GENERATION_MODEL_FAILED" /tmp/generation-model.log; then
            echo "Generation model invariant failed."
            exit 1
          fi
