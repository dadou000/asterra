name: Orbit UI command palette keyboard validation

on:
  push:
    branches:
      - orbit-ui-command-palette-keyboard

permissions:
  contents: write

jobs:
  command-palette-keyboard:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: orbit-ui-command-palette-keyboard
      - name: Apply patch
        run: python3 tools/validation/command_palette_keyboard_patch.py
      - name: Verify and commit
        shell: bash
        run: |
          git diff --check
          test "$(git diff --name-only | wc -l)" -eq 4
          grep -q 'enum class UiKey' engine/editor_ui/include/orbit/editor_ui/EditorUi.hpp
          grep -q 'FocusNextItem' engine/editor_ui/include/orbit/editor_ui/EditorUi.hpp
          grep -q 'ImGui::SetKeyboardFocusHere' engine/editor_ui/src/EditorUi.cpp
          grep -q 'ImGuiKey_UpArrow' engine/editor_ui/src/EditorUi.cpp
          grep -q 'ImGuiKey_DownArrow' engine/editor_ui/src/EditorUi.cpp
          grep -q 'ImGuiKey_Enter' engine/editor_ui/src/EditorUi.cpp
          grep -q 'ImGuiKey_Escape' engine/editor_ui/src/EditorUi.cpp
          grep -q 'commandPaletteSelection_' engine/studio_ui/include/orbit/studio_ui/StudioExpansionShell.hpp
          grep -q 'visibleMatches.reserve(8U)' engine/studio_ui/src/StudioExpansionShell.cpp
          grep -q 'UiKey::Down' engine/studio_ui/src/StudioExpansionShell.cpp
          grep -q 'UiKey::Up' engine/studio_ui/src/StudioExpansionShell.cpp
          grep -q 'UiKey::Enter' engine/studio_ui/src/StudioExpansionShell.cpp
          grep -q 'UiKey::Escape' engine/studio_ui/src/StudioExpansionShell.cpp
          grep -q 'context.FocusNextItem' engine/studio_ui/src/StudioExpansionShell.cpp
          git config user.name "orbit-ui-validation"
          git config user.email "orbit-ui-validation@users.noreply.github.com"
          git add engine/editor_ui/include/orbit/editor_ui/EditorUi.hpp
          git add engine/editor_ui/src/EditorUi.cpp
          git add engine/studio_ui/include/orbit/studio_ui/StudioExpansionShell.hpp
          git add engine/studio_ui/src/StudioExpansionShell.cpp
          git commit -m "Make command palette keyboard-first"
          git push origin HEAD:orbit-ui-command-palette-keyboard
