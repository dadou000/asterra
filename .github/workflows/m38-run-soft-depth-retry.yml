name: M38 Run Soft Depth Retry
on:
  push:
    branches: [orbit]
    paths:
      - '.github/workflows/m38-run-soft-depth-retry.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: orbit
      - name: Correct strict VS seam and apply patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tools/m38_soft_depth_patch.py')
          t=p.read_text()
          old="rep(p,'    float emissionScale : TEXCOORD7;\\n};','    float emissionScale : TEXCOORD7;\\n    float softnessMeters : TEXCOORD8;\\n};',)"
          new="""t=Path(p).read_text(encoding='utf-8'); old_vs='    float emissionScale : TEXCOORD7;\\n};';\nif t.count(old_vs)<1: raise RuntimeError('particle VS seam missing');\nPath(p).write_text(t.replace(old_vs,'    float emissionScale : TEXCOORD7;\\n    float softnessMeters : TEXCOORD8;\\n};',1),encoding='utf-8')"""
          if old not in t: raise SystemExit('retry seam not found')
          p.write_text(t.replace(old,new,1))
          PY
          python3 tools/m38_soft_depth_patch.py
      - name: Verify
        run: |
          grep -q 'SetRenderTargetsReadOnlyDepth' engine/rhi/include/orbit/rhi/Command.hpp
          grep -q 'VK_IMAGE_LAYOUT_DEPTH_READ_ONLY_OPTIMAL' engine/rhi/vulkan/src/VulkanCommands.cpp
          grep -q 'SoftDepth' engine/volume_render/src/VolumeParticleRenderer.cpp
          grep -q 'sampledTextures = 1U' engine/volume_render/src/VolumeParticleRenderer.cpp
      - name: Commit
        run: |
          rm tools/m38_soft_depth_patch.py
          rm .github/workflows/m38-run-soft-depth.yml
          rm .github/workflows/m38-run-soft-depth-retry.yml
          git config user.name orbit-ci
          git config user.email orbit-ci@users.noreply.github.com
          git add -A
          git commit -m 'Add soft depth intersections for M38 effects'
          git push origin HEAD:orbit
