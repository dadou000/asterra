name: Apply Weather Surface Completion

on:
  push:
    branches:
      - weather/0.0.5
    paths:
      - .github/workflows/apply-weather-surface-completion.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: weather/0.0.5
          fetch-depth: 0
      - name: Apply completion patch
        run: python tools/apply_weather_surface_completion.py
      - name: Commit implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/weather/weather_system.gd scripts/weather/surface_energy_bridge.gd native/weather/src/weather_native.h native/weather/src/weather_native.cpp shaders/weather_surface.gdshaderinc shaders/spherical_geometry_clipmap_procedural_uv.gdshader
          git diff --cached --check
          git commit -m "Complete coupled terrain weather surface model"
          git push origin HEAD:weather/0.0.5
