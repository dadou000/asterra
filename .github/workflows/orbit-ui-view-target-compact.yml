name: Orbit UI view target compact validation

on:
  push:
    branches:
      - orbit-ui-view-target-compact

permissions:
  contents: write

jobs:
  patch-view-target:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: orbit-ui-view-target-compact

      - name: Compact focused viewport indicator
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('engine/studio_ui/src/StudioExpansionShell.cpp')
          text = path.read_text(encoding='utf-8')

          old = '''    context.SameLine();\n    context.MutedText("|");\n    context.SameLine();\n    context.Text("View");\n    context.SameLine();\n\n    const std::string_view controlledViewport =\n        SelectedViewportId();\n    context.MutedText(\n        controlledViewport == "studio.map"\n            ? "Body Map"\n            : "Primary");\n\n    if (ViewportControlsRelevant())\n'''

          new = '''    context.SameLine();\n    context.MutedText("|");\n    context.SameLine();\n    context.Text("View");\n\n    // Auto mode follows focus, so the target does not need permanent toolbar\n    // chrome. Only surface a compact cue when the user explicitly pins the\n    // control target in Properties.\n    if (viewportControlMode_ != 0)\n    {\n        context.SameLine();\n        context.MutedText(\n            viewportControlMode_ == 2\n                ? "Pinned Map"\n                : "Pinned P");\n    }\n\n    if (ViewportControlsRelevant())\n'''

          if old not in text:
              raise SystemExit('view target block not found')

          updated = text.replace(old, new, 1)
          if updated == text:
              raise SystemExit('view target replacement produced no change')

          path.write_text(updated, encoding='utf-8')
          PY

      - name: Verify focused diff
        shell: bash
        run: |
          git diff --check
          changed="$(git diff --name-only)"
          test "$changed" = "engine/studio_ui/src/StudioExpansionShell.cpp"
          git diff -- engine/studio_ui/src/StudioExpansionShell.cpp

      - name: Commit validation change
        shell: bash
        run: |
          git config user.name "orbit-ui-validation"
          git config user.email "orbit-ui-validation@users.noreply.github.com"
          git add engine/studio_ui/src/StudioExpansionShell.cpp
          git commit -m "Compact focus-aware view target chrome"
          git push origin HEAD:orbit-ui-view-target-compact
