name: Orbit UI ID picker keyboard validation

on:
  push:
    branches:
      - orbit-ui-id-picker-keyboard

permissions:
  contents: write

jobs:
  id-picker-keyboard:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: orbit-ui-id-picker-keyboard
      - name: Apply ID picker keyboard patch
        run: python3 tools/validation/id_picker_keyboard_patch.py
      - name: Verify and commit
        shell: bash
        run: |
          git diff --check
          test "$(git diff --name-only | wc -l)" -eq 4
          grep -q 'SetNextTreeItemOpen(bool open)' engine/editor_ui/include/orbit/editor_ui/EditorUi.hpp
          grep -q 'ImGui::SetNextItemOpen(open, ImGuiCond_Appearing)' engine/editor_ui/src/EditorUi.cpp
          grep -q 'quickCreatePickerSelection_' engine/studio_ui/include/orbit/studio_ui/StudioExpansionShell.hpp
          grep -q 'context.FocusNextItem()' engine/studio_ui/src/StudioExpansionShell.cpp
          grep -q 'UiKey::Down' engine/studio_ui/src/StudioExpansionShell.cpp
          grep -q 'UiKey::Up' engine/studio_ui/src/StudioExpansionShell.cpp
          grep -q 'UiKey::Enter' engine/studio_ui/src/StudioExpansionShell.cpp
          grep -q 'UiKey::Escape' engine/studio_ui/src/StudioExpansionShell.cpp
          grep -q 'selectedObjectPath' engine/studio_ui/src/StudioExpansionShell.cpp
          grep -q 'selectedPropertyType' engine/studio_ui/src/StudioExpansionShell.cpp
          grep -q 'categoryContainsSelected' engine/studio_ui/src/StudioExpansionShell.cpp
          grep -q 'typeContainsSelected' engine/studio_ui/src/StudioExpansionShell.cpp
          git config user.name "orbit-ui-validation"
          git config user.email "orbit-ui-validation@users.noreply.github.com"
          git add engine/editor_ui/include/orbit/editor_ui/EditorUi.hpp engine/editor_ui/src/EditorUi.cpp engine/studio_ui/include/orbit/studio_ui/StudioExpansionShell.hpp engine/studio_ui/src/StudioExpansionShell.cpp
          git commit -m "Make command ID pickers keyboard-first"
          git push origin HEAD:orbit-ui-id-picker-keyboard
