name: Orbit UI context overflow validation

on:
  push:
    branches:
      - orbit-ui-context-overflow

permissions:
  contents: write

jobs:
  context-overflow:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: orbit-ui-context-overflow

      - name: Normalize and verify responsive context overflow
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('engine/studio_ui/src/StudioExpansionShell.cpp')
          text = path.read_text(encoding='utf-8')
          path.write_text(text.rstrip('\n') + '\n', encoding='utf-8')
          PY
          git diff --check
          grep -q 'responsiveOverflow = false' engine/studio_ui/include/orbit/studio_ui/StudioExpansionShell.hpp
          grep -q 'kInlineContributionReserve = 300.0F' engine/studio_ui/src/StudioExpansionShell.cpp
          grep -q 'studio-context-toolbar-overflow-menu' engine/studio_ui/src/StudioExpansionShell.cpp
          grep -q 'StudioContributionSurface::ContextToolbar,' engine/studio_ui/src/StudioExpansionShell.cpp

      - name: Commit newline normalization
        shell: bash
        run: |
          git config user.name "orbit-ui-validation"
          git config user.email "orbit-ui-validation@users.noreply.github.com"
          git add engine/studio_ui/src/StudioExpansionShell.cpp
          git diff --cached --quiet || git commit -m "Normalize context overflow source newline"
          git push origin HEAD:orbit-ui-context-overflow
