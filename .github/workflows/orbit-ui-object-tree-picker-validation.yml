name: Orbit UI object tree picker validation

on:
  push:
    branches:
      - orbit-ui-object-tree-picker

permissions:
  contents: write

jobs:
  object-tree-picker:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: orbit-ui-object-tree-picker
      - name: Apply object tree picker patch
        run: python3 tools/validation/object_tree_picker_patch.py
      - name: Verify and commit
        shell: bash
        run: |
          git diff --check
          test "$(git diff --name-only | wc -l)" -eq 1
          grep -q '#include <functional>' engine/studio_ui/src/StudioExpansionShell.cpp
          grep -q 'world.Explorer().Children(candidate.id)' engine/studio_ui/src/StudioExpansionShell.cpp
          grep -q 'context.TreeItem(nodeLabel, isChosen)' engine/studio_ui/src/StudioExpansionShell.cpp
          grep -q 'context.TreePop()' engine/studio_ui/src/StudioExpansionShell.cpp
          grep -q 'context.MutedText("Selection")' engine/studio_ui/src/StudioExpansionShell.cpp
          grep -q 'context.MutedText("Hierarchy")' engine/studio_ui/src/StudioExpansionShell.cpp
          grep -q 'world.Explorer().Search(query, 20U)' engine/studio_ui/src/StudioExpansionShell.cpp
          grep -q 'kMaximumPickerDepth = 64U' engine/studio_ui/src/StudioExpansionShell.cpp
          grep -q 'Advanced UUID##quick-create-object-uuid-' engine/studio_ui/src/StudioExpansionShell.cpp
          git config user.name "orbit-ui-validation"
          git config user.email "orbit-ui-validation@users.noreply.github.com"
          git add engine/studio_ui/src/StudioExpansionShell.cpp
          git commit -m "Add hierarchical object picker"
          git push origin HEAD:orbit-ui-object-tree-picker
