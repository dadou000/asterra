name: M38 Run Indirect Draw
on:
  push:
    branches: [orbit]
    paths:
      - 'tools/m38_indirect_draw_patch.py'
      - '.github/workflows/m38-run-indirect-draw.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: orbit
      - name: Apply patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tools/m38_indirect_draw_patch.py')
          t=p.read_text(encoding='utf-8')
          t=t.replace('[[vk::binding(4, 0)]] StructuredBuffer<Droplet> g_droplets : register(t4);','[[vk::binding(4,0)]] StructuredBuffer<Droplet> g_droplets : register(t4);')
          p.write_text(t,encoding='utf-8')
          PY
          python3 tools/m38_indirect_draw_patch.py
      - name: Verify
        run: |
          grep -q 'virtual void DrawIndirect' engine/rhi/include/orbit/rhi/Command.hpp
          grep -q 'VK_BUFFER_USAGE_INDIRECT_BUFFER_BIT' engine/rhi/vulkan/src/VulkanResources.cpp
          grep -q 'VK_PIPELINE_STAGE_2_DRAW_INDIRECT_BIT' engine/rhi/vulkan/src/VulkanCommands.cpp
          grep -q 'kDrawListShader' engine/volume_render/src/VolumeParticleGpuState.cpp
          grep -q 'DrawIndirect(state_.IndirectDrawArguments()' engine/volume_render/src/VolumeParticleRenderer.cpp
      - name: Commit
        run: |
          rm tools/m38_indirect_draw_patch.py
          rm .github/workflows/m38-run-indirect-draw.yml
          git config user.name orbit-ci
          git config user.email orbit-ci@users.noreply.github.com
          git add -A
          git commit -m 'Add GPU indirect draw support for M38 effects'
          git push origin HEAD:orbit
