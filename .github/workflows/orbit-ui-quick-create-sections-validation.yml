name: Orbit UI quick create sections validation

on:
  push:
    branches:
      - orbit-ui-quick-create-sections

permissions:
  contents: write

jobs:
  quick-create-sections:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: orbit-ui-quick-create-sections
      - name: Apply quick create grouping
        run: python3 tools/validation/quick_create_sections_patch.py
      - name: Verify and commit
        shell: bash
        run: |
          git diff --check
          test "$(git diff --name-only | wc -l)" -eq 1
          test "$(git diff --name-only)" = "engine/studio_ui/src/StudioExpansionShell.cpp"
          grep -q 'contextualCommandActions' engine/studio_ui/src/StudioExpansionShell.cpp
          grep -q 'fallbackCommandActions' engine/studio_ui/src/StudioExpansionShell.cpp
          grep -q 'For Workspace' engine/studio_ui/src/StudioExpansionShell.cpp
          grep -q 'For Selection' engine/studio_ui/src/StudioExpansionShell.cpp
          grep -q 'context.MutedText("Viewport")' engine/studio_ui/src/StudioExpansionShell.cpp
          grep -q 'drawFallbackCommands' engine/studio_ui/src/StudioExpansionShell.cpp
          grep -q 'context.MutedText("Extensions")' engine/studio_ui/src/StudioExpansionShell.cpp
          grep -q 'hasPluginQuickCreateCommands' engine/studio_ui/src/StudioExpansionShell.cpp
          grep -q 'owner_->PreferCommandQuickCreate() || hasSelection' engine/studio_ui/src/StudioExpansionShell.cpp
          git config user.name "orbit-ui-validation"
          git config user.email "orbit-ui-validation@users.noreply.github.com"
          git add engine/studio_ui/src/StudioExpansionShell.cpp
          git commit -m "Separate contextual quick create suggestions"
          git push origin HEAD:orbit-ui-quick-create-sections
