name: Orbit UI mode-aware presentation validation

on:
  push:
    branches:
      - orbit-ui-mode-aware-presentation

permissions:
  contents: write

jobs:
  mode-aware-presentation:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: orbit-ui-mode-aware-presentation

      - name: Make viewport presentation mode-aware
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('engine/studio_ui/src/StudioExpansionShell.cpp')
          text = path.read_text(encoding='utf-8')

          old = '''    if (ViewportControlsRelevant())\n    {\n        const std::string_view id = SelectedViewportId();\n        const auto* target = owner_->session_->Viewports().Find(id);\n\n        context.SameLine();\n        if (target != nullptr &&\n            target->mode == studio_session::ViewportMode::Debug)\n        {\n            const auto catalog = terrain_debug::FieldCatalog();\n            std::vector<std::string_view> names;\n            names.reserve(catalog.size());\n\n            i32 selected = 0;\n            const auto field = owner_->views_->DebugField(id);\n            for (std::size_t index = 0U; index < catalog.size(); ++index)\n            {\n                names.push_back(catalog[index].name);\n                if (catalog[index].field == field)\n                {\n                    selected = static_cast<i32>(index);\n                }\n            }\n\n            if (!names.empty() &&\n                context.Combo(\n                    "##viewport-debug-field-compact",\n                    names,\n                    selected))\n            {\n                selected = std::clamp<i32>(\n                    selected,\n                    0,\n                    static_cast<i32>(catalog.size()) - 1);\n                owner_->views_->SetDebugField(\n                    id,\n                    catalog[static_cast<std::size_t>(selected)].field);\n            }\n        }\n        else\n        {\n            i32 surface = static_cast<i32>(\n                owner_->views_->SurfaceDebugMode(id));\n            if (context.Combo(\n                    "##surface-debug-mode",\n                    kSurfaceViews,\n                    surface))\n            {\n                surface = std::clamp(surface, 0, 3);\n                owner_->views_->SetSurfaceDebugMode(\n                    id,\n                    static_cast<lighting::SurfaceDebugMode>(surface));\n            }\n        }\n    }\n\n    context.SameLine();\n'''

          new = '''    if (ViewportControlsRelevant())\n    {\n        const std::string_view id = SelectedViewportId();\n        const auto* target = owner_->session_->Viewports().Find(id);\n\n        if (target != nullptr)\n        {\n            switch (target->mode)\n            {\n            case studio_session::ViewportMode::Perspective:\n            {\n                context.SameLine();\n                i32 surface = static_cast<i32>(\n                    owner_->views_->SurfaceDebugMode(id));\n                if (context.Combo(\n                        "##surface-debug-mode",\n                        kSurfaceViews,\n                        surface))\n                {\n                    surface = std::clamp(surface, 0, 3);\n                    owner_->views_->SetSurfaceDebugMode(\n                        id,\n                        static_cast<lighting::SurfaceDebugMode>(surface));\n                }\n                break;\n            }\n\n            case studio_session::ViewportMode::Debug:\n            {\n                context.SameLine();\n                const auto catalog = terrain_debug::FieldCatalog();\n                std::vector<std::string_view> names;\n                names.reserve(catalog.size());\n\n                i32 selected = 0;\n                const auto field = owner_->views_->DebugField(id);\n                for (std::size_t index = 0U; index < catalog.size(); ++index)\n                {\n                    names.push_back(catalog[index].name);\n                    if (catalog[index].field == field)\n                    {\n                        selected = static_cast<i32>(index);\n                    }\n                }\n\n                if (!names.empty() &&\n                    context.Combo(\n                        "##viewport-debug-field-compact",\n                        names,\n                        selected))\n                {\n                    selected = std::clamp<i32>(\n                        selected,\n                        0,\n                        static_cast<i32>(catalog.size()) - 1);\n                    owner_->views_->SetDebugField(\n                        id,\n                        catalog[static_cast<std::size_t>(selected)].field);\n                }\n                break;\n            }\n\n            case studio_session::ViewportMode::BodyMap:\n            case studio_session::ViewportMode::System:\n                break;\n            }\n        }\n    }\n\n    context.SameLine();\n'''

          if old not in text:
              raise SystemExit('presentation block anchor not found')

          updated = text.replace(old, new, 1)
          path.write_text(updated, encoding='utf-8')
          PY

      - name: Verify focused diff
        shell: bash
        run: |
          git diff --check
          test "$(git diff --name-only)" = "engine/studio_ui/src/StudioExpansionShell.cpp"
          grep -q 'case studio_session::ViewportMode::Perspective:' engine/studio_ui/src/StudioExpansionShell.cpp
          grep -q 'case studio_session::ViewportMode::Debug:' engine/studio_ui/src/StudioExpansionShell.cpp
          grep -q 'case studio_session::ViewportMode::BodyMap:' engine/studio_ui/src/StudioExpansionShell.cpp
          grep -q 'case studio_session::ViewportMode::System:' engine/studio_ui/src/StudioExpansionShell.cpp

      - name: Commit validation change
        shell: bash
        run: |
          git config user.name "orbit-ui-validation"
          git config user.email "orbit-ui-validation@users.noreply.github.com"
          git add engine/studio_ui/src/StudioExpansionShell.cpp
          git commit -m "Make viewport presentation mode-aware"
          git push origin HEAD:orbit-ui-mode-aware-presentation
