name: Orbit UI transform-space validation

on:
  push:
    branches:
      - orbit-ui-transform-space-properties

permissions:
  contents: write

jobs:
  move-transform-space:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: orbit-ui-transform-space-properties

      - name: Move transform space into Properties
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('engine/studio_ui/src/StudioExpansionShell.cpp')
          text = path.read_text(encoding='utf-8')

          anchor = '''    if (context.Combo(\n            "Layout##viewport-layout-properties",\n            kLayouts,\n            layout))\n    {\n        viewportState_.SetLayout(\n            static_cast<ViewportLayout>(layout));\n    }\n\n    const std::string_view id = SelectedViewportId();\n'''
          insert = '''    if (context.Combo(\n            "Layout##viewport-layout-properties",\n            kLayouts,\n            layout))\n    {\n        viewportState_.SetLayout(\n            static_cast<ViewportLayout>(layout));\n    }\n\n    static constexpr std::array<std::string_view, 2>\n        kTransformSpaces{"World", "Local"};\n    i32 transformSpace = static_cast<i32>(viewportState_.gizmo.space);\n    if (context.Combo(\n            "Transform Space##viewport-transform-space-properties",\n            kTransformSpaces,\n            transformSpace))\n    {\n        transformSpace = std::clamp(transformSpace, 0, 1);\n        viewportState_.gizmo.space =\n            static_cast<GizmoSpace>(transformSpace);\n    }\n\n    const std::string_view id = SelectedViewportId();\n'''

          row = '''    context.SameLine();\n    if (context.Button(\n            viewportState_.gizmo.space == GizmoSpace::World\n                ? "World##gizmo-space"\n                : "Local##gizmo-space"))\n    {\n        viewportState_.gizmo.space =\n            viewportState_.gizmo.space == GizmoSpace::World\n                ? GizmoSpace::Local\n                : GizmoSpace::World;\n    }\n\n'''

          if anchor not in text or row not in text:
              raise SystemExit('transform-space move anchors not found')
          text = text.replace(anchor, insert, 1).replace(row, '', 1)
          if '##gizmo-space' in text:
              raise SystemExit('row transform-space toggle remains')
          path.write_text(text, encoding='utf-8')
          PY

      - name: Verify and commit
        shell: bash
        run: |
          git diff --check
          test "$(git diff --name-only)" = "engine/studio_ui/src/StudioExpansionShell.cpp"
          git config user.name "orbit-ui-validation"
          git config user.email "orbit-ui-validation@users.noreply.github.com"
          git add engine/studio_ui/src/StudioExpansionShell.cpp
          git commit -m "Move transform space into Properties"
          git push origin HEAD:orbit-ui-transform-space-properties
