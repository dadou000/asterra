name: Orbit Studio Smoke

on:
  push:
    branches: [orbit, pre0.0.9-experimental]
    paths:
      - '.github/workflows/orbit-studio-smoke.yml'
      - 'apps/editor/**'
      - 'engine/editor_rpc/**'
      - 'engine/editor_session/**'
      - 'engine/editor_ui/**'
      - 'engine/studio_session/**'
      - 'engine/studio_ui/**'
      - 'engine/world_model/**'
      - 'engine/render_view/**'
      - 'engine/render_graph/**'
  workflow_dispatch:

concurrency:
  group: orbit-studio-smoke-${{ github.ref }}
  cancel-in-progress: false

jobs:
  studio-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Vulkan SDK
        shell: pwsh
        run: |
          choco install vulkan-sdk --version=1.4.350 -y --no-progress
          if ($LASTEXITCODE -ne 0) {
            throw "Vulkan SDK installation failed with exit code $LASTEXITCODE"
          }
          $sdk = "C:\VulkanSDK\1.4.350.0"
          "VULKAN_SDK=$sdk" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "$sdk\Bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Configure
        run: cmake -S . -B build-studio-smoke -DORBIT_WARNINGS_AS_ERRORS=ON

      - name: Build Studio seam
        run: >
          cmake --build build-studio-smoke --config Release --target
          OrbitEditorSessionRpcHostTests
          OrbitStudioSessionTests
          OrbitStudioTerrainRuntimeBridgeTests
          OrbitStudioTerrainRebuildSchedulerTests
          OrbitStudioTerrainPhysicalPageServiceTests
          OrbitStudioTerrainDiagnosticOverlayGeometryTests
          OrbitStudioViewportCameraTests
          OrbitStudioViewportNavigationTests
          OrbitStudioViewportPresentationTests
          OrbitStudioShellModelTests
          OrbitStudio
          OrbitPlayer

      - name: Test editor session RPC host
        run: build-studio-smoke/engine/editor_rpc/Release/OrbitEditorSessionRpcHostTests.exe

      - name: Test Studio session
        run: build-studio-smoke/engine/studio_session/Release/OrbitStudioSessionTests.exe

      - name: Test terrain runtime bridge
        run: build-studio-smoke/engine/studio_session/Release/OrbitStudioTerrainRuntimeBridgeTests.exe

      - name: Test terrain rebuild scheduler
        run: build-studio-smoke/engine/studio_session/Release/OrbitStudioTerrainRebuildSchedulerTests.exe

      - name: Test terrain physical pages
        run: build-studio-smoke/engine/studio_session/Release/OrbitStudioTerrainPhysicalPageServiceTests.exe

      - name: Test terrain diagnostic overlay geometry
        run: build-studio-smoke/engine/studio_ui/Release/OrbitStudioTerrainDiagnosticOverlayGeometryTests.exe

      - name: Test viewport camera
        run: build-studio-smoke/engine/studio_ui/Release/OrbitStudioViewportCameraTests.exe

      - name: Test viewport navigation
        run: build-studio-smoke/engine/studio_ui/Release/OrbitStudioViewportNavigationTests.exe

      - name: Test viewport presentation
        run: build-studio-smoke/engine/studio_ui/Release/OrbitStudioViewportPresentationTests.exe

      - name: Test Studio shell model
        run: build-studio-smoke/engine/studio_ui/Release/OrbitStudioShellModelTests.exe

      - name: Verify Studio executable
        shell: pwsh
        run: |
          if (-not (Test-Path "build-studio-smoke/apps/editor/Release/OrbitStudio.exe")) {
            throw "OrbitStudio.exe was not produced."
          }

      - name: Verify Player executable
        shell: pwsh
        run: |
          if (-not (Test-Path "build-studio-smoke/apps/player/Release/OrbitPlayer.exe")) {
            throw "OrbitPlayer.exe was not produced."
          }
