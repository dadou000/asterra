name: Orbit UI viewport mode name fix

on:
  push:
    branches:
      - orbit-ui-quick-create-argument-form

permissions:
  contents: write

jobs:
  viewport-mode-name-fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: orbit-ui-quick-create-argument-form
      - name: Apply build blocker fix
        run: python3 tools/validation/studio_viewport_mode_name_fix.py
      - name: Verify and commit
        shell: bash
        run: |
          git diff --check
          test "$(git diff --name-only)" = "engine/studio_ui/src/StudioExpansionShell.cpp"
          grep -q 'ViewportModeDisplayName' engine/studio_ui/src/StudioExpansionShell.cpp
          git config user.name "orbit-ui-validation"
          git config user.email "orbit-ui-validation@users.noreply.github.com"
          git add engine/studio_ui/src/StudioExpansionShell.cpp
          git commit -m "Disambiguate Studio viewport mode display name"
          git push origin HEAD:orbit-ui-quick-create-argument-form
