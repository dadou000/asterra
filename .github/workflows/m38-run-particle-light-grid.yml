name: M38 Run Particle Light Grid
on:
  push:
    branches: [orbit]
    paths:
      - 'tools/m38_particle_light_grid_patch.py'
      - '.github/workflows/m38-run-particle-light-grid.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: orbit
      - name: Apply patch
        run: python3 tools/m38_particle_light_grid_patch.py
      - name: Verify
        run: |
          grep -q 'ParticleLightGridResolution = 32U' engine/volume_render/include/orbit/volume_render/VolumeParticleRenderer.hpp
          grep -q 'kParticleLightGridShader' engine/volume_render/src/VolumeParticleRenderer.cpp
          grep -q 'ParticleLightGrid() noexcept' engine/volume_render/src/VolumeParticleRenderer.cpp
      - name: Commit
        run: |
          rm tools/m38_particle_light_grid_patch.py
          rm .github/workflows/m38-run-particle-light-grid.yml
          git config user.name orbit-ci
          git config user.email orbit-ci@users.noreply.github.com
          git add -A
          git commit -m 'Add M38 GPU particle light grid'
          git push origin HEAD:orbit
