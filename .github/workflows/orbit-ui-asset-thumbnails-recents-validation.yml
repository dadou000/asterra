name: Orbit UI asset thumbnails recents validation
on:
  push:
    branches: [orbit-ui-asset-thumbnails-recents]
permissions:
  contents: write
jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: orbit-ui-asset-thumbnails-recents
      - name: Apply production patch
        shell: bash
        run: |
          python tools/validation/asset_thumbnail_recents_patch.py
          python tools/validation/studio_viewport_split_fix.py
      - name: Validate source
        shell: bash
        run: |
          git diff --check
          grep -q 'src/AssetThumbnailCache.cpp' engine/studio_ui/CMakeLists.txt
          grep -q 'SetAssetThumbnailCache' engine/studio_ui/include/orbit/studio_ui/StudioViewportPanels.hpp
          grep -q 'quickCreateRecentAssets_' engine/studio_ui/include/orbit/studio_ui/StudioExpansionShell.hpp
          grep -q 'assetThumbnailCache' apps/editor/src/Main.cpp
          grep -q 'context.MutedText("Recent")' engine/studio_ui/src/StudioExpansionShell.cpp
          grep -q 'InteractiveImage' engine/studio_ui/src/StudioExpansionShell.cpp
          grep -q 'StudioViewportPanels::RegisterBase' engine/studio_ui/src/StudioViewportPanelsBase.cpp
          grep -q 'StudioViewportPanels::DrawViewBase' engine/studio_ui/src/StudioViewportPanelsBase.cpp
          ! grep -q '^#define Register ' engine/studio_ui/src/StudioViewportPanels.cpp
          ! grep -q '^#define DrawView ' engine/studio_ui/src/StudioViewportPanels.cpp
      - name: Install Vulkan SDK
        shell: powershell
        run: |
          choco install vulkan-sdk -y --no-progress
          $sdk = Get-ChildItem 'C:\VulkanSDK' -Directory | Sort-Object Name -Descending | Select-Object -First 1
          if ($null -eq $sdk) { throw 'Vulkan SDK install did not create C:\VulkanSDK.' }
          "VULKAN_SDK=$($sdk.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "$($sdk.FullName)\Bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Configure Orbit
        shell: bash
        run: cmake -S . -B build -DBUILD_TESTING=OFF -DORBIT_WARNINGS_AS_ERRORS=OFF
      - name: Build Studio UI
        shell: bash
        run: cmake --build build --config Release --target OrbitStudioUi -j 2
      - name: Commit validated production changes
        shell: bash
        run: |
          git config user.name orbit-ui-validation
          git config user.email orbit-ui-validation@users.noreply.github.com
          git add engine/studio_ui/CMakeLists.txt engine/studio_ui/include/orbit/studio_ui/StudioViewportPanels.hpp engine/studio_ui/include/orbit/studio_ui/StudioExpansionShell.hpp engine/studio_ui/src/StudioExpansionShell.cpp engine/studio_ui/src/StudioViewportPanels.cpp engine/studio_ui/src/StudioViewportPanelsBase.cpp apps/editor/src/Main.cpp
          git commit -m "Add thumbnail-backed recent asset picker"
          git push origin HEAD:orbit-ui-asset-thumbnails-recents
