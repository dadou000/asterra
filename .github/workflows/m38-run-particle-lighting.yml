name: M38 Run Particle Lighting
on:
  push:
    branches: [orbit]
    paths:
      - 'tools/m38_particle_lighting_patch.py'
      - '.github/workflows/m38-run-particle-lighting.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: orbit
      - name: Apply patch
        run: python3 tools/m38_particle_lighting_patch.py
      - name: Verify
        run: |
          grep -q 'MaximumLocalLightCount = 64U' engine/volume_render/include/orbit/volume_render/VolumeParticleRenderer.hpp
          grep -q 'ParticleIncident' engine/volume_render/src/VolumeParticleRenderer.cpp
          grep -q 'SetGraphicsBuffer(8U' engine/volume_render/src/VolumeParticleRenderer.cpp
          grep -q 'particleLocalLights' engine/studio_ui/src/StudioViewportRenderer.cpp
      - name: Commit
        run: |
          rm tools/m38_particle_lighting_patch.py
          rm .github/workflows/m38-run-particle-lighting.yml
          git config user.name orbit-ci
          git config user.email orbit-ci@users.noreply.github.com
          git add -A
          git commit -m 'Light M38 particles from shared scene lights'
          git push origin HEAD:orbit
