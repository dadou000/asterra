name: Apply Weather L0 Postfix

on:
  push:
    branches:
      - weather/0.0.5
    paths:
      - .github/workflows/apply-weather-l0-postfix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: weather/0.0.5
      - name: Fix generated native migration details
        run: |
          python3 - <<'PY'
          from pathlib import Path

          core_path = Path('native/weather/src/weather_native.cpp')
          core = core_path.read_text(encoding='utf-8')

          # The migration script inserted this scale at the first polar-resolution
          # block, which is weather_rgba_from, where upper_ice does not exist.
          bad = '\t\tupper_ice *= old_six_level_column_scale();\n\t\tfloat polar_resolution = 1.0f;'
          if bad not in core:
              raise SystemExit('misplaced upper_ice scale not found')
          core = core.replace(bad, '\t\tfloat polar_resolution = 1.0f;', 1)

          # Apply the scale where upper_ice is actually integrated.
          conv_start = core.index('static PackedFloat32Array convective_rgba_from')
          conv_end = core.index('\n\nPackedFloat32Array WeatherNative::get_global_convective_rgba', conv_start)
          conv = core[conv_start:conv_end]
          needle = '''\t\tfor (int layer = 0; layer < WeatherNative::LAYERS; ++layer) {
          \t\t\tint i = a.layer_offset(layer) + c;
          \t\t\tif (WeatherNative::APPROX_HEIGHT_M[layer] >= 5600.0f) upper_ice += a.ice[i] * WeatherNative::DEFAULT_LAYER_WEIGHTS[layer];
          \t\t}
          '''
          # Normalize indentation from the here-doc literal before matching.
          needle = needle.replace('          ', '')
          if needle not in conv:
              raise SystemExit('convective upper-ice integration block not found')
          conv = conv.replace(needle, needle + '\t\tupper_ice *= old_six_level_column_scale();\n', 1)
          core = core[:conv_start] + conv + core[conv_end:]

          # Both L0 and the current 2.2 km nest now carry 30 levels. Their hot
          # row/column loops are independent and safe to distribute across workers.
          core = core.replace('#pragma omp parallel for schedule(static) if(is_global)',
                              '#pragma omp parallel for schedule(static)')
          core = core.replace('six prognostic condensate', '30 prognostic condensate')
          core_path.write_text(core, encoding='utf-8')

          wrapper_path = Path('native/weather/src/weather_native_oklahoma.cpp')
          wrapper = wrapper_path.read_text(encoding='utf-8')

          # Parallelize the sparse-cloud/severe wrapper itself; otherwise its scalar
          # 30-layer loops dominate after the AVX2 core has been parallelized.
          wrapper = wrapper.replace(
              '\tif (have_surface) {\n\t\tfor (int c = 0; c < a.cells; ++c) {',
              '\tif (have_surface) {\n\t\t#pragma omp parallel for schedule(static)\n\t\tfor (int c = 0; c < a.cells; ++c) {', 1)
          wrapper = wrapper.replace(
              '\tfor (int y = 0; y < a.height; ++y) {\n\t\tfor (int x = 0; x < a.width; ++x) {',
              '\t#pragma omp parallel for schedule(static)\n\tfor (int y = 0; y < a.height; ++y) {\n\t\tfor (int x = 0; x < a.width; ++x) {', 1)
          wrapper = wrapper.replace(
              '\t\tfor (int c = 0; c < a.cells; ++c) {\n\t\t\tconst int i = off + c;',
              '\t\t#pragma omp parallel for schedule(static)\n\t\tfor (int c = 0; c < a.cells; ++c) {\n\t\t\tconst int i = off + c;', 1)
          # First occurrence after vertical_pass only.
          vstart = wrapper.index('void WeatherNative::vertical_pass(Atmosphere &a, bool is_global, float dt) {')
          vend = wrapper.index('\n\nvoid WeatherNative::step_global', vstart)
          vblock = wrapper[vstart:vend]
          vblock = vblock.replace('\tfor (int c = 0; c < a.cells; ++c) {',
                                  '\t#pragma omp parallel for schedule(static)\n\tfor (int c = 0; c < a.cells; ++c) {', 1)
          wrapper = wrapper[:vstart] + vblock + wrapper[vend:]
          # Map remap is also cell-independent.
          rstart = wrapper.index('static PackedFloat32Array remap_sparse_severe_weather')
          rblock = wrapper[rstart:]
          rblock = rblock.replace('\tfor (int c = 0; c < a.cells; ++c) {',
                                  '\t#pragma omp parallel for schedule(static)\n\tfor (int c = 0; c < a.cells; ++c) {', 1)
          wrapper = wrapper[:rstart] + rblock
          wrapper_path.write_text(wrapper, encoding='utf-8')
          PY
      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add native/weather/src/weather_native.cpp native/weather/src/weather_native_oklahoma.cpp
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Fix 30-layer diagnostics and parallel severe closure"
            git push origin HEAD:weather/0.0.5
          fi
