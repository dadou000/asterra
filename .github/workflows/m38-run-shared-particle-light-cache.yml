name: M38 Run Shared Particle Light Cache
on:
  push:
    branches: [orbit]
    paths:
      - 'tools/m38_shared_particle_light_cache_patch.py'
      - '.github/workflows/m38-run-shared-particle-light-cache.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: orbit
      - name: Apply patch
        run: python3 tools/m38_shared_particle_light_cache_patch.py
      - name: Verify
        run: |
          grep -q 'ParticleLightGridReady' engine/volume_render/include/orbit/volume_render/VolumeParticleRenderer.hpp
          grep -q 'dummyParticleLightGrid' engine/volume_render/src/UniversalVolumeRendererBase.inc
          grep -q 'g_particleLightGrid : register(t7)' engine/volume_render/src/UniversalVolumeRendererBase.inc
          grep -q 'previousParticleLightGrid' engine/studio_ui/src/StudioViewportRenderer.cpp
          grep -q '32770U' engine/studio_ui/tests/VolumeParticleRenderBridgeTests.cpp
      - name: Commit
        run: |
          rm tools/m38_shared_particle_light_cache_patch.py
          rm .github/workflows/m38-run-shared-particle-light-cache.yml
          git config user.name orbit-ci
          git config user.email orbit-ci@users.noreply.github.com
          git add -A
          git commit -m 'Share M38 particle lighting with universal volumes'
          git push origin HEAD:orbit
