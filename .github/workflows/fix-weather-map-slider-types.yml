name: Fix weather map slider parser

on:
  push:
    branches: ["weather/0.0.5"]
    paths:
      - "tools/fix_weather_map_slider_types.py"
      - ".github/workflows/fix-weather-map-slider-types.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: weather/0.0.5
          fetch-depth: 0
      - name: Apply parser fix
        run: python tools/fix_weather_map_slider_types.py
      - name: Verify
        run: |
          grep -q 'var snapped: float = roundf' scripts/ui/weather_map.gd
          grep -q 'var slider_step: float' scripts/ui/weather_map.gd
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/ui/weather_map.gd
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Fix weather map slider type inference'
          git push origin HEAD:weather/0.0.5
