name: Finalize Orbit V0.0.3 Scaffold

on:
  push:
    branches: [orbit]
    paths:
      - tools/finalize_v003_m23.py
      - .github/workflows/orbit-scaffold-finalize.yml

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply M23 acceptance patch
        run: python tools/finalize_v003_m23.py

      - name: Verify patch changed expected sources
        shell: pwsh
        run: |
          git diff --check
          git diff --exit-code -- tools/finalize_v003_m23.py .github/workflows/orbit-scaffold-finalize.yml
          if (-not (git status --porcelain)) {
            throw "M23 finalizer produced no source changes"
          }

      - name: Commit M23 acceptance wiring
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/CMakeLists.txt docs/V0.0.3_SPEC.md
          git commit -m "Wire V0.0.3 integration proof"
          git push origin HEAD:orbit
