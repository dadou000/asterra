name: M38 Run Droplet Generation Fix
on:
  push:
    branches: [orbit]
    paths:
      - 'tools/m38_droplet_generation_fix.py'
      - '.github/workflows/m38-run-droplet-generation-fix.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: orbit
      - name: Apply patch
        run: python3 tools/m38_droplet_generation_fix.py
      - name: Verify
        run: |
          grep -q 'd.flags=e.generation' engine/volume_render/src/VolumeParticleGpuState.cpp
          grep -q 'e.generation=d.flags' engine/volume_render/src/VolumeParticleGpuState.cpp
      - name: Commit
        run: |
          rm tools/m38_droplet_generation_fix.py
          rm .github/workflows/m38-run-droplet-generation-fix.yml
          git config user.name orbit-ci
          git config user.email orbit-ci@users.noreply.github.com
          git add -A
          git commit -m 'Preserve M38 droplet splash source generation'
          git push origin HEAD:orbit
