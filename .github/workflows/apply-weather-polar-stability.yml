name: Apply weather polar stability patch

on:
  push:
    branches: ["weather/0.0.5"]
    paths:
      - ".github/workflows/apply-weather-polar-stability.yml"
      - "tools/apply_weather_polar_patch.py"
      - "tools/apply_weather_polar_patch_v2.py"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: weather/0.0.5
          fetch-depth: 0

      - name: Apply patch
        run: python tools/apply_weather_polar_patch_v2.py

      - name: Sanity checks
        shell: bash
        run: |
          grep -q "metric_coslat" native/weather/src/weather_native.cpp
          grep -q "polar_jet" native/weather/src/weather_native.cpp
          grep -q "suppress_global_pressure_checkerboard" native/weather/src/weather_native_oklahoma.cpp
          grep -q "!surface_fields_ready" native/weather/src/weather_native_oklahoma.cpp
          grep -q "WARP_SPEEDS" scripts/ui/weather_map.gd
          grep -q "u_trail_time_s" shaders/weather_wind_particles.gdshader

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add native/weather/src/weather_native.cpp native/weather/src/weather_native_oklahoma.cpp scripts/ui/weather_map.gd shaders/weather_wind_particles.gdshader
          git commit -m "Stabilize polar vortex and long-run weather"
          git push origin weather/0.0.5
