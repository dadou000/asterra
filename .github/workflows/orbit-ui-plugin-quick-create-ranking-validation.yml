name: Orbit UI plugin quick create ranking validation

on:
  push:
    branches:
      - orbit-ui-plugin-quick-create-ranking

permissions:
  contents: write

jobs:
  plugin-quick-create-ranking:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: orbit-ui-plugin-quick-create-ranking
      - name: Apply plugin quick create ranking
        run: python3 tools/validation/plugin_quick_create_ranking_patch.py
      - name: Verify and commit
        shell: bash
        run: |
          git diff --check
          test "$(git diff --name-only | wc -l)" -eq 1
          test "$(git diff --name-only)" = "engine/studio_ui/src/StudioExpansionShell.cpp"
          grep -q 'RankedPluginQuickCreateAction' engine/studio_ui/src/StudioExpansionShell.cpp
          grep -q 'pluginContextualActions' engine/studio_ui/src/StudioExpansionShell.cpp
          grep -q 'pluginFallbackActions' engine/studio_ui/src/StudioExpansionShell.cpp
          grep -q 'QuickCreateCommandPriority(category)' engine/studio_ui/src/StudioExpansionShell.cpp
          grep -q '!enablement.enabled' engine/studio_ui/src/StudioExpansionShell.cpp
          grep -q 'More Extensions' engine/studio_ui/src/StudioExpansionShell.cpp
          grep -q 'contribution.category' engine/studio_ui/src/StudioExpansionShell.cpp
          grep -q 'commandEntry->category' engine/studio_ui/src/StudioExpansionShell.cpp
          git config user.name "orbit-ui-validation"
          git config user.email "orbit-ui-validation@users.noreply.github.com"
          git add engine/studio_ui/src/StudioExpansionShell.cpp
          git commit -m "Rank plugin quick create actions contextually"
          git push origin HEAD:orbit-ui-plugin-quick-create-ranking
