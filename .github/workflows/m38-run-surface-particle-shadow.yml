name: M38 Run Surface Particle Shadow
on:
  push:
    branches: [orbit]
    paths:
      - 'tools/m38_surface_particle_shadow_patch.py'
      - '.github/workflows/m38-run-surface-particle-shadow.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: orbit
      - name: Apply patch
        run: python3 tools/m38_surface_particle_shadow_patch.py
      - name: Verify
        run: |
          grep -q 'cameraFrameAndParticleGrid' engine/lighting/src/DirectLighting.cpp
          grep -q 'ParticleGridTransmittance' engine/lighting/src/DirectLighting.cpp
          grep -q 'particleLightGridForDirect' engine/studio_ui/src/StudioViewportRenderer.cpp
          grep -q 'dummyParticleLightGrid_' engine/lighting/include/orbit/lighting/DirectLighting.hpp
      - name: Commit
        run: |
          rm tools/m38_surface_particle_shadow_patch.py
          rm .github/workflows/m38-run-surface-particle-shadow.yml
          git config user.name orbit-ci
          git config user.email orbit-ci@users.noreply.github.com
          git add -A
          git commit -m 'Apply M38 particle transmittance to surface lighting'
          git push origin HEAD:orbit
