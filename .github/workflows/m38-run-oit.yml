name: M38 Run Weighted OIT
on:
  push:
    branches: [orbit]
    paths:
      - 'tools/m38_oit_patch.py'
      - '.github/workflows/m38-run-oit.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: orbit
      - name: Apply patch
        run: python3 tools/m38_oit_patch.py
      - name: Verify
        run: |
          grep -q 'Additive' engine/rhi/include/orbit/rhi/Pipeline.hpp
          grep -q 'VK_BLEND_FACTOR_ONE' engine/rhi/vulkan/src/VulkanPipeline.cpp
          grep -q 'kOitCompositePixelShader' engine/volume_render/src/VolumeParticleRenderer.cpp
          grep -q 'EnsureOitTargets' engine/volume_render/include/orbit/volume_render/VolumeParticleRenderer.hpp
          grep -q 'particleFrameIndex);' engine/studio_ui/src/StudioViewportRenderer.cpp
      - name: Commit
        run: |
          rm tools/m38_oit_patch.py
          rm .github/workflows/m38-run-oit.yml
          git config user.name orbit-ci
          git config user.email orbit-ci@users.noreply.github.com
          git add -A
          git commit -m 'Add weighted OIT for M38 effects'
          git push origin HEAD:orbit
