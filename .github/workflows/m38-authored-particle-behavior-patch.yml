name: M38 Authored Particle Behavior Patch

on:
  push:
    branches: [orbit]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'orbit-ci'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: orbit
          fetch-depth: 0

      - name: Patch authored M38 output and particle behavior
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one seam, found {count}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          # Register persistent authored output/particle properties and resolve them.
          path = 'engine/world_model/src/VolumeSchemas.cpp'
          old = '''            {.id=kVolumeTemporalWeight,.name="Temporal Weight",.kind=schema::PropertyKind::Float,.defaultValue=0.85,.range={.minimum=0.0,.maximum=0.98},.advanced=true}\n'''
          new = '''            {.id=kVolumeTemporalWeight,.name="Temporal Weight",.kind=schema::PropertyKind::Float,.defaultValue=0.85,.range={.minimum=0.0,.maximum=0.98},.advanced=true},\n            {.id=kVolumeOutputParticlesEnabled,.name="Output Particles",.kind=schema::PropertyKind::Boolean,.defaultValue=false},\n            {.id=kVolumeOutputSurfaceDepositsEnabled,.name="Output Surface Deposits",.kind=schema::PropertyKind::Boolean,.defaultValue=false},\n            {.id=kVolumeOutputFieldThreshold,.name="Output Field Threshold",.kind=schema::PropertyKind::Float,.defaultValue=0.15,.range={.minimum=0.0,.maximum=64.0}},\n            {.id=kVolumeOutputParticleRate,.name="Particle Rate",.kind=schema::PropertyKind::Float,.unit="1/s",.defaultValue=64.0,.range={.minimum=0.0,.maximum=1000000.0}},\n            {.id=kVolumeOutputParticleBudget,.name="Particle Budget / Step",.kind=schema::PropertyKind::Integer,.defaultValue=i64{256},.range={.minimum=1.0,.maximum=1000000.0},.advanced=true},\n            {.id=kVolumeOutputSurfaceRate,.name="Surface Deposit Rate",.kind=schema::PropertyKind::Float,.unit="1/s",.defaultValue=24.0,.range={.minimum=0.0,.maximum=1000000.0}},\n            {.id=kVolumeOutputSurfaceBudget,.name="Surface Deposit Budget / Step",.kind=schema::PropertyKind::Integer,.defaultValue=i64{128},.range={.minimum=1.0,.maximum=1000000.0},.advanced=true},\n            {.id=kVolumeOutputSurfaceRadius,.name="Surface Deposit Radius",.kind=schema::PropertyKind::Float,.unit="m",.defaultValue=0.25,.range={.minimum=0.001,.maximum=10000.0}},\n            {.id=kVolumeOutputCandidateMultiplier,.name="Output Candidate Multiplier",.kind=schema::PropertyKind::Integer,.defaultValue=i64{8},.range={.minimum=1.0,.maximum=64.0},.advanced=true},\n            {.id=kVolumeOutputSurfaceEffect,.name="Surface Effect",.kind=schema::PropertyKind::Integer,.defaultValue=i64{0},.range={.minimum=0.0,.maximum=4.0}},\n            {.id=kVolumeOutputSurfaceHalfLife,.name="Surface Effect Half Life",.kind=schema::PropertyKind::Float,.unit="s",.defaultValue=30.0,.range={.minimum=0.0,.maximum=86400.0}},\n            {.id=kVolumeParticleLifetime,.name="Particle Lifetime",.kind=schema::PropertyKind::Float,.unit="s",.defaultValue=2.0,.range={.minimum=0.001,.maximum=3600.0}},\n            {.id=kVolumeParticleLinearDrag,.name="Particle Linear Drag",.kind=schema::PropertyKind::Float,.unit="1/s",.defaultValue=0.0,.range={.minimum=0.0,.maximum=100.0}},\n            {.id=kVolumeParticleRadiusMeters,.name="Particle Radius",.kind=schema::PropertyKind::Float,.unit="m",.defaultValue=0.08,.range={.minimum=0.001,.maximum=100.0}},\n            {.id=kVolumeParticleEmissionScale,.name="Particle Emission Scale",.kind=schema::PropertyKind::Float,.defaultValue=1.0,.range={.minimum=0.0,.maximum=1024.0}},\n            {.id=kVolumeParticleGravityMode,.name="Particle Gravity Mode",.kind=schema::PropertyKind::Integer,.defaultValue=i64{0},.range={.minimum=0.0,.maximum=1.0}},\n            {.id=kVolumeParticleGravityScale,.name="Particle Gravity Scale",.kind=schema::PropertyKind::Float,.defaultValue=1.0,.range={.minimum=0.0,.maximum=16.0}},\n            {.id=kVolumeParticleCollisionMode,.name="Particle Collision Mode",.kind=schema::PropertyKind::Integer,.defaultValue=i64{0},.range={.minimum=0.0,.maximum=3.0}},\n            {.id=kVolumeParticleRestitution,.name="Particle Restitution",.kind=schema::PropertyKind::Float,.defaultValue=0.25,.range={.minimum=0.0,.maximum=1.0}}\n'''
          replace_once(path, old, new)

          old = '''        .temporalWeight =\n            static_cast<f32>(\n                std::clamp(\n                    Read<f64>(\n                        objects,\n                        volume,\n                        kVolumeTemporalWeight,\n                        0.85),\n                    0.0,\n                    0.98))\n    };\n'''
          new = '''        .temporalWeight =\n            static_cast<f32>(\n                std::clamp(\n                    Read<f64>(\n                        objects,\n                        volume,\n                        kVolumeTemporalWeight,\n                        0.85),\n                    0.0,\n                    0.98)),\n        .outputParticlesEnabled = Read<bool>(objects, volume, kVolumeOutputParticlesEnabled, false),\n        .outputSurfaceDepositsEnabled = Read<bool>(objects, volume, kVolumeOutputSurfaceDepositsEnabled, false),\n        .outputFieldThreshold = static_cast<f32>(std::clamp(Read<f64>(objects, volume, kVolumeOutputFieldThreshold, 0.15), 0.0, 64.0)),\n        .outputParticleRatePerSecond = static_cast<f32>(std::clamp(Read<f64>(objects, volume, kVolumeOutputParticleRate, 64.0), 0.0, 1000000.0)),\n        .outputParticleBudgetPerStep = static_cast<u32>(std::clamp<i64>(Read<i64>(objects, volume, kVolumeOutputParticleBudget, 256), 1, 1000000)),\n        .outputSurfaceDepositRatePerSecond = static_cast<f32>(std::clamp(Read<f64>(objects, volume, kVolumeOutputSurfaceRate, 24.0), 0.0, 1000000.0)),\n        .outputSurfaceDepositBudgetPerStep = static_cast<u32>(std::clamp<i64>(Read<i64>(objects, volume, kVolumeOutputSurfaceBudget, 128), 1, 1000000)),\n        .outputSurfaceDepositRadiusMeters = static_cast<f32>(std::clamp(Read<f64>(objects, volume, kVolumeOutputSurfaceRadius, 0.25), 0.001, 10000.0)),\n        .outputCandidateMultiplier = static_cast<u32>(std::clamp<i64>(Read<i64>(objects, volume, kVolumeOutputCandidateMultiplier, 8), 1, 64)),\n        .outputSurfaceEffect = static_cast<VolumeSurfaceOutputEffect>(std::clamp<i64>(Read<i64>(objects, volume, kVolumeOutputSurfaceEffect, 0), 0, 4)),\n        .outputSurfaceEffectHalfLifeSeconds = static_cast<f32>(std::clamp(Read<f64>(objects, volume, kVolumeOutputSurfaceHalfLife, 30.0), 0.0, 86400.0)),\n        .particleLifetimeSeconds = static_cast<f32>(std::clamp(Read<f64>(objects, volume, kVolumeParticleLifetime, 2.0), 0.001, 3600.0)),\n        .particleLinearDragPerSecond = static_cast<f32>(std::clamp(Read<f64>(objects, volume, kVolumeParticleLinearDrag, 0.0), 0.0, 100.0)),\n        .particleRadiusMeters = static_cast<f32>(std::clamp(Read<f64>(objects, volume, kVolumeParticleRadiusMeters, 0.08), 0.001, 100.0)),\n        .particleEmissionScale = static_cast<f32>(std::clamp(Read<f64>(objects, volume, kVolumeParticleEmissionScale, 1.0), 0.0, 1024.0)),\n        .particleGravityMode = static_cast<VolumeParticleGravityMode>(std::clamp<i64>(Read<i64>(objects, volume, kVolumeParticleGravityMode, 0), 0, 1)),\n        .particleGravityScale = static_cast<f32>(std::clamp(Read<f64>(objects, volume, kVolumeParticleGravityScale, 1.0), 0.0, 16.0)),\n        .particleCollisionMode = static_cast<VolumeParticleCollisionMode>(std::clamp<i64>(Read<i64>(objects, volume, kVolumeParticleCollisionMode, 0), 0, 3)),\n        .particleRestitution = static_cast<f32>(std::clamp(Read<f64>(objects, volume, kVolumeParticleRestitution, 0.25), 0.0, 1.0))\n    };\n'''
          replace_once(path, old, new)

          # Extend the transport-neutral M38 request with per-particle authored behavior.
          path = 'engine/volume_representation/include/orbit/volume_representation/VolumeOutputCoupling.hpp'
          old = '''    f32 particleRatePerSecond{64.0F};\n    u32 particleBudgetPerStep{256U};\n\n    f32 surfaceDepositRatePerSecond{24.0F};\n'''
          new = '''    f32 particleRatePerSecond{64.0F};\n    u32 particleBudgetPerStep{256U};\n    f32 particleLifetimeSeconds{2.0F};\n    f32 particleLinearDragPerSecond{0.0F};\n    f32 particleRadiusMeters{0.08F};\n    f32 particleEmissionScale{1.0F};\n    world_model::VolumeParticleGravityMode particleGravityMode{world_model::VolumeParticleGravityMode::None};\n    f32 particleGravityScale{1.0F};\n    world_model::VolumeParticleCollisionMode particleCollisionMode{world_model::VolumeParticleCollisionMode::None};\n    f32 particleRestitution{0.25F};\n\n    f32 surfaceDepositRatePerSecond{24.0F};\n'''
          replace_once(path, old, new)

          old = '''    f32 authority{0.0F};\n    f32 density{0.0F};\n    f32 emission{0.0F};\n};\n'''
          new = '''    f32 authority{0.0F};\n    f32 density{0.0F};\n    f32 emission{0.0F};\n    f32 lifetimeSeconds{2.0F};\n    f32 linearDragPerSecond{0.0F};\n    f32 radiusMeters{0.08F};\n    f32 emissionScale{1.0F};\n    math::Float3 baseColor{1.0F, 1.0F, 1.0F};\n    math::Float3 emissionColor{1.0F, 0.32F, 0.06F};\n    world_model::VolumeParticleGravityMode gravityMode{world_model::VolumeParticleGravityMode::None};\n    f32 gravityScale{1.0F};\n    world_model::VolumeParticleCollisionMode collisionMode{world_model::VolumeParticleCollisionMode::None};\n    f32 restitution{0.25F};\n};\n'''
          replace_once(path, old, new)

          # Emit authored behavior with each event so volumes can differ safely.
          path = 'engine/volume_representation/src/VolumeOutputCoupling.cpp'
          old = '''    batch.particles.reserve(particleBudget.admitted);\n\n    const u32 particleCandidateLimit =\n'''
          new = '''    const f32 particleLifetime = std::isfinite(entry.settings.particleLifetimeSeconds) ? std::max(entry.settings.particleLifetimeSeconds, 0.001F) : 2.0F;\n    const f32 particleDrag = std::isfinite(entry.settings.particleLinearDragPerSecond) ? std::max(entry.settings.particleLinearDragPerSecond, 0.0F) : 0.0F;\n    const f32 particleRadius = std::isfinite(entry.settings.particleRadiusMeters) ? std::max(entry.settings.particleRadiusMeters, 0.001F) : 0.08F;\n    const f32 particleEmissionScale = std::isfinite(entry.settings.particleEmissionScale) ? std::max(entry.settings.particleEmissionScale, 0.0F) : 1.0F;\n    const f32 particleGravityScale = std::isfinite(entry.settings.particleGravityScale) ? std::max(entry.settings.particleGravityScale, 0.0F) : 1.0F;\n    const f32 particleRestitution = std::isfinite(entry.settings.particleRestitution) ? std::clamp(entry.settings.particleRestitution, 0.0F, 1.0F) : 0.25F;\n\n    batch.particles.reserve(particleBudget.admitted);\n\n    const u32 particleCandidateLimit =\n'''
          replace_once(path, old, new)

          old = '''            .authority = sample.authority,\n            .density = sample.density,\n            .emission = sample.emission\n        });\n'''
          new = '''            .authority = sample.authority,\n            .density = sample.density,\n            .emission = sample.emission,\n            .lifetimeSeconds = particleLifetime,\n            .linearDragPerSecond = particleDrag,\n            .radiusMeters = particleRadius,\n            .emissionScale = particleEmissionScale,\n            .baseColor = domain.scatteringColor,\n            .emissionColor = domain.emissionColor,\n            .gravityMode = entry.settings.particleGravityMode,\n            .gravityScale = particleGravityScale,\n            .collisionMode = entry.settings.particleCollisionMode,\n            .restitution = particleRestitution\n        });\n'''
          replace_once(path, old, new)

          # Synchronize transient coupling state from authored Volume properties every tick.
          path = 'engine/volume_representation/src/VolumeOutputRuntime.cpp'
          old = '''        const auto& settings =\n            VolumeOutputs().Settings(record.id);\n\n        if (!settings.particlesEnabled &&\n            !settings.surfaceDepositsEnabled)\n'''
          new = '''        auto& settings =\n            VolumeOutputs().Settings(record.id);\n        settings.particlesEnabled = domain->outputParticlesEnabled;\n        settings.surfaceDepositsEnabled = domain->outputSurfaceDepositsEnabled;\n        settings.fieldThreshold = domain->outputFieldThreshold;\n        settings.particleRatePerSecond = domain->outputParticleRatePerSecond;\n        settings.particleBudgetPerStep = domain->outputParticleBudgetPerStep;\n        settings.particleLifetimeSeconds = domain->particleLifetimeSeconds;\n        settings.particleLinearDragPerSecond = domain->particleLinearDragPerSecond;\n        settings.particleRadiusMeters = domain->particleRadiusMeters;\n        settings.particleEmissionScale = domain->particleEmissionScale;\n        settings.particleGravityMode = domain->particleGravityMode;\n        settings.particleGravityScale = domain->particleGravityScale;\n        settings.particleCollisionMode = domain->particleCollisionMode;\n        settings.particleRestitution = domain->particleRestitution;\n        settings.surfaceDepositRatePerSecond = domain->outputSurfaceDepositRatePerSecond;\n        settings.surfaceDepositBudgetPerStep = domain->outputSurfaceDepositBudgetPerStep;\n        settings.surfaceDepositRadiusMeters = domain->outputSurfaceDepositRadiusMeters;\n        settings.candidateMultiplier = domain->outputCandidateMultiplier;\n        settings.surfaceEffect = static_cast<VolumeSurfaceEffect>(static_cast<u8>(domain->outputSurfaceEffect));\n        settings.surfaceEffectHalfLifeSeconds = domain->outputSurfaceEffectHalfLifeSeconds;\n\n        if (!settings.particlesEnabled &&\n            !settings.surfaceDepositsEnabled)\n'''
          replace_once(path, old, new)

          # Expand CPU->GPU spawn record to carry authored behavior and colors.
          path = 'engine/volume_render/include/orbit/volume_render/VolumeParticleGpuBinding.hpp'
          old = '''struct VolumeParticleGpuSpawn\n{\n    math::Float3 positionMeters{};\n    f32 authority{0.0F};\n    math::Float3 velocityMetersPerSecond{};\n    f32 density{0.0F};\n    f32 emission{0.0F};\n    f32 reserved0{0.0F};\n    f32 reserved1{0.0F};\n    f32 reserved2{0.0F};\n};\n\nstatic_assert(sizeof(VolumeParticleGpuSpawn) == 48U);\n'''
          new = '''struct VolumeParticleGpuSpawn\n{\n    math::Float3 positionMeters{};\n    f32 authority{0.0F};\n    math::Float3 velocityMetersPerSecond{};\n    f32 density{0.0F};\n    f32 emission{0.0F};\n    f32 lifetimeSeconds{2.0F};\n    f32 linearDragPerSecond{0.0F};\n    f32 radiusMeters{0.08F};\n    f32 emissionScale{1.0F};\n    f32 gravityScale{1.0F};\n    f32 restitution{0.25F};\n    u32 behaviorFlags{0U};\n    math::Float3 baseColor{1.0F, 1.0F, 1.0F};\n    f32 reserved0{0.0F};\n    math::Float3 emissionColor{1.0F, 0.32F, 0.06F};\n    f32 reserved1{0.0F};\n};\n\nstatic_assert(sizeof(VolumeParticleGpuSpawn) == 96U);\n'''
          replace_once(path, old, new)

          # Expand persistent GPU state to the same behavior-rich representation.
          path = 'engine/volume_render/include/orbit/volume_render/VolumeParticleGpuState.hpp'
          old = '''struct VolumeParticleGpuStateRecord\n{\n    math::Float3 positionMeters{};\n    f32 authority{0.0F};\n    math::Float3 velocityMetersPerSecond{};\n    f32 density{0.0F};\n    f32 emission{0.0F};\n    f32 ageSeconds{0.0F};\n    f32 lifetimeSeconds{0.0F};\n    u32 generation{0U};\n    math::Float4 reserved{};\n};\n\nstatic_assert(sizeof(VolumeParticleGpuStateRecord) == 64U);\n'''
          new = '''struct VolumeParticleGpuStateRecord\n{\n    math::Float3 positionMeters{};\n    f32 authority{0.0F};\n    math::Float3 velocityMetersPerSecond{};\n    f32 density{0.0F};\n    f32 emission{0.0F};\n    f32 ageSeconds{0.0F};\n    f32 lifetimeSeconds{0.0F};\n    f32 linearDragPerSecond{0.0F};\n    f32 radiusMeters{0.08F};\n    f32 emissionScale{1.0F};\n    f32 gravityScale{1.0F};\n    f32 restitution{0.25F};\n    math::Float3 baseColor{1.0F, 1.0F, 1.0F};\n    u32 behaviorFlags{0U};\n    math::Float3 emissionColor{1.0F, 0.32F, 0.06F};\n    u32 generation{0U};\n};\n\nstatic_assert(sizeof(VolumeParticleGpuStateRecord) == 96U);\n'''
          replace_once(path, old, new)

          # GPU simulation: preserve per-particle policy and use authored lifetime/drag.
          path = 'engine/volume_render/src/VolumeParticleGpuState.cpp'
          old = '''struct Spawn\n{\n    float3 positionMeters;\n    float authority;\n    float3 velocityMetersPerSecond;\n    float density;\n    float emission;\n    float reserved0;\n    float reserved1;\n    float reserved2;\n};\n\nstruct Particle\n{\n    float3 positionMeters;\n    float authority;\n    float3 velocityMetersPerSecond;\n    float density;\n    float emission;\n    float ageSeconds;\n    float lifetimeSeconds;\n    uint generation;\n    float4 reserved;\n};\n'''
          new = '''struct Spawn\n{\n    float3 positionMeters;\n    float authority;\n    float3 velocityMetersPerSecond;\n    float density;\n    float emission;\n    float lifetimeSeconds;\n    float linearDragPerSecond;\n    float radiusMeters;\n    float emissionScale;\n    float gravityScale;\n    float restitution;\n    uint behaviorFlags;\n    float3 baseColor;\n    float reserved0;\n    float3 emissionColor;\n    float reserved1;\n};\n\nstruct Particle\n{\n    float3 positionMeters;\n    float authority;\n    float3 velocityMetersPerSecond;\n    float density;\n    float emission;\n    float ageSeconds;\n    float lifetimeSeconds;\n    float linearDragPerSecond;\n    float radiusMeters;\n    float emissionScale;\n    float gravityScale;\n    float restitution;\n    float3 baseColor;\n    uint behaviorFlags;\n    float3 emissionColor;\n    uint generation;\n};\n'''
          replace_once(path, old, new)

          old = '''    const float spawnLifetime = max(g.timing.y, 0.001);\n    const float drag = max(g.timing.z, 0.0);\n'''
          new = '''    const float fallbackLifetime = max(g.timing.y, 0.001);\n    const float fallbackDrag = max(g.timing.z, 0.0);\n'''
          replace_once(path, old, new)

          old = '''                const float dragScale = exp(-drag * dt);\n                particle.velocityMetersPerSecond *= dragScale;\n'''
          new = '''                const float dragScale = exp(-max(particle.linearDragPerSecond, 0.0) * dt);\n                particle.velocityMetersPerSecond *= dragScale;\n'''
          replace_once(path, old, new)

          old = '''        particle.emission = max(spawn.emission, 0.0);\n        particle.ageSeconds = 0.0;\n        particle.lifetimeSeconds = spawnLifetime;\n        particle.generation = g.counts.y;\n        particle.reserved = 0.0;\n        AppendParticle(particle);\n'''
          new = '''        particle.emission = max(spawn.emission, 0.0);\n        particle.ageSeconds = 0.0;\n        particle.lifetimeSeconds = spawn.lifetimeSeconds > 0.0 ? spawn.lifetimeSeconds : fallbackLifetime;\n        particle.linearDragPerSecond = spawn.linearDragPerSecond >= 0.0 ? spawn.linearDragPerSecond : fallbackDrag;\n        particle.radiusMeters = max(spawn.radiusMeters, 0.001);\n        particle.emissionScale = max(spawn.emissionScale, 0.0);\n        particle.gravityScale = max(spawn.gravityScale, 0.0);\n        particle.restitution = saturate(spawn.restitution);\n        particle.baseColor = max(spawn.baseColor, 0.0);\n        particle.behaviorFlags = spawn.behaviorFlags;\n        particle.emissionColor = max(spawn.emissionColor, 0.0);\n        particle.generation = g.counts.y;\n        AppendParticle(particle);\n'''
          replace_once(path, old, new)

          # Bridge authored request fields into the GPU spawn packet.
          path = 'engine/studio_ui/include/orbit/studio_ui/VolumeParticleRenderBridge.hpp'
          old = '''        result.push_back({\n            .positionMeters = {\n                static_cast<f32>(relative.x),\n                static_cast<f32>(relative.y),\n                static_cast<f32>(relative.z)},\n            .authority = candidate.authority,\n            .velocityMetersPerSecond = request.velocity,\n            .density = std::isfinite(request.density)\n                ? std::max(request.density, 0.0F)\n                : 0.0F,\n            .emission = std::isfinite(request.emission)\n                ? std::max(request.emission, 0.0F)\n                : 0.0F\n        });\n'''
          new = '''        const u32 behaviorFlags =\n            (static_cast<u32>(request.gravityMode) & 0x3U) |\n            ((static_cast<u32>(request.collisionMode) & 0x3U) << 2U);\n\n        result.push_back({\n            .positionMeters = {\n                static_cast<f32>(relative.x),\n                static_cast<f32>(relative.y),\n                static_cast<f32>(relative.z)},\n            .authority = candidate.authority,\n            .velocityMetersPerSecond = request.velocity,\n            .density = std::isfinite(request.density)\n                ? std::max(request.density, 0.0F)\n                : 0.0F,\n            .emission = std::isfinite(request.emission)\n                ? std::max(request.emission, 0.0F)\n                : 0.0F,\n            .lifetimeSeconds = std::isfinite(request.lifetimeSeconds) ? std::max(request.lifetimeSeconds, 0.001F) : 2.0F,\n            .linearDragPerSecond = std::isfinite(request.linearDragPerSecond) ? std::max(request.linearDragPerSecond, 0.0F) : 0.0F,\n            .radiusMeters = std::isfinite(request.radiusMeters) ? std::max(request.radiusMeters, 0.001F) : 0.08F,\n            .emissionScale = std::isfinite(request.emissionScale) ? std::max(request.emissionScale, 0.0F) : 1.0F,\n            .gravityScale = std::isfinite(request.gravityScale) ? std::max(request.gravityScale, 0.0F) : 1.0F,\n            .restitution = std::isfinite(request.restitution) ? std::clamp(request.restitution, 0.0F, 1.0F) : 0.25F,\n            .behaviorFlags = behaviorFlags,\n            .baseColor = request.baseColor,\n            .emissionColor = request.emissionColor\n        });\n'''
          replace_once(path, old, new)

          # Renderer consumes physical radius and authored colors/emission scale.
          path = 'engine/volume_render/src/VolumeParticleRenderer.cpp'
          old = '''struct Particle\n{\n    float3 positionMeters;\n    float authority;\n    float3 velocityMetersPerSecond;\n    float density;\n    float emission;\n    float ageSeconds;\n    float lifetimeSeconds;\n    uint generation;\n    float4 reserved;\n};\n'''
          new = '''struct Particle\n{\n    float3 positionMeters;\n    float authority;\n    float3 velocityMetersPerSecond;\n    float density;\n    float emission;\n    float ageSeconds;\n    float lifetimeSeconds;\n    float linearDragPerSecond;\n    float radiusMeters;\n    float emissionScale;\n    float gravityScale;\n    float restitution;\n    float3 baseColor;\n    uint behaviorFlags;\n    float3 emissionColor;\n    uint generation;\n};\n'''
          replace_once(path, old, new)

          old = '''    float emission : TEXCOORD3;\n};\n'''
          new = '''    float emission : TEXCOORD3;\n    float3 baseColor : TEXCOORD4;\n    float3 emissionColor : TEXCOORD5;\n    float emissionScale : TEXCOORD6;\n    float lifeFraction : TEXCOORD7;\n};\n'''
          replace_once(path, old, new)

          old = '''        output.emission = 0.0;\n        return output;\n'''
          new = '''        output.emission = 0.0;\n        output.baseColor = 0.0;\n        output.emissionColor = 0.0;\n        output.emissionScale = 0.0;\n        output.lifeFraction = 0.0;\n        return output;\n'''
          replace_once(path, old, new)

          old = '''    const float2 corner = corners[cornerIndex];\n    const float radiusPixels = max(g.viewport.z, 0.5);\n\n    output.position = center;\n    output.position.xy += corner * ndcPerPixel * radiusPixels * center.w;\n'''
          new = '''    const float2 corner = corners[cornerIndex];\n    const float projectedRadiusPixels =\n        max(particle.radiusMeters, 0.001) /\n        max(center.w * max(g.projection.y, 0.001), 0.001) *\n        max(g.viewport.y, 1.0) * 0.5;\n    const float radiusPixels = max(projectedRadiusPixels, max(g.viewport.z, 0.5));\n\n    output.position = center;\n    output.position.xy += corner * ndcPerPixel * radiusPixels * center.w;\n'''
          replace_once(path, old, new)

          old = '''    output.emission = max(particle.emission, 0.0);\n    return output;\n}\n)";\n'''
          new = '''    output.emission = max(particle.emission, 0.0);\n    output.baseColor = max(particle.baseColor, 0.0);\n    output.emissionColor = max(particle.emissionColor, 0.0);\n    output.emissionScale = max(particle.emissionScale, 0.0);\n    output.lifeFraction = saturate(1.0 - particle.ageSeconds / max(particle.lifetimeSeconds, 0.001));\n    return output;\n}\n)";\n'''
          replace_once(path, old, new)

          # The same VSOutput structure appears in the pixel shader; update its first remaining occurrence.
          old = '''    float emission : TEXCOORD3;\n};\n\nfloat4 main(VSOutput input) : SV_Target0\n'''
          new = '''    float emission : TEXCOORD3;\n    float3 baseColor : TEXCOORD4;\n    float3 emissionColor : TEXCOORD5;\n    float emissionScale : TEXCOORD6;\n    float lifeFraction : TEXCOORD7;\n};\n\nfloat4 main(VSOutput input) : SV_Target0\n'''
          replace_once(path, old, new)

          old = '''    const float3 densityColor = lerp(\n        float3(0.70, 0.76, 0.82),\n        float3(0.93, 0.96, 1.00),\n        density);\n    const float3 emissiveColor = float3(1.00, 0.42, 0.08) * emission;\n    const float3 color = densityColor + emissiveColor;\n    const float alpha = soft * saturate(0.16 + 0.64 * authority + 0.20 * density);\n'''
          new = '''    const float3 densityColor = input.baseColor * lerp(0.72, 1.0, density);\n    const float3 emissiveColor = input.emissionColor * emission * input.emissionScale;\n    const float3 color = densityColor + emissiveColor;\n    const float alpha = soft * input.lifeFraction * saturate(0.16 + 0.64 * authority + 0.20 * density);\n'''
          replace_once(path, old, new)

          # Update custom authoring UI from transient singleton edits to authored commands.
          path = 'engine/studio_ui/src/VolumeAuthoringM36.cpp'
          p = Path(path)
          text = p.read_text(encoding='utf-8')
          start_marker = '''    auto& outputSettings =\n        volume_representation::\n            VolumeOutputs().Settings(\n                *volumeId);\n'''
          end_marker = '''    if ((outputSettings.particlesEnabled ||\n         outputSettings.surfaceDepositsEnabled) &&\n'''
          start = text.find(start_marker)
          end = text.find(end_marker)
          if start < 0 or end < 0 or end <= start:
              raise SystemExit('VolumeAuthoringM36.cpp: output settings seams not found')
          replacement = '''    bool particlesEnabled = volume->outputParticlesEnabled;\n    if (context.Checkbox("Particles##volume-output-particles", particlesEnabled))\n        world.Commands().SetProperty(*volumeId, world_model::kVolumeOutputParticlesEnabled, particlesEnabled);\n\n    bool depositsEnabled = volume->outputSurfaceDepositsEnabled;\n    if (context.Checkbox("Surface Deposits##volume-output-deposits", depositsEnabled))\n        world.Commands().SetProperty(*volumeId, world_model::kVolumeOutputSurfaceDepositsEnabled, depositsEnabled);\n\n    f64 threshold = volume->outputFieldThreshold;\n    if (context.InputDouble("Field Threshold##volume-output-threshold", threshold))\n        world.Commands().SetProperty(*volumeId, world_model::kVolumeOutputFieldThreshold, std::clamp(threshold, 0.0, 64.0));\n\n    f64 particleRate = volume->outputParticleRatePerSecond;\n    i64 particleBudget = static_cast<i64>(volume->outputParticleBudgetPerStep);\n    if (context.InputDouble("Particle Rate / s##volume-output-particle-rate", particleRate))\n        world.Commands().SetProperty(*volumeId, world_model::kVolumeOutputParticleRate, std::clamp(particleRate, 0.0, 1000000.0));\n    if (context.InputInteger("Particle Budget / Step##volume-output-particle-budget", particleBudget))\n        world.Commands().SetProperty(*volumeId, world_model::kVolumeOutputParticleBudget, std::clamp<i64>(particleBudget, 1, 1000000));\n\n    f64 lifetime = volume->particleLifetimeSeconds;\n    f64 drag = volume->particleLinearDragPerSecond;\n    f64 radius = volume->particleRadiusMeters;\n    f64 emissionScale = volume->particleEmissionScale;\n    if (context.InputDouble("Particle Lifetime s##volume-output-particle-life", lifetime))\n        world.Commands().SetProperty(*volumeId, world_model::kVolumeParticleLifetime, std::clamp(lifetime, 0.001, 3600.0));\n    if (context.InputDouble("Particle Linear Drag / s##volume-output-particle-drag", drag))\n        world.Commands().SetProperty(*volumeId, world_model::kVolumeParticleLinearDrag, std::clamp(drag, 0.0, 100.0));\n    if (context.InputDouble("Particle Radius m##volume-output-particle-radius", radius))\n        world.Commands().SetProperty(*volumeId, world_model::kVolumeParticleRadiusMeters, std::clamp(radius, 0.001, 100.0));\n    if (context.InputDouble("Particle Emission Scale##volume-output-particle-emission", emissionScale))\n        world.Commands().SetProperty(*volumeId, world_model::kVolumeParticleEmissionScale, std::clamp(emissionScale, 0.0, 1024.0));\n\n    context.Text("Particle Gravity");\n    for (const auto& [label, mode] : std::array{\n             std::pair{"None", world_model::VolumeParticleGravityMode::None},\n             std::pair{"Owning Body", world_model::VolumeParticleGravityMode::OwningBody}})\n    {\n        if (context.Selectable(std::string(label) + "##volume-output-gravity-" + std::to_string(static_cast<i64>(mode)), volume->particleGravityMode == mode))\n            world.Commands().SetProperty(*volumeId, world_model::kVolumeParticleGravityMode, static_cast<i64>(mode));\n    }\n    f64 gravityScale = volume->particleGravityScale;\n    if (context.InputDouble("Gravity Scale##volume-output-gravity-scale", gravityScale))\n        world.Commands().SetProperty(*volumeId, world_model::kVolumeParticleGravityScale, std::clamp(gravityScale, 0.0, 16.0));\n\n    context.Text("Particle Collision");\n    for (const auto& [label, mode] : std::array{\n             std::pair{"None", world_model::VolumeParticleCollisionMode::None},\n             std::pair{"Kill", world_model::VolumeParticleCollisionMode::Kill},\n             std::pair{"Slide", world_model::VolumeParticleCollisionMode::Slide},\n             std::pair{"Bounce", world_model::VolumeParticleCollisionMode::Bounce}})\n    {\n        if (context.Selectable(std::string(label) + "##volume-output-collision-" + std::to_string(static_cast<i64>(mode)), volume->particleCollisionMode == mode))\n            world.Commands().SetProperty(*volumeId, world_model::kVolumeParticleCollisionMode, static_cast<i64>(mode));\n    }\n    f64 restitution = volume->particleRestitution;\n    if (context.InputDouble("Restitution##volume-output-restitution", restitution))\n        world.Commands().SetProperty(*volumeId, world_model::kVolumeParticleRestitution, std::clamp(restitution, 0.0, 1.0));\n\n    f64 depositRate = volume->outputSurfaceDepositRatePerSecond;\n    i64 depositBudget = static_cast<i64>(volume->outputSurfaceDepositBudgetPerStep);\n    f64 depositRadius = volume->outputSurfaceDepositRadiusMeters;\n    if (context.InputDouble("Deposit Rate / s##volume-output-deposit-rate", depositRate))\n        world.Commands().SetProperty(*volumeId, world_model::kVolumeOutputSurfaceRate, std::clamp(depositRate, 0.0, 1000000.0));\n    if (context.InputInteger("Deposit Budget / Step##volume-output-deposit-budget", depositBudget))\n        world.Commands().SetProperty(*volumeId, world_model::kVolumeOutputSurfaceBudget, std::clamp<i64>(depositBudget, 1, 1000000));\n    if (context.InputDouble("Deposit Radius m##volume-output-deposit-radius", depositRadius))\n        world.Commands().SetProperty(*volumeId, world_model::kVolumeOutputSurfaceRadius, std::clamp(depositRadius, 0.001, 10000.0));\n\n    context.Text("Surface Effect");\n    for (const auto& [label, effect] : std::array{\n             std::pair{"Wetness", world_model::VolumeSurfaceOutputEffect::Wetness},\n             std::pair{"Soot", world_model::VolumeSurfaceOutputEffect::Soot},\n             std::pair{"Ash", world_model::VolumeSurfaceOutputEffect::Ash},\n             std::pair{"Sediment", world_model::VolumeSurfaceOutputEffect::Sediment},\n             std::pair{"Heat", world_model::VolumeSurfaceOutputEffect::Heat}})\n    {\n        if (context.Selectable(std::string(label) + "##volume-output-effect-" + std::to_string(static_cast<i64>(effect)), volume->outputSurfaceEffect == effect))\n            world.Commands().SetProperty(*volumeId, world_model::kVolumeOutputSurfaceEffect, static_cast<i64>(effect));\n    }\n    f64 halfLife = volume->outputSurfaceEffectHalfLifeSeconds;\n    if (context.InputDouble("Surface Effect Half Life s##volume-output-effect-half-life", halfLife))\n        world.Commands().SetProperty(*volumeId, world_model::kVolumeOutputSurfaceHalfLife, std::clamp(halfLife, 0.0, 86400.0));\n\n    i64 candidateMultiplier = static_cast<i64>(volume->outputCandidateMultiplier);\n    if (context.InputInteger("Candidate Multiplier##volume-output-candidates", candidateMultiplier))\n        world.Commands().SetProperty(*volumeId, world_model::kVolumeOutputCandidateMultiplier, std::clamp<i64>(candidateMultiplier, 1, 64));\n\n    context.MutedText("Gravity/collision policies are authored and transported per particle; body-gravity and surface-response GPU resolution is the next simulation hook.");\n\n'''
          text = text[:start] + replacement + text[end:]
          text = text.replace('''    if ((outputSettings.particlesEnabled ||\n         outputSettings.surfaceDepositsEnabled) &&\n''', '''    if ((volume->outputParticlesEnabled ||\n         volume->outputSurfaceDepositsEnabled) &&\n''', 1)
          p.write_text(text, encoding='utf-8')

      - name: Verify authored behavior integration
        shell: bash
        run: |
          set -euo pipefail
          grep -q "kVolumeParticleLifetime" engine/world_model/include/orbit/world_model/VolumeSchemas.hpp
          grep -q "particleLifetimeSeconds" engine/world_model/src/VolumeSchemas.cpp
          grep -q "settings.particleLifetimeSeconds = domain->particleLifetimeSeconds" engine/volume_representation/src/VolumeOutputRuntime.cpp
          grep -q "static_assert(sizeof(VolumeParticleGpuSpawn) == 96U)" engine/volume_render/include/orbit/volume_render/VolumeParticleGpuBinding.hpp
          grep -q "static_assert(sizeof(VolumeParticleGpuStateRecord) == 96U)" engine/volume_render/include/orbit/volume_render/VolumeParticleGpuState.hpp
          grep -q "particle.linearDragPerSecond" engine/volume_render/src/VolumeParticleGpuState.cpp
          grep -q "projectedRadiusPixels" engine/volume_render/src/VolumeParticleRenderer.cpp
          grep -q "kVolumeParticleCollisionMode" engine/studio_ui/src/VolumeAuthoringM36.cpp

      - name: Commit integration and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/m38-authored-particle-behavior-patch.yml
          git config user.name orbit-ci
          git config user.email orbit-ci@users.noreply.github.com
          git add -A
          git commit -m "Author M38 particle behavior per volume"
          git push origin HEAD:orbit
