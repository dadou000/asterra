name: M38 Particle Viewport Patch

on:
  push:
    branches: [orbit]
    paths:
      - '.github/workflows/m38-particle-viewport-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: orbit
          fetch-depth: 0
      - name: Apply exact M38 particle viewport patch
        run: python .github/scripts/apply_m38_particle_viewport.py
      - name: Verify patch seams
        run: |
          grep -q 'VolumeParticleRenderer volumeParticleRenderer_' engine/studio_ui/include/orbit/studio_ui/StudioViewportRenderer.hpp
          grep -q 'prefix + ".VolumeParticles"' engine/studio_ui/src/StudioViewportRenderer.cpp
          grep -q 'BuildVolumeParticleRenderBatch' engine/studio_ui/src/StudioViewportRenderer.cpp
      - name: Commit integration and self-delete patch machinery
        run: |
          rm .github/scripts/apply_m38_particle_viewport.py
          rm .github/workflows/m38-particle-viewport-patch.yml
          git config user.name 'orbit-ci'
          git config user.email 'orbit-ci@users.noreply.github.com'
          git add -A
          git commit -m 'Wire M38 particle rendering into Studio viewport'
          git push origin HEAD:orbit
