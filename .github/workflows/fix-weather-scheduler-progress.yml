name: Fix weather scheduler progress

on:
  push:
    branches: ["weather/0.0.5"]
    paths:
      - "tools/fix_weather_scheduler_progress.py"
      - ".github/workflows/fix-weather-scheduler-progress.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: weather/0.0.5
          fetch-depth: 0
      - name: Apply scheduler patch
        run: python tools/fix_weather_scheduler_progress.py
      - name: Verify
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'ANALYSIS_MAX_LAG_REVISIONS := 4' scripts/weather/weather_system.gd
          grep -q 'func _has_blocking_weather_publication' scripts/weather/weather_system.gd
          grep -q 'func _publish_global_weather() -> bool' scripts/weather/weather_system.gd
          grep -q 'solver %s' scripts/ui/weather_map.gd
          grep -q 'func _find_observer_recursive' scripts/weather/weather_system.gd
      - name: Commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/weather/weather_system.gd scripts/ui/weather_map.gd
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Fix weather scheduler stalls and expose solver progress'
          git push origin HEAD:weather/0.0.5
