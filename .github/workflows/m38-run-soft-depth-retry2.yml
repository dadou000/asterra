name: M38 Run Soft Depth Retry 2
on:
  push:
    branches: [orbit]
    paths:
      - '.github/workflows/m38-run-soft-depth-retry2.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: orbit
      - name: Correct duplicate guard seams and apply patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tools/m38_soft_depth_patch.py')
          t=p.read_text()
          old1="rep(p,'    float emissionScale : TEXCOORD7;\\n};','    float emissionScale : TEXCOORD7;\\n    float softnessMeters : TEXCOORD8;\\n};',)"
          new1="""t=Path(p).read_text(encoding='utf-8'); old_vs='    float emissionScale : TEXCOORD7;\\n};';\nif t.count(old_vs)<1: raise RuntimeError('particle VS seam missing');\nPath(p).write_text(t.replace(old_vs,'    float emissionScale : TEXCOORD7;\\n    float softnessMeters : TEXCOORD8;\\n};',1),encoding='utf-8')"""
          t=t.replace(old1,new1,1)
          pair="""rep(p,'        output.emissionScale = 0.0;\\n        return output;','        output.emissionScale = 0.0;\\n        output.softnessMeters = 0.0;\\n        return output;')\nrep(p,'        output.emissionScale = 0.0;\\n        return output;','        output.emissionScale = 0.0;\\n        output.softnessMeters = 0.0;\\n        return output;')"""
          repl="""t=Path(p).read_text(encoding='utf-8'); old_ret='        output.emissionScale = 0.0;\\n        return output;'; new_ret='        output.emissionScale = 0.0;\\n        output.softnessMeters = 0.0;\\n        return output;';\nif t.count(old_ret)!=2: raise RuntimeError(f'particle early-return seam count {t.count(old_ret)}');\nPath(p).write_text(t.replace(old_ret,new_ret,2),encoding='utf-8')"""
          if pair not in t: raise SystemExit('duplicate return guard seam not found')
          p.write_text(t.replace(pair,repl,1))
          PY
          python3 tools/m38_soft_depth_patch.py
      - name: Verify
        run: |
          grep -q 'SetRenderTargetsReadOnlyDepth' engine/rhi/include/orbit/rhi/Command.hpp
          grep -q 'VK_IMAGE_LAYOUT_DEPTH_READ_ONLY_OPTIMAL' engine/rhi/vulkan/src/VulkanCommands.cpp
          grep -q 'SoftDepth' engine/volume_render/src/VolumeParticleRenderer.cpp
          grep -q 'sampledTextures = 1U' engine/volume_render/src/VolumeParticleRenderer.cpp
      - name: Commit
        run: |
          rm tools/m38_soft_depth_patch.py
          rm .github/workflows/m38-run-soft-depth.yml
          rm .github/workflows/m38-run-soft-depth-retry.yml
          rm .github/workflows/m38-run-soft-depth-retry2.yml
          git config user.name orbit-ci
          git config user.email orbit-ci@users.noreply.github.com
          git add -A
          git commit -m 'Add soft depth intersections for M38 effects'
          git push origin HEAD:orbit
