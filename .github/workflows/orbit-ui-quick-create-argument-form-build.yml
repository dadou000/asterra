name: Orbit UI Quick Create argument form build

on:
  push:
    branches:
      - orbit-ui-quick-create-argument-form

jobs:
  build-studio:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: orbit-ui-quick-create-argument-form
      - name: Install Vulkan SDK
        shell: pwsh
        run: |
          choco install vulkan-sdk --version=1.4.350 -y --no-progress
          if ($LASTEXITCODE -ne 0) { throw "Vulkan SDK installation failed" }
          $sdk = "C:\VulkanSDK\1.4.350.0"
          "VULKAN_SDK=$sdk" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "$sdk\Bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Configure
        run: cmake -S . -B build-argument-form -DORBIT_WARNINGS_AS_ERRORS=ON
      - name: Build OrbitStudio
        run: cmake --build build-argument-form --config Release --target OrbitStudio
